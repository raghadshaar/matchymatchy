<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>صفحتي الشخصية</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
            padding: 50px;
        }

        .card {
            background-color: #fff;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            display: inline-block;
            padding: 30px;
            max-width: 400px;
        }

        img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 20px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            font-size: 16px;
            margin-bottom: 20px;
        }

        .buttons a {
            text-decoration: none;
            color: white;
            background-color: #4CAF50;
            padding: 10px 20px;
            margin: 5px;
            border-radius: 8px;
            display: inline-block;
        }

        .buttons a:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

<div class="card">
    <img src="https://via.placeholder.com/150" alt="صورتك">
    <h1>رغد شعار</h1>
    <p>طالبة مهتمة بالبرمجة وتطوير الواجهات</p>
    <div class="buttons">
        <a href="#">فيسبوك</a>
        <a href="#">لينكد إن</a>
    </div>
</div>

</body>
</html>
