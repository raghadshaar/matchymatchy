<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Matchy Matchy</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>

<header>
    <div class="logo">carter’s</div>
    <nav>
        <ul>
            <li><a href="#">Baby</a></li>
            <li><a href="#">Toddler</a></li>
            <li><a href="#">Kids</a></li>
            <li><a href="#">Brands</a></li>
            <li><a href="#">Deals</a></li>
        </ul>
    </nav>
    <div class="actions">
        <input type="text" placeholder="Find your product" />
        <span class="icon">👤</span>
        <span class="icon">🛒</span>
    </div>
</header>

<!-- Image Slider -->
<div class="slider">
    <img src="images/slide1.jpg" class="slide active" alt="Slide 1" />
    <img src="images/slide2.jpg" class="slide" alt="Slide 2" />
    <img src="images/slide3.jpg" class="slide" alt="Slide 3" />

    <button class="arrow left" onclick="prevSlide()">&#10094;</button>
    <button class="arrow right" onclick="nextSlide()">&#10095;</button>
</div>

<script src="script.js"></script>
</body>
</html>
