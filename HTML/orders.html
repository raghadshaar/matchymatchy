<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Matchy Matchy — Admin • Orders</title>

    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <!-- Your existing styles -->
    <link rel="stylesheet" href="../styles/sidebar.css"/>
    <link rel="stylesheet" href="../styles/products.css"/>
    <link rel="stylesheet" href="../styles/topbarAdmin.css"/>

    <style>
        :root{
            --badge-w: 96px;      /* عرض موحّد للبادج */
            --badge-h: 32px;      /* ارتفاع موحّد */
            /* تدرجات قريبة من الباليت */
            --teal-ink:#006d6d;   --teal-bg:#e5f4f4;   --teal-br:#cdeaea;   /* success */
            --amber-ink:#8a6000;  --amber-bg:#fff3d9;  --amber-br:#ffe2a6;  /* pending */
            --rose-ink:#a23c3c;   --rose-bg:#ffe7e7;   --rose-br:#ffd1d1;   /* error */
        }

        /* نفس الكلاس الموجود عندك، بس بمقاس ثابت وتوسيط */
        .chip{
            display:inline-flex; align-items:center; justify-content:center;
            min-width:var(--badge-w); height:var(--badge-h);
            padding:0 10px; border-radius:999px; font-weight:600; font-size:.85rem;
            border:1px solid transparent; white-space:nowrap;
        }

        /* قلّلنا الألوان: الأخضر والأزرق نفس الشكل (Teal) */
        .chip.green, .chip.blue { background:var(--teal-bg); color:var(--teal-ink); border-color:var(--teal-br); }
        .chip.amber { background:var(--amber-bg); color:var(--amber-ink); border-color:var(--amber-br); }
        .chip.red   { background:var(--rose-bg); color:var(--rose-ink);  border-color:var(--rose-br); }

        /* تمنع تكسّر في الخلايا اللي فيها البادج */
        td:nth-child(6), td:nth-child(7){ white-space:nowrap; }
        /* small tweaks on top of your theme */
        .toolbar .field { min-width: 260px; }
        .chip{display:inline-flex;align-items:center;padding:6px 10px;border-radius:999px;font-weight:600;font-size:.8rem;border:1px solid transparent}
        .chip.green{background:#e9f8f1;color:#1b8e57;border-color:#cdeedd}
        .chip.amber{background:#fff6e6;color:#ad8100;border-color:#ffe1ad}
        .chip.red{background:#ffecec;color:#b23535;border-color:#ffc9c9}
        .chip.blue{background:#eaf3ff;color:#1b63c7;border-color:#cfe3ff}
        .muted{color:#6b7280}
        .drawer .section-title{margin:18px 0 6px;font-weight:600;color:#715E51}
        .order-items{width:100%;border-collapse:separate;border-spacing:0}
        .order-items th,.order-items td{padding:10px;border-bottom:1px solid var(--border)}
        .order-items th{text-align:left;color:#6b7280;background:#faf9f7}
        .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
        @media (max-width:900px){.grid-2{grid-template-columns:1fr}}
    </style>
</head>
<body>
<div class="layout">
    <!-- Sidebar -->
    <div id="sidebar-container"></div>

    <!-- Main -->
    <main class="main">
        <!-- Topbar -->
        <div data-include="topBarAdmin.html"></div>

        <!-- Page header -->
        <div class="page-head">
            <div class="title-wrap">
                <h1>Orders</h1>
                <p class="muted">Track and manage all customer orders from your store.</p>
            </div>
        </div>

        <!-- Toolbar -->
        <div class="toolbar">
            <div class="field" style="flex:1">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input id="searchInput" type="search" placeholder="Search by Order ID, Customer Name, or Email…">
            </div>
            <div class="field">
                <i class="fa-solid fa-signal"></i>
                <select id="statusFilter" aria-label="Filter by status">
                    <option value="">All Status</option>
                    <option>Pending</option>
                    <option>Processing</option>
                    <option>Shipped</option>
                    <option>Delivered</option>
                    <option>Cancelled</option>
                </select>
            </div>
            <div class="field">
                <i class="fa-regular fa-credit-card"></i>
                <select id="paymentFilter" aria-label="Filter by payment">
                    <option value="">All Payments</option>
                    <option>Paid</option>
                    <option>Pending</option>
                    <option>Failed</option>
                    <option>Refunded</option>
                    <option>COD</option>
                </select>
            </div>
            <button class="btn btn-ghost" id="clearFilters"><i class="fa-solid fa-rotate-left"></i> Clear Filters</button>
        </div>

        <!-- Table -->
        <section class="card">
            <table>
                <thead>
                <tr>
                    <th style="width:40px;"><input type="checkbox" id="checkAll"/></th>
                    <th>Order ID</th>
                    <th>Customer</th>
                    <th>Date</th>
                    <th>Total</th>
                    <th>Payment</th>
                    <th>Status</th>
                    <th style="width:120px;">Actions</th>
                </tr>
                </thead>
                <tbody id="tbody"></tbody>
            </table>

            <div id="emptyState" class="empty" style="display:none">
                <div class="emoji">📦</div>
                <h3 style="margin:0 0 6px;color:var(--umber)">No orders yet</h3>
                <p style="margin:0 0 14px" class="muted">Start selling to see orders here.</p>
                <button class="btn btn-teal" id="emptyAddBtn"><i class="fa-solid fa-plus"></i> Add Order</button>
            </div>

            <!-- Pagination -->
            <div class="pager">
                <div class="pager-info" id="pagerInfo"></div>
                <button class="page-btn" id="prevPage"><i class="fa-solid fa-chevron-left"></i></button>
                <div id="pageNums" style="display:flex;gap:6px"></div>
                <button class="page-btn" id="nextPage"><i class="fa-solid fa-chevron-right"></i></button>
            </div>
        </section>
    </main>
</div>

<!-- Drawer: Order Details -->
<div class="drawer-backdrop" id="drawerBackdrop"></div>
<div class="drawer" id="drawer">
    <h3 id="drawerTitle">Order Details</h3>

    <div class="section-title">Customer</div>
    <div class="grid-2">
        <div><label class="muted">Name</label><input class="input" id="cName"/></div>
        <div><label class="muted">Email</label><input class="input" id="cEmail"/></div>
        <div><label class="muted">Phone</label><input class="input" id="cPhone"/></div>
        <div><label class="muted">Order ID</label><input class="input" id="oId" disabled/></div>
    </div>

    <div class="section-title">Shipping Address</div>
    <textarea class="textarea" id="cAddress" placeholder="Street, City, ZIP, Country"></textarea>

    <div class="section-title">Items</div>
    <table class="order-items" id="itemsTable">
        <thead><tr><th>Product</th><th>Price (₪)</th><th>Qty</th><th>Subtotal (₪)</th></tr></thead>
        <tbody></tbody>
    </table>

    <div class="grid-2" style="margin-top:10px">
        <div>
            <label class="muted">Payment Status</label>
            <select class="select" id="paymentStatus">
                <option>Paid</option><option>Pending</option><option>Failed</option><option>Refunded</option><option>COD</option>
            </select>
        </div>
        <div>
            <label class="muted">Order Status</label>
            <select class="select" id="orderStatus">
                <option>Pending</option><option>Processing</option><option>Shipped</option><option>Delivered</option><option>Cancelled</option>
            </select>
        </div>
    </div>

    <div class="section-title">Summary</div>
    <div class="grid-2">
        <div><label class="muted">Subtotal</label><input class="input" id="sumSubtotal" disabled/></div>
        <div><label class="muted">Shipping</label><input class="input" id="sumShipping"/></div>
        <div><label class="muted">Tax</label><input class="input" id="sumTax"/></div>
        <div><label class="muted">Total</label><input class="input" id="sumTotal" disabled/></div>
    </div>

    <div class="drawer-actions">
        <button class="btn btn-ghost" id="cancelDrawer">Cancel</button>
        <button class="btn btn-teal" id="saveOrder">Save</button>
    </div>
</div>

<script>
    /* ===== helpers & config ===== */
    const API_BASE = '/matchymatchy/api/Admin/orders.php';
    const PAGE_SIZE = 8;
    const $  = (s,c=document)=>c.querySelector(s);
    const $$ = (s,c=document)=>Array.from(c.querySelectorAll(s));
    const money = n => `₪${Number(n||0).toFixed(2)}`;

    function chipClass(kind,val){
        const v=(val||'').toLowerCase();
        if(kind==='payment'){ if(v==='paid') return 'green'; if(v==='pending'||v==='cod') return 'amber'; if(v==='failed'||v==='refunded') return 'red'; }
        if(kind==='status'){ if(v==='delivered') return 'green'; if(v==='shipped') return 'blue'; if(v==='processing'||v==='pending') return 'amber'; if(v==='cancelled') return 'red'; }
        return 'amber';
    }

    /* ===== API calls ===== */
    async function apiList({q='',status='',payment='',page=1,page_size=PAGE_SIZE}={}){
        const qs = new URLSearchParams({
            action:'list', q, status, payment, page:String(page), page_size:String(page_size)
        });
        const res = await fetch(`${API_BASE}?${qs.toString()}`, {headers:{'Accept':'application/json'}});
        const data = await res.json().catch(()=>({ok:false}));
        return data;
    }
    async function apiGet(id){
        const qs = new URLSearchParams({action:'get', id:String(id)});
        const res = await fetch(`${API_BASE}?${qs.toString()}`, {headers:{'Accept':'application/json'}});
        const data = await res.json().catch(()=>({ok:false}));
        return data;
    }
    async function apiUpdate(payload){
        const res = await fetch(API_BASE+'?action=update', {
            method:'POST',
            headers:{'Content-Type':'application/json','Accept':'application/json'},
            body: JSON.stringify(payload)
        });
        const data = await res.json().catch(()=>({ok:false}));
        return data;
    }
    async function apiDelete(id){
        const res = await fetch(API_BASE+'?action=delete', {
            method:'POST',
            headers:{'Content-Type':'application/json','Accept':'application/json'},
            body: JSON.stringify({id})
        });
        const data = await res.json().catch(()=>({ok:false}));
        return data;
    }

    /* ===== state ===== */
    let state = { q:'', status:'', payment:'', page:1 };
    let cachedPage = { rows:[], total:0, pages:1, page:1 };  // آخر نتيجة list

    /* ===== render table & pager ===== */
    function renderTable(){
        const rows = cachedPage.rows;
        $('#tbody').innerHTML = rows.map(o=>`
    <tr>
      <td><input type="checkbox" data-id="${o.id}"></td>
      <td><span class="muted">#</span>${o.public_id}</td>
      <td>
        <div style="display:flex;flex-direction:column">
          <strong>${o.customer_name||''}</strong>
          <span class="muted" style="font-size:.9rem">${o.customer_email||''}</span>
        </div>
      </td>
      <td>${o.order_date ? new Date(o.order_date.replace(' ', 'T')).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : ''}</td>
      <td>${money(o.total)}</td>
      <td><span class="chip ${chipClass('payment',o.payment_status)}">${o.payment_status}</span></td>
      <td><span class="chip ${chipClass('status',o.order_status)}">${o.order_status}</span></td>
      <td>
        <div class="row-actions">
          <button class="icon-link" title="View" data-view="${o.id}"><i class="fa-regular fa-eye"></i></button>
          <button class="icon-link" title="Edit" data-edit="${o.id}"><i class="fa-regular fa-pen-to-square"></i></button>
          <button class="icon-link" title="Delete" data-del="${o.id}"><i class="fa-regular fa-trash-can"></i></button>
        </div>
      </td>
    </tr>
  `).join('');

        // empty state
        $('#emptyState').style.display = rows.length ? 'none' : 'block';

        // pager info
        const start = rows.length ? ( (cachedPage.page-1)*PAGE_SIZE + 1 ) : 0;
        const end   = rows.length ? ( (cachedPage.page-1)*PAGE_SIZE + rows.length ) : 0;
        $('#pagerInfo').textContent = rows.length
            ? `Showing ${start}–${end} of ${cachedPage.total} orders`
            : 'No results';

        // page buttons
        const pages = Math.max(1, cachedPage.pages||1);
        $('#pageNums').innerHTML='';
        for(let i=1;i<=pages;i++){
            const b=document.createElement('button');
            b.className='page-btn'+(i===cachedPage.page?' active':'');
            b.textContent=i;
            b.onclick=()=>{ state.page=i; loadAndRender(); };
            $('#pageNums').appendChild(b);
        }
        $('#prevPage').disabled = cachedPage.page<=1;
        $('#nextPage').disabled = cachedPage.page>=pages;

        // row actions
        $$('[data-view]').forEach(b=>b.onclick=()=>openDrawer(b.dataset.view,false));
        $$('[data-edit]').forEach(b=>b.onclick=()=>openDrawer(b.dataset.edit,true));
        $$('[data-del]').forEach(b=>b.onclick=()=>removeOrder(b.dataset.del));
    }

    /* ===== load & render list ===== */
    async function loadAndRender(){
        const resp = await apiList({
            q: state.q, status: state.status, payment: state.payment,
            page: state.page, page_size: PAGE_SIZE
        });
        if(!resp || !resp.ok){
            cachedPage = {rows:[], total:0, pages:1, page:1};
        }else{
            const d = resp.data || {};
            cachedPage = {
                rows: d.rows || d.orders || [],
                total: Number(d.total||0),
                pages: Number(d.pages||1),
                page: Number(d.page||1)
            };
        }
        renderTable();
    }

    /* ===== drawer (view/edit) ===== */
    const drawer=$('#drawer'), backdrop=$('#drawerBackdrop');
    const els={
        oId:$('#oId'), cName:$('#cName'), cEmail:$('#cEmail'), cPhone:$('#cPhone'), cAddress:$('#cAddress'),
        pStat:$('#paymentStatus'), oStat:$('#orderStatus'),
        tBody:$('#itemsTable tbody'),
        sub:$('#sumSubtotal'), ship:$('#sumShipping'), tax:$('#sumTax'), total:$('#sumTotal')
    };
    let currentId=null, editMode=false;

    function setDrawerEnabled(editable){
        [els.cName,els.cEmail,els.cPhone,els.cAddress,els.pStat,els.oStat,els.ship,els.tax].forEach(el=>el.disabled=!editable);
        $('#saveOrder').style.display = editable ? '' : 'none';
    }

    async function openDrawer(id, editable){
        const j = await apiGet(id);
        if(!j || !j.ok){ alert('Failed to load order'); return; }
        const o = j.order || {};
        const items = j.items || [];

        currentId = o.id;
        editMode  = editable;
        $('#drawerTitle').textContent = editable ? 'Edit Order' : 'Order Details';

        els.oId.value = o.public_id || '';
        els.cName.value = o.customer_name || '';
        els.cEmail.value = o.customer_email || '';
        els.cPhone.value = o.customer_phone || '';
        els.cAddress.value = o.customer_address || '';

        els.pStat.value = o.payment_status || 'Pending';
        els.oStat.value = o.order_status   || 'Pending';

        els.tBody.innerHTML = items.map(it=>{
            const sub = Number(it.line_total ?? (Number(it.unit_price||0)*Number(it.quantity||0)));
            return `<tr>
      <td>${it.product_name||''}${it.size?` <span class="muted">• ${it.size}</span>`:''}</td>
      <td>${Number(it.unit_price||0).toFixed(2)}</td>
      <td>${Number(it.quantity||0)}</td>
      <td>${sub.toFixed(2)}</td>
    </tr>`;
        }).join('');

        // summary
        const subtotal = Number(o.subtotal|| items.reduce((s,it)=> s + Number(it.unit_price||0)*Number(it.quantity||0),0));
        els.sub.value  = money(subtotal);
        els.ship.value = Number(o.shipping||0);
        els.tax.value  = Number(o.tax||0);
        els.total.value= money( Number(o.total|| (subtotal + Number(o.shipping||0) + Number(o.tax||0))) );

        setDrawerEnabled(editMode);
        drawer.classList.add('open'); backdrop.classList.add('show');
    }
    function closeDrawer(){ drawer.classList.remove('open'); backdrop.classList.remove('show'); currentId=null; }
    backdrop.onclick=closeDrawer; $('#cancelDrawer').onclick=closeDrawer;

    $('#saveOrder').onclick = async ()=>{
        if(!currentId) return;
        const payload = {
            id: currentId,
            customer_name:  els.cName.value.trim(),
            customer_email: els.cEmail.value.trim(),
            customer_phone: els.cPhone.value.trim(),
            customer_address: els.cAddress.value.trim(),
            payment_status:  els.pStat.value,
            order_status:    els.oStat.value,
            shipping: Number(els.ship.value||0),
            tax:      Number(els.tax.value||0)
        };
        const j = await apiUpdate(payload);
        if(!j || !j.ok){ alert(j?.error || 'Failed to save'); return; }
        closeDrawer();
        await loadAndRender();
    };

    async function removeOrder(id){
        const row = (cachedPage.rows||[]).find(x=>String(x.id)===String(id));
        const label = row?.public_id || id;
        if(!confirm(`Delete order ${label}? This cannot be undone.`)) return;
        const j = await apiDelete(id);
        if(!j || !j.ok){ alert(j?.error || 'Failed to delete'); return; }
        // لو حذفنا آخر عنصر بالصفحة الحالية، ارجعي صفحة واحدة
        if(cachedPage.rows.length===1 && state.page>1) state.page--;
        await loadAndRender();
    }

    /* ===== filters wiring ===== */
    $('#searchInput').oninput = e=>{ state.q=e.target.value; state.page=1; loadAndRender(); };
    $('#statusFilter').onchange = e=>{ state.status=e.target.value; state.page=1; loadAndRender(); };
    $('#paymentFilter').onchange = e=>{ state.payment=e.target.value; state.page=1; loadAndRender(); };
    $('#clearFilters').onclick = ()=>{
        state={q:'',status:'',payment:'',page:1};
        $('#searchInput').value=''; $('#statusFilter').value=''; $('#paymentFilter').value='';
        loadAndRender();
    };
    $('#prevPage').onclick=()=>{ if(state.page>1){state.page--; loadAndRender();} };
    $('#nextPage').onclick=()=>{ state.page++; loadAndRender(); };

    /* ===== sidebar include & initial load ===== */
    document.addEventListener('DOMContentLoaded', async () => {
        try{
            const html = await fetch('sidebar.html').then(r=>r.text());
            $('#sidebar-container').innerHTML = html;
            $$('a', $('#sidebar-container')).forEach(a=>{
                if((a.textContent||'').trim().toLowerCase()==='orders') a.classList.add('active');
            });
        }catch{}
        await loadAndRender();
    });

    /* check-all (يبقى كما هو) */
    $('#checkAll').onchange = e => $$('tbody input[type="checkbox"]').forEach(cb=>cb.checked=e.target.checked);
</script>
