<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Matchy Matchy — Admin • Orders</title>

    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <!-- Your existing styles -->
    <link rel="stylesheet" href="../styles/sidebar.css"/>
    <link rel="stylesheet" href="../styles/products.css"/>
    <link rel="stylesheet" href="../styles/topbarAdmin.css"/>

    <style>
        :root{
            /* fallback tokens in case theme doesn't define them */
            --umber:#715E51;
            --border:#e7e0d9;
            --bg-soft:#faf9f7;
            --teal-ink:#006d6d;   --teal-bg:#e5f4f4;   --teal-br:#cdeaea;   /* success */
            --amber-ink:#8a6000;  --amber-bg:#fff3d9;  --amber-br:#ffe2a6;  /* pending */
            --rose-ink:#a23c3c;   --rose-bg:#ffe7e7;   --rose-br:#ffd1d1;  /* error */
            --blue-ink:#1b63c7;  --blue-bg:#eaf3ff;  --blue-br:#cfe3ff;   /* shipped */
        }

        .muted{ color:#6b7280; }

        /* toolbar small tweaks */
        .toolbar .field { min-width:260px; }

        /* consistent status/payment chips */
        .chip{
            display:inline-flex; align-items:center; justify-content:center;
            min-width:96px; height:32px; padding:0 10px; border-radius:999px;
            font-weight:600; font-size:.85rem; border:1px solid transparent; white-space:nowrap;
        }
        .chip.green { background:var(--teal-bg);  color:var(--teal-ink);  border-color:var(--teal-br); }
        .chip.blue  { background:var(--blue-bg);  color:var(--blue-ink);  border-color:var(--blue-br); }
        .chip.amber { background:var(--amber-bg); color:var(--amber-ink); border-color:var(--amber-br); }
        .chip.red   { background:var(--rose-bg);  color:var(--rose-ink);  border-color:var(--rose-br); }

        /* fixed table styling for items section */
        .order-items{ width:100%; border-collapse:separate; border-spacing:0; }
        .order-items th,.order-items td{ padding:10px; border-bottom:1px solid var(--border); }
        .order-items th{ text-align:left; color:#6b7280; background:var(--bg-soft); }
        td:nth-child(6), td:nth-child(7){ white-space:nowrap; }

        .grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
        @media (max-width:900px){ .grid-2{ grid-template-columns:1fr; } }

        /* drawer a11y focus ring for clarity */
        .drawer [tabindex="0"]:focus{ outline:2px solid #aac9ff; outline-offset:2px; }

        /* small UI helpers for pager */
        .page-btn.active{ background:#e5f4f4; color:#0f5; }
    </style>
</head>
<body>
<div class="layout">
    <!-- Sidebar include -->
    <div id="sidebar-container"></div>

    <!-- Main -->
    <main class="main">
        <!-- Topbar include -->
        <div data-include="topBarAdmin.html"></div>

        <!-- Page header -->
        <div class="page-head">
            <div class="title-wrap">
                <h1>Orders</h1>
                <p class="muted">Track and manage all customer orders from your store.</p>
            </div>
        </div>

        <!-- Toolbar -->
        <div class="toolbar">
            <div class="field" style="flex:1">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input id="searchInput" type="search" placeholder="Search by Order ID, Customer Name, or Email…" aria-label="Search orders">
            </div>
            <div class="field">
                <i class="fa-solid fa-signal"></i>
                <select id="statusFilter" aria-label="Filter by status">
                    <option value="">All Status</option>
                    <option>Pending</option>
                    <option>Processing</option>
                    <option>Shipped</option>
                    <option>Delivered</option>
                    <option>Cancelled</option>
                </select>
            </div>
            <div class="field">
                <i class="fa-regular fa-credit-card"></i>
                <select id="paymentFilter" aria-label="Filter by payment">
                    <option value="">All Payments</option>
                    <option>Paid</option>
                    <option>Pending</option>
                    <option>Failed</option>
                    <option>Refunded</option>
                    <option>COD</option>
                </select>
            </div>
            <button class="btn btn-ghost" id="clearFilters" aria-label="Clear filters"><i class="fa-solid fa-rotate-left"></i> Clear Filters</button>
            <button class="btn btn-teal" id="exportCsv" aria-label="Export CSV"><i class="fa-solid fa-file-export"></i> Export</button>
        </div>

        <!-- Table -->
        <section class="card">
            <table aria-label="Orders table">
                <thead>
                <tr>
                    <th style="width:40px;"><input type="checkbox" id="checkAll" aria-label="Check all"/></th>
                    <th data-sort="id" aria-sort="none" style="cursor:pointer">Order ID</th>
                    <th data-sort="customer" aria-sort="none" style="cursor:pointer">Customer</th>
                    <th data-sort="date" aria-sort="descending" style="cursor:pointer">Date</th>
                    <th data-sort="total" aria-sort="none" style="cursor:pointer">Total</th>
                    <th>Payment</th>
                    <th>Status</th>
                    <th style="width:120px;">Actions</th>
                </tr>
                </thead>
                <tbody id="tbody"></tbody>
            </table>

            <div id="emptyState" class="empty" style="display:none">
                <div class="emoji">📦</div>
                <h3 style="margin:0 0 6px;color:var(--umber)">No orders found</h3>
                <p style="margin:0 0 14px" class="muted">Try a different search or filter.</p>
            </div>

            <!-- Pagination -->
            <div class="pager">
                <div class="pager-info" id="pagerInfo"></div>
                <button class="page-btn" id="prevPage" aria-label="Previous page"><i class="fa-solid fa-chevron-left"></i></button>
                <div id="pageNums" style="display:flex;gap:6px"></div>
                <button class="page-btn" id="nextPage" aria-label="Next page"><i class="fa-solid fa-chevron-right"></i></button>
            </div>
        </section>
    </main>
</div>

<!-- Drawer: Order Details -->
<div class="drawer-backdrop" id="drawerBackdrop" aria-hidden="true"></div>
<div class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" tabindex="0">
    <h3 id="drawerTitle">Order Details</h3>

    <div class="section-title" style="margin:18px 0 6px;font-weight:600;color:var(--umber)">Customer</div>
    <div class="grid-2">
        <div><label class="muted" for="cName">Name</label><input class="input" id="cName"/></div>
        <div><label class="muted" for="cEmail">Email</label><input class="input" id="cEmail"/></div>
        <div><label class="muted" for="cPhone">Phone</label><input class="input" id="cPhone"/></div>
        <div><label class="muted" for="oId">Order ID</label><input class="input" id="oId" disabled/></div>
    </div>

    <div class="section-title" style="margin:18px 0 6px;font-weight:600;color:var(--umber)">Shipping Address</div>
    <textarea class="textarea" id="cAddress" placeholder="Street, City, ZIP, Country"></textarea>

    <div class="section-title" style="margin:18px 0 6px;font-weight:600;color:var(--umber)">Items</div>
    <table class="order-items" id="itemsTable">
        <thead><tr><th>Product</th><th>Price (₪)</th><th>Qty</th><th>Subtotal (₪)</th></tr></thead>
        <tbody></tbody>
    </table>

    <div class="grid-2" style="margin-top:10px">
        <div>
            <label class="muted" for="paymentStatus">Payment Status</label>
            <select class="select" id="paymentStatus">
                <option>Paid</option><option>Pending</option><option>Failed</option><option>Refunded</option><option>COD</option>
            </select>
        </div>
        <div>
            <label class="muted" for="orderStatus">Order Status</label>
            <select class="select" id="orderStatus">
                <option>Pending</option><option>Processing</option><option>Shipped</option><option>Delivered</option><option>Cancelled</option>
            </select>
        </div>
    </div>

    <div class="section-title" style="margin:18px 0 6px;font-weight:600;color:var(--umber)">Summary</div>
    <div class="grid-2">
        <div><label class="muted" for="sumSubtotal">Subtotal</label><input class="input" id="sumSubtotal" disabled/></div>
        <div><label class="muted" for="sumShipping">Shipping</label><input class="input" id="sumShipping"/></div>
        <div><label class="muted" for="sumTax">Tax</label><input class="input" id="sumTax"/></div>
        <div><label class="muted" for="sumTotal">Total</label><input class="input" id="sumTotal" disabled/></div>
    </div>

    <div class="drawer-actions">
        <button class="btn btn-ghost" id="cancelDrawer">Cancel</button>
        <button class="btn btn-teal" id="saveOrder">Save</button>
    </div>
</div>

<script>
    /* ===== Constants & helpers ===== */
    const API_URL = '/matchymatchy/api/admin/orders.php';
    const PAGE_SIZE = 8;
    const $ = (s,c=document)=>c.querySelector(s);
    const $$ = (s,c=document)=>Array.from(c.querySelectorAll(s));

    // Formatters
    const ILS = new Intl.NumberFormat('he-IL', { style:'currency', currency:'ILS' });
    const fmtMoney = n => ILS.format(Number(n||0));
    const fmtDate  = iso => new Date(iso).toLocaleDateString('en-US',{ month:'short', day:'numeric', year:'numeric' });

    // Debounce helper
    function debounce(fn, ms=200){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a), ms); } }

    // Chip class chooser
    function chipClass(kind,val){
        const v=(val||'').toLowerCase();
        if(kind==='payment'){ if(v==='paid') return 'green'; if(v==='pending'||v==='cod') return 'amber'; if(v==='failed'||v==='refunded') return 'red'; }
        if(kind==='status'){ if(v==='delivered') return 'green'; if(v==='shipped') return 'blue'; if(v==='processing'||v==='pending') return 'amber'; if(v==='cancelled') return 'red'; }
        return 'amber';
    }

    // Simple CSV export of the currently loaded page
    function exportCSV(rows){
        const data = [['Order ID','Customer','Email','Date','Total','Payment','Status']]
            .concat(rows.map(o=>[o.public_id, o.customer_name, o.customer_email, o.date, o.total, o.payment_status, o.order_status]));
        const csv = data.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');
        const blob = new Blob([csv],{type:'text/csv;charset=utf-8;'});
        const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='orders.csv'; a.click();
    }

    // Sidebar include & active link
    document.addEventListener('DOMContentLoaded', async () => {
        try{
            const html = await fetch('sidebar.html',{credentials:'same-origin'}).then(r=>r.text());
            $('#sidebar-container').innerHTML = html;
            $$('a', $('#sidebar-container')).forEach(a=>{
                if((a.textContent||'').trim().toLowerCase()==='orders') a.classList.add('active');
            });
        }catch{}
    });

    /* ===== State ===== */
    let orders = [];
    let meta   = { page:1, page_size:PAGE_SIZE, pages:1, total:0 };
    let state  = { q:'', status:'', payment:'', page:1, page_size:PAGE_SIZE, sort_by:'date', sort_dir:'desc' };

    /* ===== API ===== */
    async function fetchOrders(){
        const qs = new URLSearchParams({
            action: 'list',
            q: state.q, status: state.status, payment: state.payment,
            page: String(state.page), page_size: String(state.page_size),
            sort_by: state.sort_by, sort_dir: state.sort_dir
        });
        const res = await fetch(`${API_URL}?${qs}`, { credentials:'same-origin' });
        if(!res.ok){ console.error('List failed'); return; }
        const json = await res.json();
        orders = json.data || [];
        meta   = json.meta || meta;
        render();
    }

    async function fetchOrderDetails(publicId){
        const res = await fetch(`${API_URL}?action=get&id=${encodeURIComponent(publicId)}`, { credentials:'same-origin' });
        if(!res.ok) throw new Error('Order not found');
        return await res.json(); // {order: {...}, items:[...]}
    }

    async function updateOrder(payload){
        const res = await fetch(`${API_URL}?action=update`,{
            method:'POST', headers:{'Content-Type':'application/json'}, credentials:'same-origin', body:JSON.stringify(payload)
        });
        if(!res.ok) throw new Error('Update failed');
        return await res.json();
    }

    async function deleteOrder(publicId){
        const res = await fetch(`${API_URL}?action=delete`,{
            method:'POST', headers:{'Content-Type':'application/json'}, credentials:'same-origin', body:JSON.stringify({ public_id: publicId })
        });
        if(!res.ok) throw new Error('Delete failed');
        return await res.json();
    }

    /* ===== Rendering ===== */
    function render(){
        // table rows
        $('#tbody').innerHTML = orders.map(o=>`
      <tr>
        <td><input type="checkbox" aria-label="Select order ${o.public_id}" data-id="${o.public_id}"></td>
        <td><span class="muted">#</span>${o.public_id}</td>
        <td>
          <div style="display:flex;flex-direction:column">
            <strong>${o.customer_name}</strong>
            <span class="muted" style="font-size:.9rem">${o.customer_email}</span>
          </div>
        </td>
        <td>${fmtDate(o.date)}</td>
        <td>${fmtMoney(o.total)}</td>
        <td><span class="chip ${chipClass('payment',o.payment_status)}">${o.payment_status}</span></td>
        <td><span class="chip ${chipClass('status',o.order_status)}">${o.order_status}</span></td>
        <td>
          <div class="row-actions">
            <button class="icon-link" aria-label="View order" data-view="${o.public_id}"><i class="fa-regular fa-eye"></i></button>
            <button class="icon-link" aria-label="Edit order" data-edit="${o.public_id}"><i class="fa-regular fa-pen-to-square"></i></button>
            <button class="icon-link" aria-label="Delete order" data-del="${o.public_id}"><i class="fa-regular fa-trash-can"></i></button>
          </div>
        </td>
      </tr>
    `).join('');

        // empty state
        $('#emptyState').style.display = orders.length ? 'none' : 'block';

        // pager text
        const start = orders.length ? ( (state.page-1)*state.page_size + 1 ) : 0;
        const end   = orders.length ? Math.min(state.page*state.page_size, meta.total) : 0;
        $('#pagerInfo').textContent = meta.total ? `Showing ${start}–${end} of ${meta.total} orders` : 'No results';

        // page numbers
        $('#pageNums').innerHTML='';
        for(let i=1;i<=meta.pages;i++){
            const b=document.createElement('button');
            b.className='page-btn'+(i===state.page?' active':'');
            b.textContent=i; b.ariaLabel = `Page ${i}`;
            b.onclick=()=>{ state.page=i; fetchOrders(); };
            $('#pageNums').appendChild(b);
        }
        $('#prevPage').disabled = state.page<=1;
        $('#nextPage').disabled = state.page>=meta.pages;

        // actions
        $$('[data-view]').forEach(b=>b.onclick=()=>openDrawer(b.dataset.view,false));
        $$('[data-edit]').forEach(b=>b.onclick=()=>openDrawer(b.dataset.edit,true));
        $$('[data-del]').forEach(b=>b.onclick=()=>confirmDelete(b.dataset.del));
    }

    // pager buttons
    $('#prevPage').onclick=()=>{ if(state.page>1){ state.page--; fetchOrders(); } };
    $('#nextPage').onclick=()=>{ if(state.page<meta.pages){ state.page++; fetchOrders(); } };

    // search & filters
    $('#searchInput').oninput = debounce(e=>{ state.q=e.target.value; state.page=1; fetchOrders(); },200);
    $('#statusFilter').onchange = e=>{ state.status=e.target.value; state.page=1; fetchOrders(); };
    $('#paymentFilter').onchange= e=>{ state.payment=e.target.value; state.page=1; fetchOrders(); };
    $('#clearFilters').onclick  = ()=>{ state={...state, q:'', status:'', payment:'', page:1};
        $('#searchInput').value=''; $('#statusFilter').value=''; $('#paymentFilter').value=''; fetchOrders(); };
    $('#exportCsv').onclick = ()=> exportCSV(orders);

    // Sorting
    $$('th[data-sort]').forEach(th=>{
        th.onclick = ()=>{
            const key = th.dataset.sort;
            if(state.sort_by === key){ state.sort_dir = (state.sort_dir==='asc'?'desc':'asc'); }
            else { state.sort_by = key; state.sort_dir = 'asc'; }
            // aria-sort update
            $$('th[data-sort]').forEach(h=>h.setAttribute('aria-sort','none'));
            th.setAttribute('aria-sort', state.sort_dir==='asc'?'ascending':'descending');
            fetchOrders();
        };
    });

    // Check-all
    $('#checkAll').onchange = e => $$('tbody input[type="checkbox"]').forEach(cb=>cb.checked=e.target.checked);

    /* ===== Drawer (view/edit) ===== */
    const drawer   = $('#drawer');
    const backdrop = $('#drawerBackdrop');
    const els = {
        oId:$('#oId'), cName:$('#cName'), cEmail:$('#cEmail'), cPhone:$('#cPhone'), cAddress:$('#cAddress'),
        pStat:$('#paymentStatus'), oStat:$('#orderStatus'),
        itemsBody:$('#itemsTable tbody'),
        sub:$('#sumSubtotal'), ship:$('#sumShipping'), tax:$('#sumTax'), total:$('#sumTotal')
    };
    let currentId=null, editMode=false, lastTrigger=null;

    const allowedByPayment = {
        'Paid':      ['Processing','Shipped','Delivered','Cancelled'],
        'Pending':   ['Pending','Processing','Cancelled'],
        'Failed':    ['Cancelled'],
        'Refunded':  ['Cancelled'],
        'COD':       ['Pending','Processing','Shipped','Delivered','Cancelled']
    };

    function applyStatusRules(){
        const allowed = new Set(allowedByPayment[els.pStat.value] || []);
        [...els.oStat.options].forEach(opt=> opt.disabled = !allowed.has(opt.value));
        if(!allowed.has(els.oStat.value)) els.oStat.value = [...allowed][0] || 'Pending';
    }
    els.pStat.onchange = applyStatusRules;

    async function openDrawer(publicId, editable){
        try{
            lastTrigger = document.activeElement;
            const data = await fetchOrderDetails(publicId);
            const o    = data.order; const items = data.items||[];
            currentId = o.public_id; editMode = editable;
            $('#drawerTitle').textContent = editable ? 'Edit Order' : 'Order Details';

            els.oId.value = o.public_id;
            els.cName.value = o.customer_name || '';
            els.cEmail.value= o.customer_email || '';
            els.cPhone.value= o.customer_phone || '';
            els.cAddress.value = o.customer_address || '';
            els.pStat.value = o.payment_status;
            els.oStat.value = o.order_status;

            els.itemsBody.innerHTML = items.map(it=>{
                const sub = Number(it.subtotal ?? (it.price*it.qty));
                return `<tr><td>${it.name||it.product_name}</td><td>${Number(it.price).toFixed(2)}</td><td>${it.qty||it.quantity}</td><td>${sub.toFixed(2)}</td></tr>`;
            }).join('');

            const subtotal = items.reduce((s,i)=> s + Number(i.subtotal ?? (i.price*i.qty)), 0);
            els.sub.value   = fmtMoney(subtotal);
            els.ship.value  = Number(o.shipping||0);
            els.tax.value   = Number(o.tax||0);
            els.total.value = fmtMoney(subtotal + Number(o.shipping||0) + Number(o.tax||0));

            // enable/disable for edit mode
            [els.cName,els.cEmail,els.cPhone,els.cAddress,els.pStat,els.oStat,els.ship,els.tax].forEach(el=> el.disabled=!editable);
            $('#saveOrder').style.display = editable ? '' : 'none';

            applyStatusRules();

            // show drawer + focus management
            drawer.classList.add('open'); backdrop.classList.add('show');
            drawer.focus();

            // focus trap
            const focusables = drawer.querySelectorAll('button,[href],input,select,textarea,[tabindex]:not([tabindex="-1"])');
            const first = focusables[0], last = focusables[focusables.length-1];
            drawer.onkeydown = (e)=>{
                if(e.key==='Tab'){
                    if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
                    else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
                }
                if(e.key==='Escape'){ closeDrawer(); }
            };

        }catch(err){ console.error(err); alert('Failed to load order'); }
    }

    function closeDrawer(){
        drawer.classList.remove('open'); backdrop.classList.remove('show');
        currentId=null; editMode=false; drawer.onkeydown=null;
        if(lastTrigger) lastTrigger.focus();
    }
    backdrop.onclick = closeDrawer; $('#cancelDrawer').onclick = closeDrawer;

    $('#saveOrder').onclick = async () => {
        if(!currentId) return;
        try{
            const payload = {
                public_id: currentId,
                customer_name:  els.cName.value.trim(),
                customer_email: els.cEmail.value.trim(),
                customer_phone: els.cPhone.value.trim(),
                customer_address: els.cAddress.value.trim(),
                payment_status:  els.pStat.value,
                order_status:    els.oStat.value,
                shipping: Number(els.ship.value||0),
                tax:      Number(els.tax.value||0)
            };
            await updateOrder(payload);
            await fetchOrders();
            closeDrawer();
        }catch(err){ console.error(err); alert('Save failed'); }
    };

    async function confirmDelete(publicId){
        const ok = confirm(`Delete order ${publicId}? This cannot be undone.`);
        if(!ok) return;
        try{ await deleteOrder(publicId); await fetchOrders(); }catch(err){ console.error(err); alert('Delete failed'); }
    }

    // Initial load
    fetchOrders();
</script>

<!-- keep your existing includes -->
<script src="../js/adminbar.js" defer></script>
<script src="../js/includeadminBar.js" defer></script>
</body>
</html>
