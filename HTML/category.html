<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" href="../styles/responsive.css">
    <title>Category • Matchy Matchy</title>

    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary:'#008080', secondary:'#FADADD' },
                    borderRadius: { 'button':'8px' }
                }
            }
        }
    </script>

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- Styles -->
    <link rel="stylesheet" href="../styles/style.css"/>
    <link rel="stylesheet" href="../styles/productStyle.css"/>

    <style>
        body { background-color:#FEFEFA }
        .product-card { transition: transform .2s ease, box-shadow .2s ease; }
        .product-card:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,0,0,.1); }
        .add-btn { transition: all .2s ease; }
        .add-btn:hover { transform: scale(1.1); }
        .filter-btn { transition: all .2s ease; }
        .filter-btn:hover { background-color: rgba(0,128,128,.1); }
        .similar-product-title { font-size:.9rem; margin-bottom:5px; color:var(--jet); }
        .similar-product-price { font-weight:bold; color:var(--teal); margin-bottom:8px; }
        .custom-checkbox { appearance:none; width:18px; height:18px; border:2px solid #ccc; border-radius:4px; position:relative; cursor:pointer; }
        .custom-checkbox:checked { background:#008080; border-color:#008080; }
        .custom-checkbox:checked::after { content:'✓'; position:absolute; top:-2px; left:2px; color:#fff; font-size:12px; font-weight:bold; }

        :root { --pink:#E4CFC3; }
        .meta-row{ display:flex; align-items:center; justify-content:space-between; }
        .star-rating{ display:flex; align-items:center; gap:8px; line-height:1; }
        .star{ font-size:20px; color:#d1d5db; transition:transform .12s ease; }
        .star:hover{ transform:scale(1.05); }
        .star.is-filled{ color:#facc15; }
        .star-rating .avg{ min-width:2.2ch; text-align:left; font-weight:600; color:#94a3b8; }
        .star-rating .count{ margin-left:2px; color:#9ca3af; font-size:.8rem; }
        .wish-btn{ display:inline-flex; align-items:center; gap:6px; color:var(--pink) !important; }
        .wish-btn i{ font-size:20px; color:inherit !important; }
        .wish-btn .ri-heart-fill::before,
        .wish-btn .ri-heart-line::before{ color:inherit !important; }
        .wish-btn.is-liked{ color:var(--pink) !important; }
        .wish-btn.is-liked i{ color:var(--pink) !important; filter:drop-shadow(0 2px 6px rgba(228,207,195,.45)); }
        .is-busy { opacity:.7; pointer-events:none; }
    </style>

    <script>
        /* Helpers: cart + header badge + search */
        function getCart(){ try { return JSON.parse(localStorage.getItem('cart')||'[]'); } catch { return []; } }
        function setCart(next){ localStorage.setItem('cart', JSON.stringify(next)); window.dispatchEvent(new Event('cart:updated')); }
        function getCartCount(){ return getCart().reduce((n,i)=> n + (Number(i.quantity)||0), 0); }
        function updateHeaderCartCount(){
            const el = document.querySelector('#header #cart-count, #header-slot #cart-count, #cart-count, .main-header .cart .badge');
            if (el) el.textContent = getCartCount();
        }
        function setupHeaderMenu(){ /* hook لو عندك منيو */ }
        function setupHeaderSearch(){
            const input = document.querySelector('.search-box input');
            if (!input) return;
            input.addEventListener('keydown', (e)=>{
                if (e.key === 'Enter') {
                    const q = input.value.trim();
                    if (q) location.href = `category.html?q=${encodeURIComponent(q)}&page=1`;
                }
            });
        }
    </script>
</head>
<body>

<!-- HEADER -->
<div id="header"></div>

<section class="w-full px-6 py-6 border-b" style="background-color:#F9F8F3;">
    <div class="mb-4 max-w-6xl mx-auto">
        <nav class="text-sm text-gray-500 mb-2" id="breadcrumb">
            <a href="index.html" class="hover:underline">Home</a> / <span>Category</span>
        </nav>
        <h1 class="text-2xl font-bold text-gray-800" id="page-title">Loading…</h1>
    </div>


    <div class="max-w-6xl mx-auto flex flex-wrap items-center gap-4">

        <div class="relative">
            <select id="flt-size" class="filter-btn px-4 py-2 border border-gray-300 rounded-lg bg-white appearance-none pr-8 cursor-pointer">
                <option value="">Size</option>
            </select>

        </div>
        <div class="relative">
        <select id="flt-type" class="filter-btn px-4 py-2 border border-gray-300 rounded-lg bg-white appearance-none pr-8 cursor-pointer">
            <option value="">Type</option>
        </select>
            <div class="absolute right-2 top-1/2 -translate-y-1/2 pointer-events-none">
                <i class="ri-arrow-down-s-line text-gray-500"></i>
            </div>
        </div>
        <div class="relative">
        <select id="flt-fabric" class="filter-btn px-4 py-2 border border-gray-300 rounded-lg bg-white appearance-none pr-8 cursor-pointer">

        </select>
            <div class="absolute right-2 top-1/2 -translate-y-1/2 pointer-events-none">

<!-- GRID -->
<main class="w-full px-6 py-8">
    <div class="max-w-6xl mx-auto">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6" id="products-grid"></div>
    </div>
</main>

<!-- FOOTER -->
<div id="foot"></div>

<!-- Inject header/footer -->
<script>
    fetch('header.html').then(r=>r.text()).then(async h=>{
        document.getElementById('header').innerHTML = h;
        await refreshHeaderCartCount();       // read count from SERVER, not localStorage
    });

    fetch('footer.html')
        .then(response => response.text())
        .then(data => {
            document.getElementById('foot').innerHTML = data;
        });


</script>

<!-- Page script -->
<script>
    const gridEl = document.getElementById('products-grid');

    function card(p){
        const avg      = (p.rating_avg == null ? null : Number(p.rating_avg));
        const cnt      = Number(p.rating_count || 0);
        const likes    = Number(p.likes || 0);
        const myLike   = Number(p.my_like || 0) === 1;
        const myRating = (p.my_rating == null ? null : Number(p.my_rating));

        const stars = Array.from({length:5}, (_,i)=>{
            const filled = (myRating !== null) ? (i < myRating) : false;
            return `<button type="button" class="star ${filled ? 'is-filled' : ''}" data-rating="${i+1}">★</button>`;
        }).join('');

        const ratingLine = (cnt > 0)
            ? `<span class="avg">${avg.toFixed(1)}</span><span class="count">(${cnt})</span>`
            : `<span class="avg">—</span>`;

        return `
      <div class="similar-product-card product-card" data-id="${p.id}">
        <a class="image-wrap" href="product.html?id=${p.id}">
          <img src="${p.image_main_url || '../images/placeholder.jpg'}" alt="${p.name}">
        </a>

        <h3 class="similar-product-title">
          <a href="product.html?id=${p.id}">${p.name}</a>
        </h3>

        <div class="price-alone">₪${Number(p.price).toFixed(2)}</div>

        <div class="meta-row">
          <div class="star-rating">${stars} ${ratingLine}</div>
          <button type="button" class="like-btn wish-btn ${myLike ? 'is-liked':''}" title="Wishlist">
            <i class="${myLike ? 'ri-heart-fill' : 'ri-heart-line'}"></i>
            <span class="text-xs like-count">${likes}</span>
          </button>
        </div>


      </div>
    `;
    }
    // <div class="add-row" style="margin-top:12px;display:flex;justify-content:flex-end;">
    //     <button type="button" class="add-btn"
    //             data-id="${p.id}"
    //             data-name="${p.name.replace(/"/g,'&quot;')}"
    //     data-price="${p.price}"
    //     data-image="${p.image_main_url || '../images/placeholder.jpg'}">
    //     <i class="ri-add-line"></i>
    // </button>
    // </div>


    // أول تحميل
    renderPLP();

    /* مستمع واحد: Add-to-cart + Like (يحفظ) + Rating (يحفظ) */
    gridEl.addEventListener('click', async (e) => {
        // ADD TO CART
        const addBtn = e.target.closest('.add-btn');
        if (addBtn) {
            const item = {
                id: Number(addBtn.dataset.id),
                name: addBtn.dataset.name,
                price: Number(addBtn.dataset.price),
                image: addBtn.dataset.image,
                quantity: 1
            };
            const cart = getCart();
            const i = cart.findIndex(x => x.id === item.id);
            if (i >= 0) cart[i].quantity += 1; else cart.push(item);
            setCart(cart);
            addBtn.style.transform = 'scale(1.1)';
            setTimeout(() => addBtn.style.transform = 'scale(1)', 160);
            return;
        }

        // LIKE (يحفظ بالداتابيس)
        const likeBtn = e.target.closest('.like-btn');
        if (likeBtn) {
            if (likeBtn.classList.contains('is-busy')) return;
            likeBtn.classList.add('is-busy');

            const cardEl  = likeBtn.closest('.product-card');
            const pid     = Number(cardEl.dataset.id);
            const icon    = likeBtn.querySelector('i');
            const countEl = likeBtn.querySelector('.like-count');

            try {
                const res = await fetch('/matchymatchy/backend/like_toggle.php', {
                    method:'POST',
                    headers:{ 'Content-Type':'application/x-www-form-urlencoded' },
                    body:`product_id=${encodeURIComponent(pid)}`
                });
                const j = await res.json();
                if (j && j.ok) {
                    likeBtn.classList.toggle('is-liked', j.liked);
                    icon.className = j.liked ? 'ri-heart-fill' : 'ri-heart-line';
                    countEl.textContent = String(j.likes);
                }
            } catch(err) {
                console.error('like_toggle failed', err);
            } finally {
                likeBtn.classList.remove('is-busy');
            }
            return;
        }

        // RATING (يحفظ بالداتابيس) — يلوّن نجوم تقييمي أنا فقط
        const star = e.target.closest('.star');
        if (star) {
            const rating   = Number(star.dataset.rating);
            const cardEl   = star.closest('.product-card');
            const pid      = Number(cardEl.dataset.id);
            const starWrap = star.parentElement;

            if (starWrap.classList.contains('is-busy')) return;
            starWrap.classList.add('is-busy');

            try {
                const res = await fetch('/matchymatchy/backend/rate_set.php', {
                    method:'POST',
                    headers:{ 'Content-Type':'application/x-www-form-urlencoded' },
                    body:`product_id=${encodeURIComponent(pid)}&rating=${encodeURIComponent(rating)}`
                });
                const j = await res.json();
                if (j && j.ok) {
                    // نجومي أنا
                    [...starWrap.querySelectorAll('.star')].forEach((s,i)=>{
                        s.classList.toggle('is-filled', i < j.my_rating);
                    });
                    // المتوسط والعدد
                    const avgEl = starWrap.querySelector('.avg');
                    const cntEl = starWrap.querySelector('.count');
                    if (avgEl) avgEl.textContent = j.count ? Number(j.avg).toFixed(1) : '—';
                    if (cntEl) cntEl.textContent = j.count ? `(${j.count})` : '';
                }
            } catch(err) {
                console.error('rate_set failed', err);
            } finally {
                starWrap.classList.remove('is-busy');
            }
        }
    });

    async function getParentCategoryFromSlug(slug) {
        // 1. افحص إذا هو أصلاً أب رئيسي
        const primary = ['baby', 'toddler', 'kids'];
        if (primary.includes(slug)) return slug;

        try {
            const res = await fetch('../backend/collections_api.php?withChildren=1');
            const j = await res.json();
            const parents = Array.isArray(j.data) ? j.data : [];

            for (const parent of parents) {
                if (!parent.children) continue;
                for (const child of parent.children) {
                    if (child.slug === slug) return parent.slug;
                }
            }
            return null;
        } catch (e) {
            console.error('getParentCategoryFromSlug', e);
            return null;
        }
    }


    async function loadFilterOptions() {
        const slug = new URLSearchParams(location.search).get('slug') || '';

        const parentSlug = await getParentCategoryFromSlug(slug);

        const categoryType = parentSlug?.includes('toddler') ? 'toddler'
            : parentSlug?.includes('kid') ? 'kids'
                : 'baby'; // default

        const SIZE_GUIDES = {
            baby: ['Newborn', '0-3M', '3-6M', '6-9M', '9-12M', '12-18M'],
            toddler: ['2T', '3T', '4T', '5T'],
            kids: ['5', '6', '7', '8', '10', '12', '14']
        };

        const sizes = SIZE_GUIDES[categoryType] || [];

        const sizeSelect = document.getElementById('flt-size');
        if (sizeSelect) {
            sizeSelect.innerHTML = '<option value="">Size</option>';
            sizes.forEach(size => {
                const opt = document.createElement('option');
                opt.value = size;
                opt.textContent = size;
                sizeSelect.appendChild(opt);
            });
        }
        try {
            const response = await fetch('/matchymatchy/backend/filters.php');
            const result = await response.json();

            if (result.ok) {
                populateFilterOptions(result.data);
            } else {
                console.error('Failed to load filter options:', result.error);
                populateFilterOptions({
                    sizes: ['Newborn', '0-3M', '3-6M', '6-9M', '9-12M', '12-18M', '18-24M'],
                    types: ['Dress', 'Set', 'Pajama', 'Blouse', 'Pants', 'Skirt', 'T-shirt'],
                    fabrics: ['Cotton', 'Organic Cotton', 'Bamboo', 'Modal', 'Polyester'],
                    colors: ['White', 'Black', 'Pink', 'Blue', 'Green', 'Ivory']
                });
            }
        } catch (error) {
            console.error('Error loading filter options:', error);
        }
    }

    function populateFilterOptions(options) {
        const sizeSelect = document.getElementById('flt-size');
        if (sizeSelect && options.sizes) {
            options.sizes.forEach(size => {
                const option = document.createElement('option');
                option.value = size;
                option.textContent = size;
                sizeSelect.appendChild(option);
            });
        }

        const typeSelect = document.getElementById('flt-type');
        if (typeSelect && options.types) {
            options.types.forEach(type => {
                const option = document.createElement('option');
                option.value = type;
                option.textContent = type;
                typeSelect.appendChild(option);
            });
        }

        // ملء خيارات الأقمشة
        const fabricSelect = document.getElementById('flt-fabric');
        if (fabricSelect && options.fabrics) {
            options.fabrics.forEach(fabric => {
                const option = document.createElement('option');
                option.value = fabric;
                option.textContent = fabric;
                fabricSelect.appendChild(option);
            });
        }

        // ملء خيارات الألوان
        const colorSelect = document.getElementById('flt-color');
        if (colorSelect && options.colors) {
            options.colors.forEach(color => {
                const option = document.createElement('option');
                option.value = color;
                option.textContent = color;
                colorSelect.appendChild(option);
            });
        }
    }

    document.addEventListener('DOMContentLoaded', function() {
        loadFilterOptions().then(() => {
            setupFilters();
            setFilterValuesFromURL();
            updateActiveFiltersCount();
        });
    });

    // دالة لتعيين قيم الفلاتر من URL
    function setFilterValuesFromURL() {
        const params = new URLSearchParams(location.search);

        const sizeSelect = document.getElementById('flt-size');
        const typeSelect = document.getElementById('flt-type');
        const fabricSelect = document.getElementById('flt-fabric');
        const colorSelect = document.getElementById('flt-color');
        const pickupCheckbox = document.getElementById('pickup');

        if (sizeSelect && params.has('size')) {
            sizeSelect.value = params.get('size');
        }

        if (typeSelect && params.has('type')) {
            typeSelect.value = params.get('type');
        }

        if (fabricSelect && params.has('fabric')) {
            fabricSelect.value = params.get('fabric');
        }

        if (colorSelect && params.has('color')) {
            colorSelect.value = params.get('color');
        }

        if (pickupCheckbox && params.has('pickup')) {
            pickupCheckbox.checked = params.get('pickup') === 'true';
        }
    }

    async function renderPLP(){
        const params = new URLSearchParams(location.search);
        const slug   = params.get('slug') || 'baby-girl';
        const q      = params.get('q') || '';
        const page   = Math.max(1, +(params.get('page') || 1));
        const pgSize = Math.max(1, +(params.get('size') || 24)); // ← هذا حجم الصفحة (pagination)

        gridEl.innerHTML = `<div class="col-span-full text-center py-10 text-gray-500">Loading…</div>`;

        // 1) حددي الـ endpoint
        let url;
        if (slug === 'new-arrivals') {
            url = `/matchymatchy/backend/new_arrivals.php?page=${page}&size=${pgSize}`;
        } else {
            url = `/matchymatchy/backend/products.php?page=${page}&size=${pgSize}`;
            if (!q && slug && slug !== 'all-products') {
                url += `&category_slug=${encodeURIComponent(slug)}`;
            }
        }

        // 2) بحث
        if (q) url += `&q=${encodeURIComponent(q)}`;

        // 3) فلاتر
        const filters = {
            type:   params.get('type'),
            fabric: params.get('fabric'),
            color:  params.get('color'),
            pickup: params.get('pickup'),
            size_label: params.get('size') || params.get('size_label'), // ← اقرأ أي واحد موجود
        };

        for (const [key, value] of Object.entries(filters)) {
            if (!value) continue;
            // fabric/color/size_label تدعم تعدد القيم، فنبعتها كمصفوفات
            if (['fabric','color','size_label'].includes(key)) {
                // لو عندك قيم متعددة بفاصلة
                const arr = String(value).split(',').map(v => v.trim()).filter(Boolean);
                for (const v of arr) url += `&${key}[]=${encodeURIComponent(v)}`;
            } else {
                url += `&${key}=${encodeURIComponent(value)}`;
            }
        }

        // 4) Fetch
        let ok=false, data=[], total=0;
        try{
            const res = await fetch(url, { headers: { 'Accept':'application/json' } });
            if (!res.ok) throw new Error(`API ${res.status}`);
            const json = await res.json();
            ok    = !!json.ok;
            data  = json.data  || [];
            total = json.total || 0;
        }catch(err){
            console.error('Fetch failed:', err);
        }

        if (!ok){
            gridEl.innerHTML = `<div class="col-span-full text-center py-10 text-red-500">Error loading products</div>`;
            return;
        }

        const pretty = q ? `Results for “${q}”` : slug.replace(/-/g,' ').replace(/\b\w/g, s => s.toUpperCase());
        const titleEl = document.getElementById('page-title');
        if (titleEl) titleEl.innerHTML = `${pretty} <span class="text-lg font-normal text-gray-600">(${total} items)</span>`;
        const bc = document.getElementById('breadcrumb');
        if (bc) bc.innerHTML = `<a href="index.html" class="hover:underline">Home</a> / <span class="text-gray-800">${pretty}</span>`;


        gridEl.innerHTML = data.length
            ? data.map(card).join('')
            : `<div class="col-span-full text-center py-10 text-gray-500">No products found</div>`;

        updateActiveFiltersCount();
    }



    // إعداد مستمعين للفلاتر
    function setupFilters() {
        // فلترة الحجم
        const sizeSelect = document.getElementById('flt-size');
        if (sizeSelect) {
            sizeSelect.addEventListener('change', function() {
                applyFilters();
            });
        }

        // فلترة النوع
        const typeSelect = document.getElementById('flt-type');
        if (typeSelect) {
            typeSelect.addEventListener('change', function() {
                applyFilters();
            });
        }

        // فلترة القماش
        const fabricSelect = document.getElementById('flt-fabric');
        if (fabricSelect) {
            fabricSelect.addEventListener('change', function() {
                applyFilters();
            });
        }

        // فلترة اللون
        const colorSelect = document.getElementById('flt-color');
        if (colorSelect) {
            colorSelect.addEventListener('change', function() {
                applyFilters();
            });
        }

        // فلترة الاستلام السريع
        const pickupCheckbox = document.getElementById('pickup');
        if (pickupCheckbox) {
            pickupCheckbox.addEventListener('change', function() {
                applyFilters();
            });
        }

        // زر كل الفلاتر
        const allFiltersBtn = document.getElementById('all-filters-btn');
        if (allFiltersBtn) {
            allFiltersBtn.addEventListener('click', function() {
                // يمكنك إضافة منطق لعرض/إخفاء قائمة الفلاتر هنا
                alert('عرض كل خيارات الفلترة');
            });
        }
    }

    // تطبيق الفلاتر
    function applyFilters() {
        const sizeSelect = document.getElementById('flt-size');
        const typeSelect = document.getElementById('flt-type');
        const fabricSelect = document.getElementById('flt-fabric');
        const colorSelect = document.getElementById('flt-color');
        const pickupCheckbox = document.getElementById('pickup');

        const params = new URLSearchParams(location.search);

        if (sizeSelect && sizeSelect.value) {
            params.set('size', sizeSelect.value);
        } else {
            params.delete('size');
        }

        if (typeSelect && typeSelect.value) {
            params.set('type', typeSelect.value);
        } else {
            params.delete('type');
        }

        if (fabricSelect && fabricSelect.value) {
            params.set('fabric', fabricSelect.value);
        } else {
            params.delete('fabric');
        }

        if (colorSelect && colorSelect.value) {
            params.set('color', colorSelect.value);
        } else {
            params.delete('color');
        }

        if (pickupCheckbox && pickupCheckbox.checked) {
            params.set('pickup', 'true');
        } else {
            params.delete('pickup');
        }

        window.location.search = params.toString();
    }

    // تحديث دالة renderPLP لدعم الفلاتر


    // تحديث عدد الفلاتر النشطة
    function updateActiveFiltersCount() {
        const params = new URLSearchParams(location.search);
        let activeCount = 0;

        if (params.get('type')) activeCount++;
        if (params.get('fabric')) activeCount++;
        if (params.get('color')) activeCount++;
        if (params.get('pickup')) activeCount++;

        const countElement = document.getElementById('active-filters-count');
        if (countElement) {
            countElement.textContent = activeCount;
            countElement.style.display = activeCount > 0 ? 'inline-block' : 'none';
        }
    }

    // استدعاء إعداد الفلاتر بعد تحميل الصفحة
    document.addEventListener('DOMContentLoaded', function() {
        setupFilters();

        // تعيين قيم الفلاتر من معاملات URL إن وجدت
        const params = new URLSearchParams(location.search);

        const sizeSelect = document.getElementById('flt-size');
        const typeSelect = document.getElementById('flt-type');
        const fabricSelect = document.getElementById('flt-fabric');
        const colorSelect = document.getElementById('flt-color');
        const pickupCheckbox = document.getElementById('pickup');

        if (sizeSelect && params.has('size')) {
            sizeSelect.value = params.get('size');
        }

        if (typeSelect && params.has('type')) {
            typeSelect.value = params.get('type');
        }

        if (fabricSelect && params.has('fabric')) {
            fabricSelect.value = params.get('fabric');
        }

        if (colorSelect && params.has('color')) {
            colorSelect.value = params.get('color');
        }

        if (pickupCheckbox && params.has('pickup')) {
            pickupCheckbox.checked = params.get('pickup') === 'true';
        }

        // تحديث عدد الفلاتر النشطة
        updateActiveFiltersCount();
    });
</script>
