<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Matchy Matchy • Product</title>

    <!-- CSS -->
    <link rel="stylesheet" href="../styles/productStyle.css" />
    <link rel="stylesheet" href="../styles/style.css" />

    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        /* ===== Rating ===== */
        .rating-stars{display:inline-flex;gap:4px;vertical-align:middle}
        .rating-stars .star{font-size:18px;color:#ccc}
        .rating-stars .star.filled{color:#FFC107}

        /* ===== Hide legacy qty & short desc under title ===== */
        .quantity{display:none!important}
        .product-info .description{display:none!important}

        /* ===== Size row + link ===== */
        .size-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:6px}
        .size-title{font-weight:600;color:#111}
        .size-guide-link{font-size:14px;color:#0a7d7d;text-decoration:underline;cursor:pointer}
        .size-guide-link:hover{opacity:.85}

        /* ===== Size pills (soft style) ===== */
        .size-options{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
        .size-options button{
            min-width:72px;padding:10px 14px;border:1.5px solid #dfe7e7;background:#fff;color:#1f2937;
            font-weight:600;border-radius:12px;transition:.15s ease;box-shadow:0 1px 0 rgba(0,0,0,.02)
        }
        .size-options button:hover{border-color:#8ec8c8;transform:translateY(-1px)}
        .size-options button.active{background:#008080;border-color:#008080;color:#fff;box-shadow:0 4px 14px rgba(0,128,128,.22)}
        .size-options button:focus{outline:none;box-shadow:0 0 0 3px rgba(0,128,128,.18)}
        .size-options button[disabled]{opacity:.45;cursor:not-allowed;text-decoration:line-through}

        /* ===== Size Guide box ===== */
        .size-guide{margin-top:14px;background:#fafafa;border:1px solid #eee;border-radius:12px;padding:16px;display:none}
        .size-guide.open{display:block}
        .size-guide .sg-header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
        .size-guide .tabs{display:flex;gap:10px}
        .size-guide .tab{border:1px solid #dfe7e7;background:#fff;padding:6px 10px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px}
        .size-guide .tab.active{background:#008080;border-color:#008080;color:#fff}
        .size-guide table{width:100%;border-collapse:collapse;margin-top:6px}
        .size-guide th,.size-guide td{padding:14px 12px;border-bottom:1px solid #eee;text-align:left}
        .size-guide tr:nth-child(even){background:#f5f7f7}
        .size-guide th{color:#111;font-weight:700}
        .size-guide td{color:#333}

        /* ===== Details (transformed features) ===== */
        .details-box h3{margin:0 0 10px;color:var(--jet);font-weight:700;font-size:20px}
        .details-box p{margin:.35rem 0;color:#444;line-height:1.7}
        .details-meta{margin-top:8px;font-size:.95rem;color:#555}
        .details-meta .label{color:#006666;font-weight:600;margin-right:6px}
        .features-grid{margin-top:14px;padding:0;list-style:none;columns:2;column-gap:28px}
        @media (max-width:640px){.features-grid{columns:1}}
        .features-grid li{break-inside:avoid;position:relative;padding-left:26px;margin:10px 0;color:#333}
        .features-grid li::before{content:"✓";position:absolute;left:0;top:0;line-height:1;color:#008080;font-weight:700}
        #breadcrumb{font-size: 10px;text-decoration: none; color:var(--jet); padding-left:10px;}

        #breadcrumb {
            font-size: 14px;
            color: #666;
            left:10px;
        }

        #breadcrumb .breadcrumb-link {
            cursor: pointer;
            color: #444;
            text-decoration: none;
            transition: .2s;
        }

        #breadcrumb .breadcrumb-link:hover {
            color: #008080;       /* لون اللينك */
            text-decoration: underline;
        }

    </style>

    <script>
        // cart helpers
        function getCart(){try{return JSON.parse(localStorage.getItem('cart')||'[]')}catch{return[]}}
        function setCart(n){localStorage.setItem('cart',JSON.stringify(n));window.dispatchEvent(new Event('cart:updated'))}
        function getCartCount(){return getCart().reduce((a,i)=>a+(+i.quantity||0),0)}
        function updateHeaderCartCount(){const el=document.querySelector('#header #cart-count,#header-slot #cart-count,#cart-count,.main-header .cart .badge');if(el)el.textContent=getCartCount()}
        // change main image
        function changeImage(src,el){document.getElementById('main-product-image').src=src;document.querySelectorAll('.image-thumbnail').forEach(t=>t.classList.remove('active'));el?.classList.add('active')}
    </script>
</head>
<body>
<div id="header"></div>
<nav id="breadcrumb" style="margin:10px 0;color:#6b7280;font-size:14px"></nav>

<section class="product-detail">
    <div class="container">
        <div class="product-wrapper">
            <!-- Gallery -->
            <div class="product-gallery">
                <div class="main-image-container">
                    <img id="main-product-image" class="main-image" src="../images/product1.jpg" alt="Product">
                    <div class="image-thumbnails">
                        <div class="image-thumbnail active" onclick="changeImage('../images/product1.jpg',this)"><img src="../images/product1.jpg" alt=""></div>
                    </div>
                </div>
            </div>

            <!-- Info -->
            <div class="product-info">
                <h1 class="product-title"></h1>
                <p class="description"></p>

                <div class="price-section">
                    <span class="old-price">₪120</span>
                    <span class="discount">OFF</span>
                    <span class="new-price">₪89</span>
                </div>

                <div class="rating"></div>

                <div class="sizes">
                    <div class="size-row">
                        <p class="size-title">Size:</p>
                        <a id="size-guide-toggle" class="size-guide-link">Size Guide</a>
                    </div>
                    <div class="size-options"></div>

                    <!-- Size Guide -->
                    <div id="size-guide" class="size-guide">
                        <div class="sg-header">
                            <strong>Sizing</strong>
                            <div class="tabs">
                                <button class="tab active" data-unit="US">US</button>
                                <button class="tab" data-unit="Metric">Metric</button>
                            </div>
                        </div>
                        <div class="sg-body"></div>
                    </div>
                </div>

                <button class="add-to-cart">Add to Cart</button>
            </div>
        </div>

        <!-- Details (features -> description) -->
        <div class="product-features">
            <h2>Product Features</h2>
            <ul class="features-list"><li>Placeholder</li></ul>
        </div>

        <!-- Reviews (unchanged) -->
        <section class="product-reviews">
            <h2>Customer Reviews</h2>
            <div class="review-list">
                <div class="review"><strong>Fatima A.</strong><p>Loved the quality and fast shipping!</p></div>
                <div class="review"><strong>Sara M.</strong><p>Nice colors and soft material. Will buy again.</p></div>
            </div>
            <form class="review-form">
                <h3>Leave a Comment</h3>
                <label><textarea placeholder="Write your review..."></textarea></label>
                <button type="submit">Submit</button>
            </form>
        </section>
    </div>
</section>

<div id="foot"></div>

<script>
    // inject header
    fetch('header.html').then(r=>r.text()).then(h=>{
        document.getElementById('header').innerHTML=h;updateHeaderCartCount();
        addEventListener('storage',e=>{if(e.key==='cart')updateHeaderCartCount()});
        addEventListener('cart:updated',updateHeaderCartCount);
    });
    fetch('footer.html')
        .then(response => response.text())
        .then(data => {
            document.getElementById('foot').innerHTML = data;
        });
    

    // like & card demo handlers (keep existing if you already have)
    document.addEventListener('DOMContentLoaded',()=>{
        document.body.addEventListener('click',e=>{
            const t=e.target.closest('.like-btn'); if(!t) return;
            let icon=t.querySelector('i'), count=t.querySelector('.like-count'), n=parseInt(count.textContent||'0',10);
            const liked=icon.classList.contains('fa-solid');
            icon.classList.toggle('fa-solid',!liked); icon.classList.toggle('fa-regular',liked);
            count.textContent= n+(liked?-1:1);
        });
    });

    // ===== PRODUCT LOGIC =====
    (function(){
        const $=s=>document.querySelector(s);

        function starsHTML(avg){const n=Math.round(+avg||0);return Array.from({length:5},(_,i)=>`<span class="star ${i<n?'filled':''}">★</span>`).join('')}

        function renderBreadcrumb(p) {
            const el = document.getElementById('breadcrumb');
            if (!el) return;

            const parts = [
                { name: 'Home', url: 'index.html' },
                { name: p.category, url: `category.html?cat=${encodeURIComponent(p.category)}` },
                { name: p.subcategory, url: `category.html?cat=${encodeURIComponent(p.category)}&sub=${encodeURIComponent(p.subcategory)}` },
                { name: p.name } // المنتج الحالي بدون رابط
            ];

            el.innerHTML = parts.map((part,i) => {
                if (part.url && i < parts.length-1) {
                    return `<span class="breadcrumb-link" onclick="location.href='${part.url}'">${part.name}</span>`;
                } else {
                    return `<span class="text-gray-700 font-medium">${part.name}</span>`;
                }
            }).join(' / ');
        }

        // Size guide data – Toddler example
        const SIZE_GUIDES={
            toddler:{
                US:[
                    {size:'2T',height:'88 – 93cm',weight:'13.2 – 14.1kg'},
                    {size:'3T',height:'93 – 99cm',weight:'14.1 – 15kg'},
                    {size:'4T',height:'99 – 105cm',weight:'15 – 17kg'},
                    {size:'5T',height:'105 – 112cm',weight:'17 – 19.1kg'},
                ],
                Metric:[
                    {size:'2T',height:'88 – 93 cm',weight:'13.2 – 14.1 kg'},
                    {size:'3T',height:'93 – 99 cm',weight:'14.1 – 15 kg'},
                    {size:'4T',height:'99 – 105 cm',weight:'15 – 17 kg'},
                    {size:'5T',height:'105 – 112 cm',weight:'17 – 19.1 kg'},
                ]
            }
        };

        function buildSizeTable(target, group='toddler', unit='US'){
            const data=(SIZE_GUIDES[group]||SIZE_GUIDES.toddler)[unit];
            target.innerHTML=
                `<table><thead><tr><th>Size</th><th>Height</th><th>Weight</th></tr></thead>
          <tbody>${data.map(r=>`<tr><td>${r.size}</td><td>${r.height}</td><td>${r.weight}</td></tr>`).join('')}</tbody>
        </table>`;
        }

        async function init(){
            const id=Number(new URLSearchParams(location.search).get('id')||0);
            if(!id){location.href='category.html';return;}

            const res=await fetch(`/matchymatchy/backend/products.php?id=${id}`,{headers:{Accept:'application/json'}});
            if(!res.ok){alert('Failed to load product');return}
            const j=await res.json(); if(!j.ok||!j.data){alert('Product not found');return}
            const p=j.data;

            // breadcrumb (category/subcategory may be missing -> fallback handled)
            renderBreadcrumb(p);

            // title + prices
            document.title=`${p.name} • Matchy Matchy`; $('.product-title').textContent=p.name;
            $('.new-price').textContent=`₪${(+p.price).toFixed(2)}`;
            const oldEl=$('.old-price'), discEl=$('.discount');
            if(p.old_price){ oldEl.style.display=''; oldEl.textContent=`₪${(+p.old_price).toFixed(2)}`; discEl.style.display=''; }
            else { oldEl.style.display='none'; discEl.style.display='none'; }

            // rating
            const rEl=$('.rating');
            rEl.innerHTML=`<span class="rating-stars">${starsHTML(p.rating_avg)}</span>
                     <span style="margin-inline:8px;font-weight:600">${p.rating_avg?.toFixed?.(1) ?? '—'}</span>
                     <span style="color:#666">(${p.rating_count||0} reviews)</span>`;

            // images
            const mainImg=$('#main-product-image'), thumbs=$('.image-thumbnails');
            const imgs=(Array.isArray(p.images)&&p.images.length)?p.images:[p.image_main_url];
            mainImg.src=imgs[0]||'../images/placeholder.jpg';
            thumbs.innerHTML=imgs.map((src,i)=>`<div class="image-thumbnail ${i?'':'active'}" onclick="changeImage('${src}',this)"><img src="${src}" alt="Image ${i+1}"></div>`).join('');

            // sizes
            const sizesWrap=$('.size-options'); let selected=null;
            if(Array.isArray(p.sizes)&&p.sizes.length){
                sizesWrap.innerHTML=p.sizes.map(s=>`<button type="button" data-size="${s}">${s}</button>`).join('');
                sizesWrap.addEventListener('click',e=>{
                    const b=e.target.closest('button[data-size]'); if(!b) return;
                    selected=b.dataset.size; sizesWrap.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));
                });
            }

            // add to cart
            const addBtn=document.querySelector('.add-to-cart');
            addBtn.addEventListener('click',()=>{
                const cart=getCart();
                const i=cart.findIndex(x=>x.id===p.id && (x.size||null)===(selected||null));
                if(i>=0) cart[i].quantity+=1;
                else cart.push({id:p.id,name:p.name,price:+p.price,image:p.image_main_url||imgs[0],size:selected||null,quantity:1});
                setCart(cart); addBtn.textContent='Added ✓'; setTimeout(()=>addBtn.textContent='Add to Cart',1100);
            });

            // transform features -> details box from description
            const pf=document.querySelector('.product-features');
            if(pf){
                const raw=String(p.description||'').trim();
                let cleaned=raw.replace(/^About This Item\s*/i,'').replace(/\n?Features\s*/i,'\n__FEATURES__\n').replace(/\r/g,'').trim();
                let styleLine=''; cleaned=cleaned.replace(/(^|\n)\s*Style\s*#\s*([^\n]+)\s*/i,(m,_a,v)=>{styleLine=v.trim();return '\n';});
                const parts=cleaned.split('__FEATURES__'), about=(parts[0]||'').trim(), feats=(parts[1]||'').trim();
                const paras=about.split(/\n{2,}|(?<=\.)\s+(?=[A-Z(])/g).map(s=>s.trim()).filter(Boolean);
                const features=feats.split(/[\n•\-–]+/g).map(s=>s.trim()).filter(s=>s.length>2);

                pf.innerHTML=`<h2>Details</h2>
          <div class="details-box">
            <h3>About This Item</h3>
            ${paras.map(p=>`<p>${p}</p>`).join('')}
            ${styleLine?`<div class="details-meta"><span class="label">Style #</span><span>${styleLine}</span></div>`:''}
            ${features.length?`<ul class="features-grid">${features.map(li=>`<li>${li}</li>`).join('')}</ul>`:''}
          </div>`;
            }

            // ===== Size Guide interactions =====
            const sg=document.getElementById('size-guide');
            const sgBody=sg.querySelector('.sg-body');
            const toggle=document.getElementById('size-guide-toggle');
            const tabs=sg.querySelectorAll('.tab');

            // pick group automatically (very simple guess by name, adjust as needed)
            const group = /toddler/i.test(p.name) || /toddler/i.test(p.category||'') ? 'toddler' : 'toddler';

            // initial table
            buildSizeTable(sgBody, group, 'US');

            toggle.addEventListener('click',()=> sg.classList.toggle('open'));
            tabs.forEach(tb=>{
                tb.addEventListener('click',()=>{
                    tabs.forEach(x=>x.classList.remove('active')); tb.classList.add('active');
                    buildSizeTable(sgBody, group, tb.dataset.unit);
                });
            });
        }

        init();
    })();
</script>

<script src="../js/indexscript.js"></script>
<script defer src="../js/headerjs.js"></script>
</body>
</html>
