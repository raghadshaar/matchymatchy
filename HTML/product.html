        .size-options button[disabled]{opacity:.45;cursor:not-allowed;text-decoration:line-through}

        /* ===== Size Guide box ===== */
        .size-guide{margin-top:14px;background:#fafafa;border:1px solid #eee;border-radius:12px;padding:16px;display:none}
        .size-guide.open{display:block}
        .size-guide .sg-header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
        .size-guide .tabs{display:flex;gap:10px}
        .size-guide .tab{border:1px solid #dfe7e7;background:#fff;padding:6px 10px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px}
        .size-guide .tab.active{background:#008080;border-color:#008080;color:#fff}
        .size-guide table{width:100%;border-collapse:collapse;margin-top:6px}
        .size-guide th,.size-guide td{padding:14px 12px;border-bottom:1px solid #eee;text-align:left}
        .size-guide tr:nth-child(even){background:#f5f7f7}
        .size-guide th{color:#111;font-weight:700}
        .size-guide td{color:#333}

        .details-box h3{margin:0 0 10px;color:var(--jet);font-weight:700;font-size:20px}

        .details-meta{margin-top:8px;font-size:.95rem;color:#555}
        .details-meta .label{color:#006666;font-weight:600;margin-right:6px}
        .features-grid{margin-top:14px;padding:0;list-style:none;columns:2;column-gap:28px}
        @media (max-width:640px){.features-grid{columns:1}}
        .features-grid li{break-inside:avoid;position:relative;padding-left:26px;margin:10px 0;color:#333}
        .features-grid li::before{content:"✓";position:absolute;left:0;top:0;line-height:1;color:#008080;font-weight:700}
        #breadcrumb{font-size: 10px;text-decoration: none; color:var(--jet); padding-left:10px;}

        }

        #breadcrumb .breadcrumb-link:hover {

        }

<script>
    let CSRF = null;

    async function cartApi(action, method='GET', body=null){
        const url = `/matchymatchy/api/cart.php?action=${encodeURIComponent(action)}`;
        const opts = { method, headers: { Accept: 'application/json' } };
        if (method !== 'GET') {
            opts.headers['Content-Type'] = 'application/json';
            if (CSRF) opts.headers['X-CSRF-Token'] = CSRF;
            if (body)  opts.body = JSON.stringify(body);
        }

        let res, text;
        try { res = await fetch(url, opts); }
        catch (e) { console.error('Cart API network error:', e); return null; }

        try { text = await res.text(); } catch { text = ''; }

        if (!res.ok) {                       // 4xx / 5xx
            console.error('Cart API HTTP', res.status, text.slice(0,400));
            return null;
        }

        let data;
        try { data = JSON.parse(text); }     // قد يرمي SyntaxError لو النص ليس JSON
        catch (e) {
            console.error('Cart API invalid JSON. Body:', text.slice(0,400));
            return null;
        }

        if (data && data.csrf) CSRF = data.csrf;
        return data;
    }
</script>

    async function refreshHeaderCartCount(){
        const d = await cartApi('list');
        // حارس حتى لو الداتا null ما يصير reduce error
        if (!d || !Array.isArray(d.items)) {
            document.querySelectorAll('#cart-count').forEach(el => el.textContent = 0);
            return;
        }
        const count = d.items.reduce((s,i)=> s + Number(i.quantity||0), 0); // Array.reduce
        document.querySelectorAll('#cart-count').forEach(el => el.textContent = count);
    }

    // ===== PRODUCT LOGIC =====
    (function(){
        const $=s=>document.querySelector(s);
        let reviewOffset = 0;
        const reviewLimit = 5;
        function starsHTML(avg){const n=Math.round(+avg||0);return Array.from({length:5},(_,i)=>`<span class="star ${i<n?'filled':''}">★</span>`).join('')}
        async function loadReviews(productId) {
            const res = await fetch(`/matchymatchy/backend/reviews.php?product_id=${productId}&limit=${reviewLimit}&offset=${reviewOffset}`);
            const json = await res.json();
            if (!json.ok) return;

            const list = document.getElementById('reviewsList');
            if (!list) return;

            if (json.reviews.length === 0 && reviewOffset === 0) {
                list.innerHTML = '<p>No reviews yet.</p>';
                document.getElementById('loadMoreReviews').style.display = 'none';
                return;
            }

            list.innerHTML += json.reviews.map(r => {
                const name = `${r.first_name || 'Anonymous'} ${r.last_name?.[0] || ''}.`;
                const email = r.email || '';
                const date = new Date(r.created_at).toLocaleDateString('en-US', {
                    month: 'short', day: 'numeric', year: 'numeric'
                });
                const stars = '★★★★★☆☆☆☆☆'.slice(5 - r.rating, 10 - r.rating);
                const avatar = r.avatar || '../images/avatar.png';

                return `
            <div class="review" style="margin-bottom:20px">
                <div style="display:flex;align-items:center;gap:10px;">
                    <img src="${avatar}" width="40" height="40" style="border-radius:50%;" alt="User">

                    </div>
                </div>
                <div style="margin: 6px 0; font-size: 18px; color: gold;">${stars.slice(0, r.rating)}</div>
                <div style="font-size: 15px; color: #333;">${r.comment}</div>
            </div>
        `;
            }).join('');

            // hide button if no more
            if (json.reviews.length < reviewLimit) {
                document.getElementById('loadMoreReviews').style.display = 'none';
            }

            reviewOffset += reviewLimit;
        }

// bind button


        function renderBreadcrumb(p) {
            const el = document.getElementById('breadcrumb');
            if (!el) return;

            // لو فيه breadcrumbs جاية من الـ API
            if (Array.isArray(p.breadcrumbs)) {
                const html = p.breadcrumbs.map((item, i) => {
                    const isLast = i === p.breadcrumbs.length - 1;
                    const url = item.url;

                    if (!isLast && url) {
                        try {
                            const u = new URL(url, window.location.href);
                            const cat = u.searchParams.get("cat");
                            const sub = u.searchParams.get("sub");
                            let slug = sub || cat;

                            if (slug) {
                                return `<span class="breadcrumb-link" onclick="location.href='category.html?slug=${encodeURIComponent(slug)}'">${item.name}</span>`;
                            }
                        } catch (e) {
                            // إذا الرابط لا يمكن تحليله (مثلاً slug جاهز)
                        }

                        return `<span class="breadcrumb-link" onclick="location.href='${url}'">${item.name}</span>`;
                    }

                    // العنصر الأخير (اسم المنتج)
                    return `<span class="text-gray-700 font-medium">${item.name}</span>`;
                }).join(' / ');
                el.innerHTML = html;
                return;
            }

            // fallback بسيط لو ما فيه breadcrumbs
            const parts = [
                { name: 'Home', url: 'index.html' },
                p.category && p.category_slug ? { name: p.category, url: `category.html?slug=${p.category_slug}` } : null,
                p.subcategory && p.subcategory_slug ? { name: p.subcategory, url: `category.html?slug=${p.subcategory_slug}` } : null,
                { name: p.name }
            ].filter(Boolean);

            el.innerHTML = parts.map((item, i) => {
                const isLast = i === parts.length - 1;
                return isLast || !item.url
                    ? `<span class="text-gray-700 font-medium">${item.name}</span>`
                    : `<span class="breadcrumb-link" onclick="location.href='${item.url}'">${item.name}</span>`;
            }).join(' / ');
        }

        const SIZE_GUIDES = {
            baby: {
                Metric: [
                    { size: 'Newborn', height: '45–50 cm', weight: '2–3 kg' },
                    { size: '0-3M', height: '50–60 cm', weight: '3–5 kg' },
                    { size: '3-6M', height: '60–66 cm', weight: '5–7 kg' },
                    { size: '6-9M', height: '66–72 cm', weight: '7–8.5 kg' },

                ]
            },

                Metric: [
                    { size: '5', height: '105–112 cm', weight: '18–20 kg' },
                    { size: '6', height: '112–118 cm', weight: '20–22 kg' },
                    { size: '7', height: '118–124 cm', weight: '22–25 kg' },
                    { size: '8', height: '124–130 cm', weight: '25–28 kg' },
                    { size: '10', height: '130–140 cm', weight: '28–34 kg' },
                    { size: '12', height: '140–150 cm', weight: '34–40 kg' },
                    { size: '14', height: '150–160 cm', weight: '40–48 kg' }
                ]
            }
        };


        // function buildSizeTable(target, group='toddler', unit='US'){
        //     const data=(SIZE_GUIDES[group]||SIZE_GUIDES.toddler)[unit];
        //     target.innerHTML=
        //         `<table><thead><tr><th>Size</th><th>Height</th><th>Weight</th></tr></thead>
        //   <tbody>${data.map(r=>`<tr><td>${r.size}</td><td>${r.height}</td><td>${r.weight}</td></tr>`).join('')}</tbody>
        // </table>`;
        // }

        function buildSizeTable(target, group='toddler', unit='Metric'){
            const g = (SIZE_GUIDES[group] || SIZE_GUIDES.toddler);
            const data = g[unit] || g['Metric']; // fallback أكيد
            if (!data) { target.innerHTML = '<p style="color:#666">No size data.</p>'; return; }

            target.innerHTML =
                `<table><thead><tr><th>Size</th><th>Height</th><th>Weight</th></tr></thead>
      <tbody>${data.map(r=>`<tr><td>${r.size}</td><td>${r.height}</td><td>${r.weight}</td></tr>`).join('')}</tbody>
    </table>`;
        }


        async function init() {
            const id = Number(new URLSearchParams(location.search).get('id') || 0);
            if (!id) { location.href = 'category.html'; return; }

            // لا تخلي أي فشل هنا يوقف بقية التهيئة (صور، سايز جايد..)
            try { await cartApi('list'); } catch(e){ console.warn(e); }
            try { await refreshHeaderCartCount(); } catch(e){ console.warn(e); }


            const res = await fetch(`/matchymatchy/backend/products.php?id=${id}`, {headers: {Accept: 'application/json'}});
            if (!res.ok) {
                alert('Failed to load product');
                return
            }
            const j = await res.json();
            if (!j.ok || !j.data) {
                alert('Product not found');
                return
            }
            const p = j.data;

            // breadcrumb (category/subcategory may be missing -> fallback handled)
            renderBreadcrumb(p);

            // title + prices
            document.title = `${p.name} • Matchy Matchy`;
            $('.product-title').textContent = p.name;
            $('.new-price').textContent = `₪${(+p.price).toFixed(2)}`;
            const oldEl = $('.old-price'), discEl = $('.discount');
            if (p.old_price) {
                oldEl.style.display = '';
                oldEl.textContent = `₪${(+p.old_price).toFixed(2)}`;

            } else {

                     <span style="color:#666">(${p.rating_count || 0} reviews)</span>`;

            const mainImg = $('#main-product-image'), thumbs = $('.image-thumbnails');
            const imgs = (Array.isArray(p.images) && p.images.length) ? p.images : [p.image_main_url];

            // sizes
            const sizesWrap = $('.size-options');
            let selected = null;
            if (Array.isArray(p.sizes) && p.sizes.length) {
                sizesWrap.innerHTML = p.sizes.map(s => `<button type="button" data-size="${s}">${s}</button>`).join('');
                sizesWrap.addEventListener('click', e => {
                    const b = e.target.closest('button[data-size]');
                    if (!b) return;
                    selected = b.dataset.size;
                    sizesWrap.querySelectorAll('button').forEach(x => x.classList.toggle('active', x === b));
                });
            }

            // add to cart


            // transform features -> details box from description
            const pf = document.querySelector('.product-features');
            if (pf) {
                const raw = String(p.description || '').trim();
                let cleaned = raw.replace(/^About This Item\s*/i, '').replace(/\n?Features\s*/i, '\n__FEATURES__\n').replace(/\r/g, '').trim();
                let styleLine = '';
                cleaned = cleaned.replace(/(^|\n)\s*Style\s*#\s*([^\n]+)\s*/i, (m, _a, v) => {
                    styleLine = v.trim();
                    return '\n';
                });
                const parts = cleaned.split('__FEATURES__'), about = (parts[0] || '').trim(),
                    feats = (parts[1] || '').trim();
                const paras = about.split(/\n{2,}|(?<=\.)\s+(?=[A-Z(])/g).map(s => s.trim()).filter(Boolean);
                const features = feats.split(/[\n•\-–]+/g).map(s => s.trim()).filter(s => s.length > 2);

                pf.innerHTML = `<h2>Details</h2>
          <div class="details-box">
            <h3>About This Item</h3>
            ${paras.map(p => `<p>${p}</p>`).join('')}
            ${styleLine ? `<div class="details-meta"><span class="label">Style #</span><span>${styleLine}</span></div>` : ''}
            ${features.length ? `<ul class="features-grid">${features.map(li => `<li>${li}</li>`).join('')}</ul>` : ''}
          </div>`;
            }

            // ===== Size Guide interactions =====
            const sg = document.getElementById('size-guide');
            const sgBody = sg.querySelector('.sg-body');
            const toggle = document.getElementById('size-guide-toggle');
            const tabs = sg.querySelectorAll('.tab');

            // pick group automatically (very simple guess by name, adjust as needed)
            const group = (p.category_slug || 'toddler').toLowerCase();

            // initial table
            buildSizeTable(sgBody, group, 'Metric');


            toggle.addEventListener('click', () => sg.classList.toggle('open'));
            loadReviews(p.id);


            document.getElementById('loadMoreReviews').addEventListener('click', () => {
                const id = Number(new URLSearchParams(location.search).get('id') || 0);
                if (id) loadReviews(id);
            });
            document.getElementById('submitReviewBtn').addEventListener('click', async () => {
                const rating = document.getElementById('review-rating').value;
                const comment = document.getElementById('reviewComment').value.trim();
                const productId = Number(new URLSearchParams(location.search).get('id') || 0);
                const userEmail = localStorage.getItem('rememberedEmail');
                if (!userEmail) {
                    alert("You must be logged in to submit a review.");
                    return;
                }


                if (!rating || comment === '') {
                    alert("Please provide both rating and comment.");
                    return;
                }

                const res = await fetch('/matchymatchy/backend/review_submit.php', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({product_id: productId, rating, comment, user_email: userEmail})
                });

                const result = await res.json();
                if (result.ok) {
                    alert("Thank you for your review!");
                    location.reload();
                } else {
                    alert("Error: " + (result.error || "Unable to submit review."));
                }
            });

            const addBtn = document.querySelector('.add-to-cart');
            addBtn.addEventListener('click', async () => {
                if (!selected) { alert("Please select a size before adding to cart."); return; }
                addBtn.disabled = true;

                if (!CSRF) await cartApi('list');   // make sure we have a CSRF token
                const resp = await cartApi('add', 'POST', {
                    product_id: p.id,
                    size: selected,         // <— the selected size is sent to the server
                    quantity: 1
                });

                if (resp){
                    addBtn.textContent = 'Added ✓';
                    await refreshHeaderCartCount();   // header badge reflects the DB cart (per-user)
                    setTimeout(()=> addBtn.textContent = 'Add to Cart', 1100);
                }
                addBtn.disabled = false;
