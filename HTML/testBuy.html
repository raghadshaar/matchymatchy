<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Checkout - Matchy Matchy</title>
</head>
<body>

<h2>إتمام عملية الدفع</h2>
<p>المجموع الكلي: 49.99 USD</p>

<!-- هنا بيظهر زر PayPal -->
<div id="paypal-button-container"></div>

<!-- SDK + الكود -->
<script src="https://www.paypal.com/sdk/js?client-id=AeNRbUtyWFnhdgD_OhFSyJJlz1qg8M3pVz54kkxwK97qK8YyBJTRTL4_1JMImxb8TTvRDqHp3kYVCcW2&currency=USD"></script>
<script>
    paypal.Buttons({
        createOrder: function(data, actions) {
            return actions.order.create({
                purchase_units: [{
                    amount: { value: '49.99' } // المبلغ مؤقت للتجربة
                }]
            });
        },
        onApprove: function(data, actions) {
            return actions.order.capture().then(function(details) {
                alert('تم الدفع بواسطة ' + details.payer.name.given_name);
            });
        }
    }).render('#paypal-button-container');
</script>

</body>
</html>
