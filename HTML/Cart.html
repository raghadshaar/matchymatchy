<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - Kids Fashion Store</title>
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="../styles/style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Pacifico&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.min.css">
    <link rel="stylesheet" href="../styles/style.css" />
    <style>
        :where([class^="ri-"])::before { content: "\f3c2"; }
        :root {
            --baby: #F9F8F3;
            --jet: #383838;
            --teal: #008080;
            --pink: #E4CFC3;
            --umber: #715E51;
            --white: #ffffff;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--baby);
            color: var(--jet);
        }
        .font-pacifico {
            font-family: 'Pacifico', cursive;
        }
        .bg-baby { background-color: var(--baby); }
        .bg-jet { background-color: var(--jet); }
        .bg-teal { background-color: var(--teal); }
        .bg-pink { background-color: var(--pink); }
        .bg-umber { background-color: var(--umber); }
        .text-baby { color: var(--baby); }
        .text-jet { color: var(--jet); }
        .text-teal { color: var(--teal); }
        .text-pink { color: var(--pink); }
        .text-umber { color: var(--umber); }
        .border-teal { border-color: var(--teal); }
        .border-pink { border-color: var(--pink); }
        .hover\:bg-teal:hover { background-color: var(--teal); }
        .hover\:bg-pink:hover { background-color: var(--pink); }
        .hover\:text-teal:hover { color: var(--teal); }
        .hover\:text-pink:hover { color: var(--pink); }
        .hover\:border-teal:hover { border-color: var(--teal); }
        .hover\:border-pink:hover { border-color: var(--pink); }
        .rounded-button { border-radius: 8px !important; }

        .quantity-btn {
            transition: all 0.2s ease;
        }
        .quantity-btn:hover {
            transform: scale(1.05);
        }
        .cart-item {
            transition: all 0.3s ease;
        }
        .cart-item.removing {
            opacity: 0;
            transform: translateX(-100%);
        }
        .toast {
            position: fixed;
            top: 2rem;
            right: 2rem;
            z-index: 1000;
            transition: all 0.3s ease;
        }
        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }
        .toast.hide {
            opacity: 0;
            transform: translateY(-2rem);
        }

        @media (max-width: 768px) {
            .cart-summary {
                position: static !important;
            }
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#008080',
                        secondary: '#E4CFC3'
                    },
                    borderRadius: {
                        'none': '0px',
                        'sm': '4px',
                        DEFAULT: '8px',
                        'md': '12px',
                        'lg': '16px',
                        'xl': '20px',
                        '2xl': '24px',
                        '3xl': '32px',
                        'full': '9999px',
                        'button': '8px'
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-baby min-h-screen">
<header class="bg-white shadow-sm border-b border-gray-100">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">
            <div class="flex items-center">
                <h1 class="font-pacifico text-2xl text-teal">MatchyMatchy</h1>
            </div>
            <nav class="hidden md:flex items-center space-x-8">
                <a href="#" class="text-jet hover:text-teal transition-colors">Shop</a>
                <a href="#" class="text-jet hover:text-teal transition-colors">Categories</a>
                <a href="#" class="text-jet hover:text-teal transition-colors">About</a>
                <a href="#" class="text-jet hover:text-teal transition-colors">Contact</a>
            </nav>
            <div class="flex items-center space-x-4">
                <div class="w-8 h-8 flex items-center justify-center">
                    <i class="ri-search-line text-xl text-jet hover:text-teal cursor-pointer transition-colors"></i>
                </div>
                <div class="w-8 h-8 flex items-center justify-center">
                    <i class="ri-user-line text-xl text-jet hover:text-teal cursor-pointer transition-colors"></i>
                </div>
                <div class="w-8 h-8 flex items-center justify-center relative">
                    <i class="ri-shopping-cart-line text-xl text-teal"></i>
                    <span class="absolute -top-2 -right-2 bg-pink text-jet text-xs rounded-full w-5 h-5 flex items-center justify-center" id="cart-count">0</span>
                </div>
            </div>
        </div>
    </div>
</header>

<main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="mb-8">
        <h1 class="font-pacifico text-3xl text-jet mb-2">Shopping Cart</h1>
        <p class="text-umber">Review your items before checkout</p>
    </div>

    <div class="lg:grid lg:grid-cols-3 lg:gap-8">
        <div class="lg:col-span-2">
            <div id="cart-items" class="space-y-4">
                <!-- Cart items will be populated here -->
            </div>

            <div id="empty-cart" class="hidden text-center py-16">
                <div class="w-32 h-32 mx-auto mb-6 bg-pink rounded-full flex items-center justify-center">
                    <i class="ri-shopping-cart-line text-4xl text-umber"></i>
                </div>
                <h2 class="font-pacifico text-2xl text-jet mb-4">Your cart is empty</h2>
                <p class="text-umber mb-8">Looks like you haven't added any adorable outfits yet!</p>
                <button class="bg-teal text-white px-8 py-3 !rounded-button hover:bg-opacity-90 transition-all whitespace-nowrap">
                    Shop Now
                </button>
            </div>
        </div>

        <div class="lg:col-span-1 mt-8 lg:mt-0">
            <div class="cart-summary bg-white rounded-lg shadow-lg p-6 lg:sticky lg:top-8">
                <h2 class="font-pacifico text-xl text-jet mb-6">Cart Summary</h2>

                <div class="space-y-4 mb-6">
                    <div class="flex justify-between">
                        <span class="text-umber">Subtotal</span>
                        <span class="text-jet font-medium" id="subtotal">₪0.00</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-umber">Shipping</span>
                        <span class="text-jet font-medium" id="shipping">₪15.00</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-umber">Tax</span>
                        <span class="text-jet font-medium" id="tax">₪0.00</span>
                    </div>
                    <hr class="border-gray-200">
                    <div class="flex justify-between text-lg font-semibold">
                        <span class="text-jet">Total</span>
                        <span class="text-jet" id="total">₪15.00</span>
                    </div>
                </div>

                <div class="mb-6">
                    <label class="block text-sm font-medium text-umber mb-2">Coupon Code</label>
                    <div class="flex space-x-2">
                        <input type="text" id="coupon-input" placeholder="Enter code" class="flex-1 px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:border-teal text-sm">
                        <button id="apply-coupon" class="bg-pink text-jet px-4 py-2 !rounded-button hover:bg-opacity-80 transition-all whitespace-nowrap text-sm">
                            Apply
                        </button>
                    </div>
                    <div id="coupon-message" class="mt-2 text-sm hidden"></div>
                </div>

                <div class="space-y-3">
                    <button id="checkout-btn" class="w-full bg-teal text-white py-3 !rounded-button hover:bg-opacity-90 transition-all font-medium whitespace-nowrap">
                        Proceed to Checkout
                    </button>
                    <a href="#" class="block text-center text-pink hover:text-umber transition-colors">
                        Continue Shopping
                    </a>
                </div>
            </div>
        </div>
    </div>

</main>

<div id="toast" class="toast hide bg-white border-l-4 border-teal rounded-md shadow-lg p-4 max-w-sm">
    <div class="flex items-center">
        <div class="w-6 h-6 flex items-center justify-center">
            <i class="ri-check-line text-teal"></i>
        </div>
        <div class="ml-3">
            <p class="text-sm text-jet" id="toast-message">Item removed from cart</p>
        </div>
    </div>
</div>



<script id="checkout-functionality">
    document.getElementById('checkout-btn').addEventListener('click', function() {
        if (cart.length === 0) {
            showToast('Your cart is empty');
            return;
        }

        showToast('Redirecting to checkout...');
        setTimeout(() => {
            window.location.href = '#checkout';
        }, 1000);
    });
</script>
<script>
    function showToast(message) {
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toast-message');
        toastMessage.textContent = message;
        toast.classList.remove('hide');
        toast.classList.add('show');
        setTimeout(() => {
            toast.classList.remove('show');
            toast.classList.add('hide');
        }, 3000);
    }
</script>
<script>
    document.getElementById('checkout-btn').addEventListener('click', function () {
        if (!cartData.items.length) {
            showToast('Your cart is empty');
            return;
        }
        showToast('Redirecting to checkout...');
        setTimeout(() => { window.location.href = '#checkout'; }, 1000);
    });
</script>

<div id="foot">

</div>
<script>

    fetch('footer.html')
        .then(response => response.text())
        .then(data => {
            document.getElementById('foot').innerHTML = data;
        });
</script>
<script>
    const ILS = new Intl.NumberFormat('he-IL', { style: 'currency', currency: 'ILS' }); // ₪
    const fmt = n => ILS.format(n);  // MDN: Intl.NumberFormat / Fetch docs below. :contentReference[oaicite:7]{index=7}

    let csrf = null;       // set after first /list call
    let cartData = { items: [], summary: { subtotal: 0, shipping: 0, tax: 0, total: 0 } };

    async function api(action, method='GET', body=null) {
        const opts = { method, headers: { 'Accept':'application/json' } };
        if (method !== 'GET') {
            opts.headers['Content-Type'] = 'application/json';
            if (csrf) opts.headers['X-CSRF-Token'] = csrf;     // matches server check
            if (body) opts.body = JSON.stringify(body);
        }
        const res = await fetch(`/matchymatchy/api/cart.php?action=${encodeURIComponent(action)}`, opts); // MDN fetch. :contentReference[oaicite:8]{index=8}
        if (res.status === 401) { alert('Please sign in to use your cart.'); return null; }
        const data = await res.json();
        return data;
    }

    async function loadCart() {
        const data = await api('list');
        if (!data) return;
        csrf = data.csrf || csrf;
        cartData = data;
        renderCartFromApi();
    }

    async function addToCart(productId, size='', quantity=1) {
        const data = await api('add', 'POST', { product_id: productId, size, quantity });
        if (!data) return;
        cartData = data;
        renderCartFromApi();
    }

    async function updateQuantity(itemId, quantity) {
        if (quantity <= 0) return removeItem(itemId);
        const data = await api('update', 'POST', { item_id: itemId, quantity });
        if (!data) return;
        cartData = data;
        renderCartFromApi();
    }

    async function removeItem(itemId) {
        const data = await api('remove', 'POST', { item_id: itemId });
        if (!data) return;
        cartData = data;
        renderCartFromApi();
    }

    async function clearCart() {
        const data = await api('clear', 'POST', {});
        if (!data) return;
        cartData = data;
        renderCartFromApi();
    }

    // Optional: apply coupon server-side
    async function applyCoupon(code) {
        const resp = await api('applyCoupon', 'POST', { code });
        const msgEl = document.getElementById('coupon-message');
        if (!resp || resp.error) {
            msgEl.textContent = resp?.error || 'Failed to apply coupon';
            msgEl.className = 'mt-2 text-sm text-red-500';
            return;
        }
        // Update summary UI with server math
        const s = resp.summary;
        document.getElementById('subtotal').textContent = fmt(s.subtotal);
        document.getElementById('shipping').textContent = fmt(s.shipping);
        document.getElementById('tax').textContent = fmt(s.tax);
        document.getElementById('total').textContent = fmt(s.total);
        msgEl.textContent = `Coupon applied! ${resp.coupon.description}`;
        msgEl.className = 'mt-2 text-sm text-teal';
    }

    // Reuse your existing render HTML but feed server IDs and prices
    function renderCartFromApi() {
        const list = document.getElementById('cart-items');
        const empty = document.getElementById('empty-cart');

        if (!cartData.items.length) {
            list.innerHTML = '';
            empty.classList.remove('hidden');
        } else {
            empty.classList.add('hidden');
            list.innerHTML = cartData.items.map(item => `
        <div class="cart-item bg-white rounded-lg shadow-sm p-4 md:p-6" data-id="${item.id}">
          <div class="flex flex-col md:flex-row md:items-center md:space-x-6 space-y-4 md:space-y-0">
            <div class="flex-shrink-0">
              <img loading="lazy" src="${item.image || ''}" alt="${item.name || 'Item'}" class="w-24 h-24 object-cover rounded-lg">
            </div>
            <div class="flex-1 min-w-0">
              <h3 class="font-pacifico text-lg text-jet mb-1">${item.name || 'Product'}</h3>
              <p class="text-xs text-umber bg-pink px-2 py-1 rounded-full inline-block">${item.size || ''}</p>
            </div>
            <div class="flex flex-col md:flex-row md:items-center md:space-x-6 space-y-4 md:space-y-0">
              <div class="text-center">
                <p class="text-sm text-umber">Price</p>
                <p class="font-medium text-jet">${fmt(item.unit_price)}</p>
              </div>
              <div class="flex items-center justify-center space-x-3">
                <button class="quantity-btn w-8 h-8 rounded-full border-2 border-teal flex items-center justify-center hover:bg-teal hover:text-white transition-all" aria-label="Decrease quantity" onclick="updateQuantity(${item.id}, ${item.quantity - 1})">
                  <i class="ri-subtract-line" aria-hidden="true"></i>
                </button>
                <span class="w-12 text-center font-medium text-jet">${item.quantity}</span>
                <button class="quantity-btn w-8 h-8 rounded-full border-2 border-teal flex items-center justify-center hover:bg-teal hover:text-white transition-all" aria-label="Increase quantity" onclick="updateQuantity(${item.id}, ${item.quantity + 1})">
                  <i class="ri-add-line" aria-hidden="true"></i>
                </button>
              </div>
              <div class="text-center">
                <p class="text-sm text-umber">Total</p>
                <p class="font-semibold text-jet">${fmt(item.unit_price * item.quantity)}</p>
              </div>
              <button class="w-8 h-8 flex items-center justify-center text-red-500 hover:bg-red-50 rounded-full transition-all" aria-label="Remove item" onclick="removeItem(${item.id})">
                <i class="ri-delete-bin-line" aria-hidden="true"></i>
              </button>
            </div>
          </div>
        </div>
      `).join('');
        }

        // Summary from server
        const s = cartData.summary;
        document.getElementById('subtotal').textContent = fmt(s.subtotal);
        document.getElementById('shipping').textContent = fmt(s.shipping);
        document.getElementById('tax').textContent = fmt(s.tax);
        document.getElementById('total').textContent = fmt(s.total);
        document.getElementById('cart-count').textContent =
            cartData.items.reduce((sum, it) => sum + it.quantity, 0);
    }

    // Coupon button hook: wire to server
    document.getElementById('apply-coupon').addEventListener('click', () => {
        const code = document.getElementById('coupon-input').value.trim();
        if (!code) {
            const el = document.getElementById('coupon-message');
            el.textContent = 'Please enter a coupon code';
            el.className = 'mt-2 text-sm text-red-500';
            return;
        }
        applyCoupon(code);
    });

    // Load cart on page load
    document.addEventListener('DOMContentLoaded', loadCart);
</script>
<script>
    document.getElementById('checkout-btn').addEventListener('click', async () => {
        try{
            const res = await fetch('/matchymatchy/api/checkout.php', { method:'POST', headers:{'Accept':'application/json'} });
            const j = await res.json();
            if (!j.ok) { alert(j.error || 'Checkout failed'); return; }
            // اختياري: وجّهي المستخدم لصفحة تأكيد
            alert('Order placed: ' + j.order_public_id);
            location.href = '/matchymatchy/admin/orders.html';
        }catch(e){
            alert('Network error');
        }
    });
</script>
</body>

</html>
