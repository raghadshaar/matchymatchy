<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Shopping Cart - Kids Fashion Store</title>

    <!-- Tailwind + fonts/icons -->
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Pacifico&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.min.css">
    <link rel="stylesheet" href="../styles/style.css"/>

    <style>
        :where([class^="ri-"])::before { content: "\f3c2"; }
        :root {
            --baby: #F9F8F3;
            --jet: #383838;
            --teal: #008080;
            --pink: #E4CFC3;
            --umber: #715E51;
            --white: #ffffff;
        }
        body { font-family: 'Poppins', sans-serif; background-color: var(--baby); color: var(--jet); }
        .font-pacifico { font-family: 'Pacifico', cursive; }
        .bg-baby{background:var(--baby)} .bg-jet{background:var(--jet)} .bg-teal{background:var(--teal)}
        .bg-pink{background:var(--pink)} .bg-umber{background:var(--umber)}
        .text-baby{color:var(--baby)} .text-jet{color:var(--jet)} .text-teal{color:var(--teal)}
        .text-pink{color:var(--pink)} .text-umber{color:var(--umber)}
        .rounded-button{border-radius:8px !important}
        .quantity-btn{transition:.2s} .quantity-btn:hover{transform:scale(1.05)}
        .cart-item{transition:.3s} .cart-item.removing{opacity:0;transform:translateX(-100%)}
        .toast{position:fixed;top:2rem;right:2rem;z-index:1000;transition:.3s}
        .toast.show{opacity:1;transform:translateY(0)} .toast.hide{opacity:0;transform:translateY(-2rem)}
        @media (max-width:768px){ .cart-summary{position:static !important} }
    </style>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#008080', secondary: '#E4CFC3' },
                    borderRadius: {
                        'none':'0px','sm':'4px',DEFAULT:'8px','md':'12px','lg':'16px',
                        'xl':'20px','2xl':'24px','3xl':'32px','full':'9999px','button':'8px'

<!-- Cart logic -->
<script>
    const ILS = new Intl.NumberFormat('he-IL', { style: 'currency', currency: 'ILS' });
    const fmt = n => ILS.format(n);

    let csrf = null;
    let cartData = { items: [], summary: { subtotal: 0, shipping: 0, tax: 0, total: 0 } };

    function showToast(message) {
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toast-message');
        toastMessage.textContent = message;
        toast.classList.remove('hide'); toast.classList.add('show');
        setTimeout(() => { toast.classList.remove('show'); toast.classList.add('hide'); }, 3000);
    }

    async function api(action, method='GET', body=null) {
        const opts = { method, headers: { 'Accept':'application/json' } };
        if (method !== 'GET') {
            opts.headers['Content-Type'] = 'application/json';
            if (csrf) opts.headers['X-CSRF-Token'] = csrf;
            if (body) opts.body = JSON.stringify(body);
        }
        const res = await fetch(`/matchymatchy/api/cart.php?action=${encodeURIComponent(action)}`, opts);
        if (res.status === 401) { alert('Please sign in to use your cart.'); return null; }
        return await res.json();
    }

    async function loadCart() {
        const data = await api('list');
        if (!data) return;
        csrf = data.csrf || csrf;
        cartData = data;
        renderCartFromApi();
    }

    async function addToCart(productId, size='', quantity=1) {
        const data = await api('add', 'POST', { product_id: productId, size, quantity });
        if (!data) return;
        cartData = data; renderCartFromApi();
    }

    async function updateQuantity(itemId, quantity) {
        if (quantity <= 0) return removeItem(itemId);
        const data = await api('update', 'POST', { item_id: itemId, quantity });
        if (!data) return;
        cartData = data; renderCartFromApi();
    }

    async function removeItem(itemId) {
        const data = await api('remove', 'POST', { item_id: itemId });
        if (!data) return;
        cartData = data; renderCartFromApi();
    }

    async function clearCart() {
        const data = await api('clear', 'POST', {});
        if (!data) return;
        cartData = data; renderCartFromApi();
    }

    async function applyCoupon(code) {
        const resp = await api('applyCoupon', 'POST', { code });
        const msgEl = document.getElementById('coupon-message');
        if (!resp || resp.error) {
            msgEl.textContent = resp?.error || 'Failed to apply coupon';
            msgEl.className = 'mt-2 text-sm text-red-500';
            return;
        }
        const s = resp.summary;
        document.getElementById('subtotal').textContent = fmt(s.subtotal);
        document.getElementById('shipping').textContent = fmt(s.shipping);
        document.getElementById('tax').textContent = fmt(s.tax);
        document.getElementById('total').textContent = fmt(s.total);
        msgEl.textContent = `Coupon applied! ${resp.coupon.description}`;
        msgEl.className = 'mt-2 text-sm text-teal';
    }

    function renderCartFromApi() {
        const list = document.getElementById('cart-items');
        const empty = document.getElementById('empty-cart');

        if (!cartData.items.length) {
            list.innerHTML = '';
            empty.classList.remove('hidden');
        } else {
            empty.classList.add('hidden');
            list.innerHTML = cartData.items.map(item => `
        <div class="cart-item bg-white rounded-lg shadow-sm p-4 md:p-6" data-id="${item.id}">
          <div class="flex flex-col md:flex-row md:items-center md:space-x-6 space-y-4 md:space-y-0">
            <div class="flex-shrink-0">
              <img loading="lazy" src="${item.image || ''}" alt="${item.name || 'Item'}" class="w-24 h-24 object-cover rounded-lg">
            </div>
            <div class="flex-1 min-w-0">
              <h3 class="font-pacifico text-lg text-jet mb-1">${item.name || 'Product'}</h3>
              <p class="text-xs text-umber bg-pink px-2 py-1 rounded-full inline-block">${item.size || ''}</p>
            </div>
            <div class="flex flex-col md:flex-row md:items-center md:space-x-6 space-y-4 md:space-y-0">
              <div class="text-center">
                <p class="text-sm text-umber">Price</p>
                <p class="font-medium text-jet">${fmt(item.unit_price)}</p>
              </div>
              <div class="flex items-center justify-center space-x-3">
                <button class="quantity-btn w-8 h-8 rounded-full border-2 border-teal flex items-center justify-center hover:bg-teal hover:text-white transition-all" aria-label="Decrease quantity" onclick="updateQuantity(${item.id}, ${item.quantity - 1})">
                  <i class="ri-subtract-line" aria-hidden="true"></i>
                </button>
                <span class="w-12 text-center font-medium text-jet">${item.quantity}</span>
                <button class="quantity-btn w-8 h-8 rounded-full border-2 border-teal flex items-center justify-center hover:bg-teal hover:text-white transition-all" aria-label="Increase quantity" onclick="updateQuantity(${item.id}, ${item.quantity + 1})">
                  <i class="ri-add-line" aria-hidden="true"></i>
                </button>
              </div>
              <div class="text-center">
                <p class="text-sm text-umber">Total</p>
                <p class="font-semibold text-jet">${fmt(item.unit_price * item.quantity)}</p>
              </div>
              <button class="w-8 h-8 flex items-center justify-center text-red-500 hover:bg-red-50 rounded-full transition-all" aria-label="Remove item" onclick="removeItem(${item.id})">
                <i class="ri-delete-bin-line" aria-hidden="true"></i>
              </button>
            </div>
          </div>
        </div>
      `).join('');
        }

        const s = cartData.summary;
        document.getElementById('subtotal').textContent = fmt(s.subtotal);
        document.getElementById('shipping').textContent = fmt(s.shipping);
        document.getElementById('tax').textContent = fmt(s.tax);
        document.getElementById('total').textContent = fmt(s.total);
        document.getElementById('cart-count').textContent =
            cartData.items.reduce((sum, it) => sum + it.quantity, 0);
    }

    document.getElementById('apply-coupon').addEventListener('click', () => {
        const code = document.getElementById('coupon-input').value.trim();
        if (!code) {
            const el = document.getElementById('coupon-message');
            el.textContent = 'Please enter a coupon code';
            el.className = 'mt-2 text-sm text-red-500';
            return;
        }
        applyCoupon(code);
    });

    document.addEventListener('DOMContentLoaded', loadCart);
</script>

<script src="https://www.paypal.com/sdk/js?client-id=AeNRbUtyWFnhdgD_OhFSyJJlz1qg8M3pVz54kkxwK97qK8YyBJTRTL4_1JMImxb8TTvRDqHp3kYVCcW2&currency=ILS&intent=capture&enable-funding=card"></script>

<script>
    const showPayErr = (msg) => {
        let box = document.getElementById('paypal-errors');
        if (!box) {
            box = document.createElement('div');
            box.id = 'paypal-errors';
            box.className = 'mt-3 text-sm text-red-600';
            document.getElementById('paypal-row').prepend(box);
        }
        box.textContent = msg;
    };

    let paypalRendered = false;

    // Proceed / Checkout button
    document.getElementById('checkout-btn').addEventListener('click', async () => {
        await loadCart(); // your existing function that fills cartData
        if (!cartData.items.length) { showToast('Your cart is empty'); return; }

        document.getElementById('checkout-row').classList.add('hidden');
        document.getElementById('paypal-row').classList.remove('hidden');
        showToast('Choose a payment method');

        if (!paypalRendered) {
            await renderPayPalButtons();
            paypalRendered = true;
        }
    });

    async function waitForPayPal(maxMs = 5000) {
        const start = Date.now();
        while (!window.paypal) {
            await new Promise(r => setTimeout(r, 50));
            if (Date.now() - start > maxMs) throw new Error('PayPal SDK did not load. Check client-id or ad-blocker.');
        }
        return window.paypal;
    }

    async function renderPayPalButtons() {
        try {
            const paypal = await waitForPayPal();

            paypal.Buttons({
                style: { layout: 'vertical' },

                // Optional: validate totals before creating order
                onClick: async (data, actions) => {
                    try {
                        const r = await fetch('/matchymatchy/api/cart.php?action=list', {
                            headers: { 'Accept': 'application/json' },
                            credentials: 'include'
                        });
                        const server = await r.json();
                        if (!server || !server.summary) return actions.reject();

                        const clientTotal = Number((cartData.summary?.total ?? 0).toFixed(2));
                        const serverTotal = Number((server.summary.total ?? 0).toFixed(2));

                        if (clientTotal !== serverTotal) {
                            cartData = server;
                            renderCartFromApi(); // your function to refresh UI
                            showPayErr('Your cart changed. Please review the new total and try again.');
                            return actions.reject();
                        }
                        return actions.resolve();
                    } catch (e) {
                        console.error(e);
                        showPayErr('Could not validate cart. Please try again.');
                        return actions.reject();
                    }
                },

                // Create order on the SERVER
                createOrder: () => {
                    return fetch('/matchymatchy/api/paypal/create-order.php', {
                        method: 'POST',
                        credentials: 'include'
                    }).then(async r => {
                        const txt = await r.text();
                        try {
                            const d = JSON.parse(txt);
                            if (!d.ok || !d.id) throw new Error(d.error || 'create-order failed');
                            return d.id;
                        } catch (e) {
                            console.error('create-order raw:', txt);
                            throw e;
                        }
                    });
                },

                // Capture on the SERVER (no client-side capture, no client cart clear)
                onApprove: async (data) => {
                    try {
                        const r = await fetch(
                            '/matchymatchy/api/paypal/capture-order.php?orderID=' + encodeURIComponent(data.orderID),
                            { method: 'POST', credentials: 'include' }
                        );
                        const txt = await r.text();
                        let details;
                        try { details = JSON.parse(txt); } catch(e){ console.error('capture raw:', txt); throw e; }

                        console.log('server capture response:', details);

                        if (details.ok && details.status === 'COMPLETED') {
                            // Server already: captured, inserted order+items, cleared cart inside a transaction
                            await loadCart(); // refresh UI (should show empty cart)
                            document.getElementById('paypal-row').classList.add('hidden');
                            document.getElementById('checkout-row').classList.remove('hidden');
                            showToast('Order ' + details.public_id + ' placed successfully!');
                            // Optional redirect:
                            // window.location.href = '/HTML/success.html?order=' + encodeURIComponent(details.public_id);
                            return;
                        }

                        // Some sandbox flows:
                        if (details.status === 'PAYER_ACTION_REQUIRED') {
                            showPayErr('Payment requires a new approval. Please try again.');
                            return;
                        }
                        if (details.status === 'INSTRUMENT_DECLINED') {
                            showPayErr('Payment method was declined. Try another method.');
                            return;
                        }

                        throw new Error('Payment not completed: ' + (details.status || details.error || ''));
                    } catch (err) {
                        console.error(err);
                        showPayErr('An error occurred during payment.');
                    }
                },

                onCancel: () => { /* optional */ },
                onError: (err) => { console.error(err); showPayErr('Failed to load payment gateway.'); }
            }).render('#paypal-button-container');

        } catch (e) {
            console.error(e);
            showPayErr(e.message || 'Failed to initialize PayPal.');
        }
    }

    // Render buttons only after user clicks Proceed (kept as your design)
    document.addEventListener('DOMContentLoaded', () => {});
</script>
