<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>All Notifications</title>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <style>
        /* ===== palette ===== */
        :root{
            --baby:#F9F8F3;
            --jet:#383838;
            --teal:#008080;
            --pink:#E4CFC3;
            --umber:#715E51;
            --white:#fff;

            --ink-soft:#8b8f96;
            --line:#e7e5e4;
            --shadow:0 10px 30px rgba(0,0,0,.06);

            --h1:clamp(20px,2.4vw,28px);
            --h2:16px;
            --sm:13px;
        }

        /* ===== base ===== */
        *{box-sizing:border-box}
        html,body{height:100%}
        body{
            margin:0;
            font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial;
            color:var(--jet);
            background:var(--baby);
        }

        /* ===== header ===== */
        .header{
            position:sticky; top:0; z-index:5;
            display:flex; align-items:center; justify-content:space-between;
            gap:12px; padding:14px 18px;
            background:var(--white);
            box-shadow:0 1px 0 var(--line);
        }
        .header .left{display:flex; align-items:center; gap:12px}
        .back-btn{
            border:0; background:transparent; border-radius:10px; padding:8px 10px; cursor:pointer;
        }
        .back-btn:focus-visible{outline:2px solid var(--teal); outline-offset:2px}
        .header h1{margin:0; font-size:var(--h1); font-weight:700}

        .header .actions{display:flex; align-items:center; gap:18px}
        .header .actions .link{
            border:0; background:transparent; color:#c23e3e; cursor:pointer; font-weight:600;
        }
        .header .actions .muted{
            color:var(--teal); font-weight:600; background:transparent; border:0; cursor:pointer;
        }

        /* ===== filter row ===== */
        .toolbar{display:flex; align-items:center; gap:10px; padding:12px 18px}
        .select{
            appearance:none; border:1px solid var(--line); background:var(--white);
            border-radius:12px; padding:10px 14px; min-width:150px; font-weight:600; color:var(--jet);
        }
        .select:focus{outline:2px solid var(--teal); outline-offset:2px}

        /* ===== container ===== */
        .wrap{max-width:980px; margin:0 auto; padding:0 18px 40px}
        .board{
            margin-top:8px;
            background:var(--white);
            border:1px solid var(--line);
            border-radius:18px;
            overflow:hidden;
            box-shadow:var(--shadow);
        }

        /* ===== notification row ===== */
        .item{
            position:relative;
            display:flex; align-items:flex-start; gap:14px;
            padding:16px 18px; min-height:56px;
            border-bottom:1px solid var(--line);
            cursor:pointer;
        }
        .item:last-child{border-bottom:0}
        .item.unread{background:#FBFAF7}
        .item:hover{background:rgba(0,0,0,.02)}
        .item:active{transform:translateY(1px)}
        .item:focus-within{outline:2px solid var(--teal); outline-offset:-2px}

        /* icon */
        .ic{
            width:44px; height:44px; border-radius:12px; flex-shrink:0;
            display:grid; place-items:center; border:1px solid var(--line); background:var(--white);
        }

        /* text */
        .body{flex:1; min-width:0}
        .title{font-size:var(--h2); font-weight:700; line-height:1.25; margin:0 0 4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
        .meta{font-size:var(--sm); color:var(--ink-soft)}

        /* status dot */
        .dot{width:8px; height:8px; border-radius:50%; position:absolute; right:16px; bottom:12px}

        /* per-type colors */
        .type-order   .ic{background:rgba(0,128,128,.07)} .type-order   .ic i{color:var(--teal)}  .type-order   .dot{background:var(--teal)}
        .type-ship    .ic{background:#EEF9F0}              .type-ship    .ic i{color:#24a148}    .type-ship    .dot{background:#24a148}
        .type-stock   .ic{background:#FFF4E6}              .type-stock   .ic i{color:#c67629}    .type-stock   .dot{background:#ff8a1f}
        .type-success .ic{background:#EEF8F0}              .type-success .ic i{color:#2a9d55}    .type-success .dot{background:#2a9d55}
        .type-user    .ic{background:#F2ECF3}              .type-user    .ic i{color:#6e4a7e}    .type-user    .dot{background:#6e4a7e}
        .type-review  .ic{background:#F7F1EE}              .type-review  .ic i{color:#7d5a4f}    .type-review  .dot{background:#7d5a4f}
        .type-cancel  .ic{background:#FFF0F0}              .type-cancel  .ic i{color:#c73b3b}    .type-cancel  .dot{background:#c73b3b}

        /* ===== row actions (hover reveal) ===== */
        .row-actions{
            position:absolute; right:16px; top:14px;
            display:flex; align-items:center; gap:14px;
            opacity:0; pointer-events:none; transition:.15s ease;
            font-size:13px;
        }
        .item:hover .row-actions,
        .item:focus-within .row-actions{opacity:1; pointer-events:auto}
        .act{
            border:0; background:transparent; color:var(--teal);
            font-weight:600; cursor:pointer; padding:4px 8px; border-radius:8px;
        }
        .act:hover{background:rgba(0,128,128,.08)}
        .act.danger{color:#c73b3b}
        .act.danger:hover{background:rgba(199,59,59,.08)}

        /* ===== helpers ===== */
        .empty{
            padding:40px; text-align:center; color:var(--ink-soft);
        }
        @media (max-width:640px){
            .wrap{padding:0 12px 40px}
            .ic{width:40px; height:40px}
            .row-actions{right:12px; top:10px}
        }
    </style>
</head>
<body>

<header class="header">
    <div class="left">
        <button class="back-btn" onclick="history.back()" title="Back">
            <i class="fa-solid fa-arrow-left"></i>
        </button>
        <h1>All Notifications</h1>
    </div>
    <div class="actions">
        <button class="muted" id="markAll">Mark all as read</button>
        <button class="link" id="clearAll">Clear all</button>
    </div>
</header>

<div class="toolbar">
    <select class="select" id="timeFilter">
        <option value="all">All Time</option>
        <option value="today">Today</option>
        <option value="week">This Week</option>
        <option value="month">This Month</option>
    </select>
</div>

<div class="wrap">
    <section class="board" id="list"><!-- items injected --></section>
</div>

<script>
    /* ===== demo data (replace with API later) ===== */
    const data = [
        { id:1, type:'order',   icon:'fa-bag-shopping',   title:'New Order #ORD-2024-1247',          time:'2 minutes ago',  ts: Date.now()-2*60*1000,  unread:true  },
        { id:2, type:'ship',    icon:'fa-truck',          title:'Order #ORD-2024-1243 Shipped',      time:'15 minutes ago', ts: Date.now()-15*60*1000, unread:true  },
        { id:3, type:'stock',   icon:'fa-triangle-exclamation', title:'Low Stock: Premium Headphones', time:'32 minutes ago', ts: Date.now()-32*60*1000, unread:true  },
        { id:4, type:'success', icon:'fa-check',          title:'Order #ORD-2024-1240 Delivered',    time:'1 hour ago',     ts: Date.now()-60*60*1000, unread:false },
        { id:5, type:'user',    icon:'fa-user-plus',      title:'New Customer Registration: Sarah Johnson', time:'2 hours ago', ts: Date.now()-2*60*60*1000, unread:false },
        { id:6, type:'review',  icon:'fa-star',           title:'New Review: 5 Stars for Wireless Speaker', time:'3 hours ago', ts: Date.now()-3*60*60*1000, unread:false },
        { id:7, type:'cancel',  icon:'fa-circle-xmark',   title:'Order #ORD-2024-1238 Cancelled',    time:'4 hours ago',    ts: Date.now()-4*60*60*1000, unread:false },
        { id:8, type:'success', icon:'fa-check',          title:'Order #ORD-2024-1235 Delivered',    time:'Yesterday',      ts: Date.now()-26*60*60*1000, unread:false }
    ];

    const listEl = document.getElementById('list');
    const filterEl = document.getElementById('timeFilter');

    function withinRange(ts, range){
        const now = Date.now();
        const day = 24*60*60*1000;
        if(range==='today'){ const start = new Date(); start.setHours(0,0,0,0); return ts >= +start; }
        if(range==='week'){  return now - ts <= 7*day; }
        if(range==='month'){ return now - ts <= 30*day; }
        return true; // all
    }

    function render(items){
        if(!items.length){
            listEl.innerHTML = `<div class="empty">You’re all caught up 🎉</div>`;
            return;
        }
        listEl.innerHTML = items.map(n=>`
    <article class="item ${n.unread?'unread':''} type-${n.type}" data-id="${n.id}" tabindex="0">
      <div class="ic"><i class="fa-solid ${n.icon}"></i></div>
      <div class="body">
        <h2 class="title">${n.title}</h2>
        <div class="meta">${n.time}</div>
      </div>

      <div class="row-actions" aria-hidden="true">
        <button class="act mark">${n.unread?'Mark as read':'Mark as unread'}</button>
        <button class="act danger del">Delete</button>
      </div>

      <span class="dot" aria-hidden="true"></span>
    </article>
  `).join('');

        // bind actions
        [...listEl.querySelectorAll('.item')].forEach(row=>{
            const id = +row.dataset.id;
            const obj = data.find(x=>x.id===id);

            row.querySelector('.mark').addEventListener('click',(e)=>{
                e.stopPropagation();
                obj.unread = !obj.unread;
                obj.time = obj.time; // keep
                applyFilter();
            });

            row.querySelector('.del').addEventListener('click',(e)=>{
                e.stopPropagation();
                const idx = data.findIndex(x=>x.id===id);
                if(idx>-1){ data.splice(idx,1); applyFilter(); }
            });

            row.addEventListener('click',()=>{
                if(obj.unread){ obj.unread=false; applyFilter(); }
                // TODO: navigate to related order/page if you want
            });
        });
    }

    function applyFilter(){
        const v = filterEl.value;
        const items = data.filter(n=> withinRange(n.ts, v));
        render(items);
    }

    // header actions
    document.getElementById('markAll').addEventListener('click',()=>{
        data.forEach(n=> n.unread=false);
        applyFilter();
    });
    document.getElementById('clearAll').addEventListener('click',()=>{
        if(confirm('Clear all notifications?')){
            data.length = 0;
            applyFilter();
        }
    });

    filterEl.addEventListener('change', applyFilter);

    // initial
    applyFilter();
</script>
</body>
</html>
