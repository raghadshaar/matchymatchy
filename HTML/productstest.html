<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Matchy Matchy — Admin • Products</title>

  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../styles/sidebar.css" />
  <link rel="stylesheet" href="../styles/products.css" />
  <link rel="stylesheet" href="../styles/topbarAdmin.css" />
  <script src="../js/includeadminBar.js"></script>

</head>
<body>

<div class="layout">
  <!-- Sidebar -->
  <div id="sidebar-container"></div>

  <!-- Main -->
  <main class="main">
    <!-- Topbar -->
    <div data-include="topBarAdmin.html"></div>

    <!-- Page header -->
    <section class="content"> </section>
    <div class="page-head">
      <div class="title-wrap">
        <h1>Products</h1>
        <p>Manage your Matchy Matchy catalog—kids & baby fashion, toys, essentials, and family matching sets. Prices shown in ILS (₪).</p>
      </div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <div class="field">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input id="searchInput" type="search" placeholder="Search products by name or SKU…">
      </div>
      <div class="field">
        <i class="fa-solid fa-layer-group"></i>
        <select id="collectionFilter" aria-label="Filter by collection">
          <option value="">All Collections</option>
        </select>
      </div>
      <div class="field">
        <i class="fa-solid fa-signal"></i>
        <select id="statusFilter" aria-label="Filter by status">
          <option value="">All Status</option>
          <option value="In Stock">In Stock</option>
          <option value="Low Stock">Low Stock</option>
          <option value="Out of Stock">Out of Stock</option>
          <option value="Draft">Draft</option>
          <option value="Archived">Archived</option>
        </select>
      </div>
      <button class="btn btn-ghost" id="clearFilters"><i class="fa-solid fa-rotate-left"></i> Clear</button>
      <div style="flex:1"></div>
      <button class="btn btn-teal" id="addProductBtn"><i class="fa-solid fa-plus"></i> Add Product</button>
    </div>

    <!-- Table -->
    <section class="card">
      <table>
        <thead>
        <tr>
          <th style="width:36px;"><input type="checkbox" id="checkAll"/></th>
          <th>Product</th>
          <th>Collection</th>
          <th>Price</th>
          <th>Stock</th>
          <th>Status</th>
          <th style="width:100px;">Actions</th>
        </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
      <div id="emptyState" class="empty" style="display:none">
        <div class="emoji">🧸</div>
        <h3 style="margin:0 0 6px;color:var(--umber)">No products yet</h3>
        <p style="margin:0 0 14px">Add your first Matchy Matchy item and start building your family-friendly catalog.</p>
        <button class="btn btn-teal" id="emptyAddBtn"><i class="fa-solid fa-plus"></i> Add Product</button>
      </div>

      <!-- Pagination -->
      <div class="pager">
        <div class="pager-info" id="pagerInfo"></div>
        <button class="page-btn" id="prevPage"><i class="fa-solid fa-chevron-left"></i></button>
        <div id="pageNums" style="display:flex;gap:6px"></div>
        <button class="page-btn" id="nextPage"><i class="fa-solid fa-chevron-right"></i></button>
      </div>
    </section>
  </main>
</div>

<!-- Drawer -->
<div class="drawer-backdrop" id="drawerBackdrop"></div>
<div class="drawer" id="drawer">
  <h3 id="drawerTitle">Add Product</h3>
  <div class="form-grid">
    <div class="form-item">
      <label for="pName">Name</label>
      <input class="input" id="pName" placeholder="e.g., Family Matching Pajama Set"/>
    </div>
    <div class="form-item">
      <label for="pSKU">SKU</label>
      <input class="input" id="pSKU" placeholder="e.g., PJ-FAM-001"/>
    </div>
    <div class="form-item">
      <label for="pPrice">Price (₪)</label>
      <input class="input" id="pPrice" type="number" step="0.01" min="0" placeholder="e.g., 149.90"/>
    </div>
    <div class="form-item">
      <label for="pStock">Stock</label>
      <input class="input" id="pStock" type="number" min="0" placeholder="e.g., 100"/>
    </div>
    <div class="form-item">
      <label for="pCollection">Collection</label>
      <select class="select" id="pCollection">
        <option>Baby</option>
        <option>Toddler</option>
        <option>Kids</option>
        <option>Family Matching</option>
        <option>Toys</option>
        <option>Essentials</option>
        <option>Accessories</option>
        <option>Brands</option>
        <option>Deals</option>
      </select>
    </div>
    <div class="form-item">
      <label for="pStatus">Status</label>
      <select class="select" id="pStatus">
        <option>Auto (by stock)</option>
        <option>In Stock</option>
        <option>Low Stock</option>
        <option>Out of Stock</option>
        <option>Draft</option>
        <option>Archived</option>
      </select>
    </div>
    <div class="form-item" style="grid-column:1/-1">
      <label for="pDesc">Description</label>
      <textarea class="textarea" id="pDesc" placeholder="Short description…"></textarea>
    </div>
    <div class="form-item">
      <label>Sizes</label>
      <div class="size-chips" id="sizeChips"></div>
      <input class="input" id="customSize" placeholder="Add custom size and press Enter" style="margin-top:8px"/>
    </div>
    <div class="form-item">
      <label for="pImage">Image URL</label>
      <input class="input" id="pImage" placeholder="https://…"/>
    </div>
  </div>
  <div class="drawer-actions">
    <button class="btn btn-ghost" id="cancelDrawer">Cancel</button>
    <button class="btn btn-teal" id="saveProduct">Save</button>
  </div>
</div>

<script>
  /* ===== Utilities ===== */
  const LS_KEY = 'mm_products_v1';
  const PAGE_SIZE = 8;

  const $ = (sel, ctx=document)=>ctx.querySelector(sel);
  const $$ = (sel, ctx=document)=>Array.from(ctx.querySelectorAll(sel));

  const currencyILS = (n)=>`₪${Number(n).toFixed(2)}`;

  /* ===== Sidebar loader ===== */
  document.addEventListener('DOMContentLoaded', () => {
    fetch('sidebar.html').then(r=>r.text()).then(html=>{
      const el = document.getElementById('sidebar-container');
      el.innerHTML = html;
      const current = 'Products';
      $$('a', el).forEach(a=>{
        if((a.textContent||'').trim().toLowerCase()===current.toLowerCase()){
          a.classList.add('active');
        }
      });
    }).catch(()=>{});
  });

  /* ===== Data store (localStorage demo) ===== */
  /* Matchy Matchy seed: fashion, toys, essentials, family matching */
  const seed = [
    {
      id: 1,
      name: 'Family Matching Set',
      sku: 'PJ-FAM-001',
      collection: 'Family Matching',
      price: 189.90,
      stock: 64,
      status: 'In Stock',
      image: '../images/matching.jpg',
      desc: 'Cozy matching sets for the whole family, featuring soft pastel colors and playful patterns.',
      sizes: ['Baby 0-3M','Baby 3-6M','Kid 2T','Kid 3T','Kid 4T','Kid 5-6Y','Mom S','Mom M','Dad M','Dad L']
    },
    {
      id: 2,
      name: 'Kids Sleeveless Summer Jumpsuit',
      sku: 'KJ-002',
      collection: 'Kids',
      price: 129.90,
      stock: 48,
      status: 'In Stock',
      image: '../images/kidsjumpsuit.jpg',
      desc: 'Lightweight sleeveless jumpsuit for kids in a relaxed fit, perfect for warm summer days.',
      sizes: ['2T','3T','4T','5-6Y']
    },
    {
      id: 3,
      name: 'Toddler Disney Pajama Set',
      sku: 'TD-DISNEY-003',
      collection: 'Toddler',
      price: 89.00,
      stock: 18,
      status: 'Low Stock',
      image: '../images/toddlerdineypjset.jpg',
      desc: 'Adorable Disney-themed pajamas for toddlers, featuring fun prints and soft fabric for bedtime comfort.',
      sizes: ['12-18M','18-24M','2T','3T']
    },
    {
      id: 4,
      name: 'Baby Boy Casual Outfit Set',
      sku: 'BB-SET-004',
      collection: 'Baby',
      price: 99.90,
      stock: 25,
      status: 'In Stock',
      image: '../images/babyboyclothes.jpg',
      desc: 'Stylish baby boy outfit with matching top and bottoms, made from breathable cotton fabric.',
      sizes: ['0-3M','3-6M','6-9M','9-12M']
    },
    {
      id: 5,
      name: 'Baby Girl Ruffle Dress',
      sku: 'BG-DRESS-005',
      collection: 'Baby',
      price: 79.90,
      stock: 145,
      status: 'In Stock',
      image: '../images/babygirldress.jpg',
      desc: 'Sweet ruffle-sleeve dress for baby girls in a soft, breathable fabric with a flared skirt.',
      sizes: ['0-3M','3-6M','6-9M','9-12M']
    },
    {
      id: 6,
      name: 'Classic Baby Girl Dress – White Lace',
      sku: 'BG-DRESS-006',
      collection: 'Baby',
      price: 84.90,
      stock: 58,
      status: 'In Stock',
      image: '../images/product1.jpg',
      desc: 'Elegant white lace dress for baby girls, perfect for birthdays and special occasions.',
      sizes: ['0-3M','3-6M','6-9M','9-12M']
    },
    {
      id: 7,
      name: 'Yellow Ruffle Party Dress',
      sku: 'YR-DRESS-007',
      collection: 'Kids',
      price: 89.90,
      stock: 92,
      status: 'In Stock',
      image: '../images/yellowdress.jpg',
      desc: 'Bright yellow ruffle party dress for girls, designed with layered details and a playful style.',
      sizes: ['2T','3T','4T','5-6Y','7-8Y']
    },
    {
      id: 8,
      name: 'Girls Summer Floral Dress',
      sku: 'SF-DRESS-008',
      collection: 'Kids',
      price: 99.00,
      stock: 31,
      status: 'In Stock',
      image: '../images/summerdess.jpg',
      desc: 'Lightweight summer dress with a colorful floral print, perfect for beach days and picnics.',
      sizes: ['2T','3T','4T','5-6Y','7-8Y']
    },
    {
      id: 9,
      name: 'Girls Party Dress – Pink Satin',
      sku: 'PD-SATIN-009',
      collection: 'Kids',
      price: 119.90,
      stock: 22,
      status: 'Low Stock',
      image: '../images/similar3.jpg',
      desc: 'Charming pink satin party dress with bow details, ideal for formal events and celebrations.',
      sizes: ['3T','4T','5-6Y','7-8Y']
    },
    {
      id: 10,
      name: 'Pastel Hair Bow Set (4 pcs)',
      sku: 'ACC-BOW-010',
      collection: 'Accessories',
      price: 34.90,
      stock: 12,
      status: 'Low Stock',
      image: '../images/similar4.jpg',
      desc: 'Set of 4 pastel-colored hair bows with gentle clips, ideal for everyday wear and photos.',
      sizes: ['One Size']
    }
  ];


  function loadProducts(){
    const raw = localStorage.getItem(LS_KEY);
    if(!raw){
      localStorage.setItem(LS_KEY, JSON.stringify(seed));
      return [...seed];
    }
    try { return JSON.parse(raw) || []; } catch { return []; }
  }
  function saveProducts(list){ localStorage.setItem(LS_KEY, JSON.stringify(list)); }

  let products = loadProducts();

  /* ===== Filters, search, pagination state ===== */
  let state = { q:'', collection:'', status:'', page:1 };

  const collectionSelect = $('#collectionFilter');
  function refreshCollections(){
    const cols = Array.from(new Set(products.map(p=>p.collection))).sort();
    collectionSelect.innerHTML = `<option value="">All Collections</option>` + cols.map(c=>`<option>${c}</option>`).join('');
  }
  refreshCollections();

  /* ===== Render table ===== */
  const tbody = $('#tbody');
  const emptyState = $('#emptyState');
  const pagerInfo = $('#pagerInfo');
  const pageNums = $('#pageNums');
  const prevPage = $('#prevPage');
  const nextPage = $('#nextPage');

  function statusChipClass(st) {
    if(st==='In Stock') return 'green';
    if(st==='Low Stock') return 'amber';
    if(st==='Out of Stock') return 'red';
    return 'amber';
  }
  function autoStatusByStock(stock){
    if(stock <= 0) return 'Out of Stock';
    if(stock < 20) return 'Low Stock';
    return 'In Stock';
  }
  function applyFilters(){
    let list = [...products];
    const q = state.q.trim().toLowerCase();
    if(q){
      list = list.filter(p =>
              p.name.toLowerCase().includes(q) ||
              (p.sku||'').toLowerCase().includes(q)
      );
    }
    if(state.collection) list = list.filter(p => p.collection === state.collection);
    if(state.status) list = list.filter(p => p.status === state.status);
    return list;
  }
  function paginate(list){
    const total = list.length;
    const pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
    if(state.page > pages) state.page = pages;
    const start = (state.page - 1) * PAGE_SIZE;
    const slice = list.slice(start, start + PAGE_SIZE);
    return {slice,total,pages};
  }
  function render(){
    const filtered = applyFilters();
    const {slice,total,pages} = paginate(filtered);

    tbody.innerHTML = slice.map(p=>`
    <tr>
      <td><input type="checkbox" data-id="${p.id}"></td>
      <td>
        <div class="prod">
          <img class="thumb" src="${p.image||''}" alt="">
          <div>
            <h4>${p.name}</h4>
            <div class="subtle">SKU: ${p.sku||'-'}</div>
          </div>
        </div>
      </td>
      <td>${p.collection||'-'}</td>
      <td class="price">${currencyILS(p.price||0)}</td>
      <td>${p.stock ?? 0}</td>
      <td><span class="chip ${statusChipClass(p.status)}">${p.status}</span></td>
      <td>
        <div class="row-actions">
          <button class="icon-link" title="Edit" data-edit="${p.id}"><i class="fa-regular fa-pen-to-square"></i></button>
          <button class="icon-link" title="Delete" data-del="${p.id}"><i class="fa-regular fa-trash-can"></i></button>
        </div>
      </td>
    </tr>
  `).join('');

    emptyState.style.display = filtered.length ? 'none' : 'block';

    pagerInfo.textContent = filtered.length
            ? `Showing ${Math.min((state.page-1)*PAGE_SIZE+1, total)}–${Math.min(state.page*PAGE_SIZE,total)} of ${total} products`
            : 'No results';

    pageNums.innerHTML = '';
    for(let i=1;i<=pages;i++){
      const b = document.createElement('button');
      b.className = 'page-btn' + (i===state.page?' active':'');
      b.textContent = i;
      b.addEventListener('click', ()=>{state.page=i; render();});
      pageNums.appendChild(b);
    }
    prevPage.disabled = state.page<=1;
    nextPage.disabled = state.page>=pages;

    $$('[data-edit]').forEach(btn=>btn.addEventListener('click',()=>openDrawerForEdit(+btn.dataset.edit)));
    $$('[data-del]').forEach(btn=>btn.addEventListener('click',()=>deleteProduct(+btn.dataset.del)));
  }
  render();

  /* ===== Search & filters ===== */
  $('#searchInput').addEventListener('input', e=>{state.q = e.target.value; state.page=1; render();});
  $('#globalSearch').addEventListener('input', e=>{state.q = e.target.value; state.page=1; render();});
  $('#collectionFilter').addEventListener('change', e=>{state.collection = e.target.value; state.page=1; render();});
  $('#statusFilter').addEventListener('change', e=>{state.status = e.target.value; state.page=1; render();});
  $('#clearFilters').addEventListener('click', ()=>{
    state.q=''; state.collection=''; state.status=''; state.page=1;
    $('#searchInput').value=''; $('#globalSearch').value=''; $('#collectionFilter').value=''; $('#statusFilter').value='';
    render();
  });

  prevPage.addEventListener('click', ()=>{ if(state.page>1){state.page--; render();} });
  nextPage.addEventListener('click', ()=>{ state.page++; render(); });

  /* ===== Drawer (Add/Edit) ===== */
  const drawer = $('#drawer');
  const backdrop = $('#drawerBackdrop');
  const openDrawer = ()=>{ drawer.classList.add('open'); backdrop.classList.add('show'); };
  const closeDrawer = ()=>{ drawer.classList.remove('open'); backdrop.classList.remove('show'); resetForm(); };
  backdrop.addEventListener('click', closeDrawer);
  $('#cancelDrawer').addEventListener('click', closeDrawer);

  const drawerTitle = $('#drawerTitle');
  /* Sizes tuned for baby/kids + family matching */
  const defaultSizes = [
    'NB','0-3M','3-6M','6-9M','9-12M','12-18M','18-24M','2T','3T','4T','5-6Y','7-8Y','9-10Y',
    'Mom XS','Mom S','Mom M','Mom L','Dad M','Dad L','Dad XL','One Size'
  ];
  const sizeChips = $('#sizeChips');
  let selectedSizes = new Set();

  function renderSizeChips(){
    sizeChips.innerHTML = '';
    defaultSizes.forEach(s=>{
      const b = document.createElement('button');
      b.type='button';
      b.className='chip-toggle' + (selectedSizes.has(s)?' active':'');
      b.textContent = s;
      b.addEventListener('click', ()=>{
        if(selectedSizes.has(s)) selectedSizes.delete(s); else selectedSizes.add(s);
        renderSizeChips();
      });
      sizeChips.appendChild(b);
    });
  }
  renderSizeChips();

  $('#customSize').addEventListener('keydown', e=>{
    if(e.key==='Enter' && e.target.value.trim()){
      selectedSizes.add(e.target.value.trim());
      e.target.value='';
      renderSizeChips();
    }
  });

  const formEls = {
    name: $('#pName'),
    sku: $('#pSKU'),
    price: $('#pPrice'),
    stock: $('#pStock'),
    collection: $('#pCollection'),
    status: $('#pStatus'),
    desc: $('#pDesc'),
    image: $('#pImage')
  };
  let editingId = null;

  function resetForm(){
    editingId = null;
    drawerTitle.textContent = 'Add Product';
    Object.values(formEls).forEach(el=>el.value='');
    selectedSizes = new Set(['One Size']);
    renderSizeChips();
    $('#pStatus').value='Auto (by stock)';
  }

  function openDrawerForAdd(){
    resetForm();
    openDrawer();
  }
  function openDrawerForEdit(id){
    const p = products.find(x=>x.id===id);
    if(!p) return;
    editingId = id;
    drawerTitle.textContent = 'Edit Product';
    formEls.name.value = p.name||'';
    formEls.sku.value = p.sku||'';
    formEls.price.value = p.price||0;
    formEls.stock.value = p.stock||0;
    formEls.collection.value = p.collection||'Accessories';
    formEls.status.value = (['In Stock','Low Stock','Out of Stock','Draft','Archived'].includes(p.status)?p.status:'Auto (by stock)');
    formEls.desc.value = p.desc||'';
    formEls.image.value = p.image||'';
    selectedSizes = new Set(p.sizes||[]);
    renderSizeChips();
    openDrawer();
  }

  function persistFromForm(){
    const name = formEls.name.value.trim();
    const sku = formEls.sku.value.trim();
    const price = Number(formEls.price.value||0);
    const stock = Math.max(0, Number(formEls.stock.value||0));
    const collection = formEls.collection.value;
    let status = formEls.status.value;
    const desc = formEls.desc.value.trim();
    const image = formEls.image.value.trim();
    const sizes = Array.from(selectedSizes);

    if(!name){ alert('Please enter a product name.'); return null; }
    if(!sku){ alert('Please enter a SKU.'); return null; }
    if(price<0){ alert('Price cannot be negative.'); return null; }

    if(status==='Auto (by stock)') status = autoStatusByStock(stock);
    return {name, sku, price, stock, collection, status, desc, image, sizes};
  }

  $('#saveProduct').addEventListener('click', ()=>{
    const payload = persistFromForm();
    if(!payload) return;

    if(editingId){
      products = products.map(p=> p.id===editingId ? {...p, ...payload} : p);
    }else{
      const nextId = (products.reduce((m,p)=>Math.max(m,p.id),0) || 0) + 1;
      products.push({id: nextId, ...payload});
    }
    saveProducts(products);
    refreshCollections();
    closeDrawer();
    render();
  });

  function deleteProduct(id){
    const p = products.find(x=>x.id===id);
    if(!p) return;
    if(confirm(`Delete "${p.name}"? This cannot be undone.`)){
      products = products.filter(x=>x.id!==id);
      saveProducts(products);
      refreshCollections();
      render();
    }
  }

  $('#addProductBtn').addEventListener('click', openDrawerForAdd);
  $('#emptyAddBtn').addEventListener('click', openDrawerForAdd);

  /* Check-all (demo) */
  $('#checkAll').addEventListener('change', e=>{
    const checked = e.target.checked;
    $$('tbody input[type="checkbox"]').forEach(cb=>cb.checked=checked);
  });
</script>
<script src="../js/adminbar.js" defer></script>
<script src="../js/includeadminBar.js" defer></script>


</body>
</html>
