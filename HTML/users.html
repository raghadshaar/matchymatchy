<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Matchy Matchy — Admin • Users</title>

    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <!-- Shared styles -->
    <link rel="stylesheet" href="../styles/sidebar.css"/>
    <link rel="stylesheet" href="../styles/products.css"/>
    <link rel="stylesheet" href="../styles/topbarAdmin.css"/>

    <style>
        :root{
            --row-h: 52px;
            --cell-py: 8px;
            --chip-h: 26px;
            --chip-fw: .78rem;
            --grid-gap: 12px;
        }

        .toolbar{ gap:8px }
        .toolbar .field{ min-width:220px }
        .toolbar .view-toggle{ display:flex; gap:8px }
        .toolbar .view-toggle .btn{ display:flex; align-items:center; gap:8px }

        .table thead th, thead th{ padding:var(--cell-py) 10px !important }
        tbody td{ padding:var(--cell-py) 10px !important }
        tbody tr{ height:var(--row-h) }

        .avatar{
            width:32px;height:32px;border-radius:50%;
            object-fit:cover;border:1px solid var(--border);
        }
        /* Gmail-like fallback avatar (letter in a colored circle) */
        .avatar-fallback{
            width:32px; height:32px; border-radius:50%;
            display:grid; place-items:center;
            font-weight:700; font-size:.9rem;
            color:#fff; user-select:none;
            border:1px solid var(--border);
        }

        .user-cell{ display:flex; align-items:center; gap:10px }
        .user-meta{ display:flex; flex-direction:column }
        .user-meta small{ color:var(--muted); font-size:.82rem }

        .badge{
            display:inline-flex; align-items:center; justify-content:center;
            min-width:88px; height:var(--chip-h);
            padding:0 10px; border-radius:999px; border:1px solid transparent;
            font-weight:600; font-size:var(--chip-fw); line-height:1;
        }
        .badge.st-active{ background:#e9f8f1; border-color:#cfeadf; color:#1b8e57 }
        .badge.st-pending{ background:#fff6e6; border-color:#ffe1ad; color:#ad8100 }
        .badge.st-suspended{ background:#ffecec; border-color:#ffc9c9; color:#b23535 }

        .badge.role-admin{ background:var(--teal); border-color:var(--teal); color:#fff }
        .badge.role-customer{ background:#fdeedb; border-color:#ffd8a8; color:#8a6400 }

        table th:nth-child(2){ width:22% }  /* User */
        table th:nth-child(3){ width:12% }  /* Username */
        table th:nth-child(4){ width:20% }  /* Email */
        table th:nth-child(5){ width:10% }  /* Role */
        table th:nth-child(6){ width:10% }  /* Status */
        table th:nth-child(7){ width:12% }  /* Date */
        table th:nth-child(8){ width:14% }  /* Actions */
        table thead th.actions, table th:nth-child(8){ width:170px; }

        td.actions, table td:nth-child(8){
            display:flex; justify-content:flex-end; align-items:center;
            gap:10px; white-space:nowrap; padding-right:16px;
        }

        .action-btn{
            width:42px; height:42px; display:grid; place-items:center;
            border:1px solid var(--border); border-radius:12px;
            background:#fff; box-shadow:var(--shadow); cursor:pointer; transition:.15s ease;
        }
        .action-btn i{ font-size:16px; }
        .action-btn:hover{ border-color:var(--teal); color:var(--teal); box-shadow:0 4px 12px rgba(0,0,0,.06); }

        @media (max-width:1100px){
            table thead th.actions, table th:nth-child(8){ width:140px; }
            .action-btn{ width:36px; height:36px; }
        }

        /* Cards view */
        .grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:var(--grid-gap); }
        @media (max-width:1200px){ .grid{ grid-template-columns:repeat(3,1fr) } }
        @media (max-width:900px){  .grid{ grid-template-columns:repeat(2,1fr) } }
        @media (max-width:600px){  .grid{ grid-template-columns:1fr } }

        .user-card{
            background:#fff;border:1px solid var(--border);
            border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;
            display:flex;flex-direction:column;min-height:240px;
        }
        .user-card .top{ display:flex; gap:12px; padding:12px }
        .user-card .top strong{ font-size:1rem }
        .user-card .body{ padding:0 12px 10px; flex:1 }
        .user-card .foot{ display:flex; gap:8px; border-top:1px solid var(--border); padding:8px 10px; justify-content:flex-end }
        .user-card .icon-link{ width:32px; height:32px; border-radius:10px }

        .user-card .meta{ display:flex; flex-direction:column; gap:8px }
        .user-card .meta div{ display:flex; flex-direction:column }
        .user-card .meta .role-row{ display:inline-flex; align-items:center; gap:8px; width:auto; }
        .user-card .meta .badge{ min-width:auto; width:fit-content; height:24px; padding:0 10px; font-size:.78rem; line-height:1; align-self:flex-start; }
    </style>
</head>
<body>
<div class="layout">
    <!-- Sidebar -->
    <div id="sidebar-container"></div>

    <!-- Main -->
    <main class="main">
        <!-- Topbar -->
        <div data-include="topBarAdmin.html"></div>

        <!-- Header -->
        <div class="page-head">
            <div class="title-wrap">
                <h1>Users</h1>
                <p class="muted">Manage customer accounts, view details, and take actions.</p>
            </div>
        </div>

        <!-- Toolbar -->
        <div class="toolbar">
            <div class="field" style="flex:1">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input id="searchInput" type="search" placeholder="Search by Name, Username, or Email…">
            </div>
            <div class="field">
                <i class="fa-solid fa-user-shield"></i>
                <select id="roleFilter">
                    <option value="">All Roles</option>
                    <option>Administrator</option>
                    <option>Customer</option>
                </select>
            </div>
            <div class="field">
                <i class="fa-solid fa-signal"></i>
                <select id="statusFilter">
                    <option value="">All Status</option>
                    <option>Active</option>
                    <option>Pending</option>
                    <option>Suspended</option>
                </select>
            </div>
            <div class="view-toggle">
                <button class="btn btn-ghost" id="btnTable"><i class="fa-solid fa-table"></i> Table</button>
                <button class="btn btn-ghost" id="btnCards"><i class="fa-solid fa-table-cells-large"></i> Cards</button>
            </div>
            <button class="btn btn-ghost" id="clearFilters"><i class="fa-solid fa-rotate-left"></i> Clear</button>
            <div style="flex:1"></div>
            <button class="btn btn-teal" id="addUser"><i class="fa-solid fa-user-plus"></i> Add User</button>
        </div>

        <!-- Table view -->
        <section class="card" id="tableWrap">
            <table>
                <thead>
                <tr>
                    <th style="width:40px;"><input type="checkbox" id="checkAll"/></th>
                    <th>User</th>
                    <th>Username</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Status</th>
                    <th>Date Joined</th>
                    <th class="actions">Actions</th>
                </tr>
                </thead>
                <tbody id="tbody"></tbody>
            </table>

            <div id="emptyState" class="empty" style="display:none">
                <div class="emoji">👤</div>
                <h3 style="margin:0 0 6px;color:var(--umber)">No users found</h3>
                <p class="muted" style="margin:0 0 14px">Invite or add your first user to get started.</p>
                <button class="btn btn-teal" id="emptyAddBtn"><i class="fa-solid fa-user-plus"></i> Add User</button>
            </div>

            <div class="pager">
                <div class="pager-info" id="pagerInfo"></div>
                <button class="page-btn" id="prevPage"><i class="fa-solid fa-chevron-left"></i></button>
                <div id="pageNums" style="display:flex;gap:6px"></div>
                <button class="page-btn" id="nextPage"><i class="fa-solid fa-chevron-right"></i></button>
            </div>
        </section>

        <!-- Card view -->
        <section class="card" id="cardsWrap" style="display:none">
            <div class="grid" id="cardsGrid"></div>
            <div class="pager">
                <div class="pager-info" id="pagerInfoC"></div>
                <button class="page-btn" id="prevPageC"><i class="fa-solid fa-chevron-left"></i></button>
                <div id="pageNumsC" style="display:flex;gap:6px"></div>
                <button class="page-btn" id="nextPageC"><i class="fa-solid fa-chevron-right"></i></button>
            </div>
        </section>
    </main>
</div>

<!-- Drawer -->
<div class="drawer-backdrop" id="drawerBackdrop"></div>
<div class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" tabindex="-1">
    <h3 id="drawerTitle">User Details</h3>
    <div class="form-grid">
        <div class="form-item">
            <label for="uName">Name</label>
            <input class="input" id="uName" type="text"/>
        </div>
        <div class="form-item">
            <label for="uHandle">Username</label>
            <input class="input" id="uHandle" placeholder="@username" type="text"/>
        </div>
        <div class="form-item">
            <label for="uEmail">Email</label>
            <input class="input" id="uEmail" type="email"/>
        </div>
        <div class="form-item">
            <label for="uPhone">Phone</label>
            <input class="input" id="uPhone" type="tel" inputmode="tel"/>
        </div>
        <div class="form-item">
            <label for="uRole">Role</label>
            <select class="select" id="uRole">
                <option>Administrator</option>
                <option>Customer</option>
            </select>
        </div>
        <div class="form-item">
            <label for="uStatus">Status</label>
            <select class="select" id="uStatus">
                <option>Active</option>
                <option>Pending</option>
                <option>Suspended</option>
            </select>
        </div>

        <!-- New: Password + Confirm (required on Add, optional on Edit) -->
        <div class="form-item">
            <label for="uPass">Password</label>
            <input class="input" id="uPass" type="password" autocomplete="new-password" minlength="8" placeholder="At least 8 characters">
        </div>
        <div class="form-item">
            <label for="uPass2">Confirm Password</label>
            <input class="input" id="uPass2" type="password" autocomplete="new-password" minlength="8" placeholder="Repeat password">
        </div>

        <div class="form-item" style="grid-column:1/-1">
            <label for="uNotes">Notes</label>
            <textarea class="textarea" id="uNotes" placeholder="Internal notes…"></textarea>
        </div>
    </div>
    <div class="drawer-actions">
        <button class="btn btn-ghost" id="cancelDrawer">Cancel</button>
        <button class="btn btn-teal" id="saveUser">Save</button>
    </div>
</div>

<script>
    /* ========= CONFIG ========= */
    const API_BASE = '/matchymatchy/api/admin/users.php';
    const PAGE_SIZE = 8;

    /* ========= Helpers ========= */
    let view = 'table';
    let users = [];
    let meta  = { total:0, pages:1 };
    let state = { q:'', role:'', status:'', page:1 };

    const $  = (s,c=document)=>c.querySelector(s);
    const $$ = (s,c=document)=>Array.from(c.querySelectorAll(s));

    const esc = s => String(s)
        .replaceAll('&','&amp;').replaceAll('<','&lt;')
        .replaceAll('>','&gt;').replaceAll('"','&quot;')
        .replaceAll("'", '&#39;');

    const fmtDate = d => {
        if(!d) return '';
        const iso = String(d).includes('T') ? d : String(d).replace(' ', 'T');
        const dt = new Date(iso);
        if (isNaN(dt.getTime())) return esc(d);
        return dt.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
    };

    /* ===== Gmail-like avatar helpers ===== */
    function initialLetter(u){
        const name = (u.name || '').trim();
        if (name) return name[0].toUpperCase();
        const email = (u.email || '').trim();
        if (email) return email[0].toUpperCase();
        const handle = (u.handle || '').replace(/^@/,'').trim();
        if (handle) return handle[0].toUpperCase();
        return '?';
    }
    function hueFromString(s){
        let h = 0;
        for (let i=0;i<s.length;i++) h = (h * 31 + s.charCodeAt(i)) % 360;
        return h;
    }
    function avatarHTML(u){
        const src = (u.avatar || '').trim();
        if (src) {
            const alt = (u.name || u.email || 'User');
            return `<img class="avatar" src="${esc(src)}" alt="${esc(alt)}">`;
        }
        const seed   = (u.name || u.email || String(u.id) || 'U');
        const hue    = hueFromString(seed);
        const bg     = `hsl(${hue}, 70%, 55%)`;
        const letter = initialLetter(u);
        return `<div class="avatar-fallback" style="background:${bg}" aria-hidden="true">${esc(letter)}</div>`;
    }

    function roleClass(r){ return r==='Administrator' ? 'role-admin' : 'role-customer'; }
    function statusClass(s){ return s==='Active' ? 'st-active' : (s==='Suspended' ? 'st-suspended' : 'st-pending'); }

    /* ========= Sidebar include & active link ========= */
    document.addEventListener('DOMContentLoaded', async () => {
        try {
            const html = await fetch('sidebar.html').then(r=>r.text());
            $('#sidebar-container').innerHTML = html;
            $$('a', $('#sidebar-container')).forEach(a=>{
                if((a.textContent||'').trim().toLowerCase()==='users') a.classList.add('active');
            });
        } catch {}
    });

    /* ========= API wrappers ========= */
    async function apiList(){
        const qs = new URLSearchParams({
            action: 'list',
            q: state.q || '',
            role: state.role || '',
            status: state.status || '',
            page: String(state.page),
            page_size: String(PAGE_SIZE)
        });
        const r = await fetch(`${API_BASE}?${qs.toString()}`, {credentials:'same-origin'});
        const j = await r.json();
        if (!r.ok) throw new Error(j.error || 'Failed to load');
        users = Array.isArray(j.data) ? j.data : [];
        meta.total = (j.meta && j.meta.total) || users.length || 0;
        meta.pages = (j.meta && j.meta.pages) || 1;
    }

    async function apiCreate(payload){
        const r = await fetch(`${API_BASE}?action=create`, {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            credentials:'same-origin',
            body: JSON.stringify(payload)
        });
        const j = await r.json();
        if (!r.ok) throw new Error(j.error || 'Create failed');
        return j.data;
    }

    async function apiUpdate(payload){
        const r = await fetch(`${API_BASE}?action=update`, {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            credentials:'same-origin',
            body: JSON.stringify(payload)
        });
        const j = await r.json();
        if (!r.ok) throw new Error(j.error || 'Update failed');
        return j.data;
    }

    async function apiDelete(id){
        const r = await fetch(`${API_BASE}?action=delete`, {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            credentials:'same-origin',
            body: JSON.stringify({id})
        });
        const j = await r.json();
        if (!r.ok) throw new Error(j.error || 'Delete failed');
        return j.deleted;
    }

    /* ========= Rendering ========= */
    function renderTable(){
        $('#tbody').innerHTML = users.map(u=>`
      <tr>
        <td><input type="checkbox" data-id="${u.id}"></td>
        <td>
          <div class="user-cell">
            ${avatarHTML(u)}
            <div class="user-meta">
              <strong>${esc(u.name||'')}</strong>
              <small>${esc(u.email||'')}</small>
            </div>
          </div>
        </td>
        <td>${esc(u.handle||'')}</td>
        <td>${esc(u.email||'')}</td>
        <td><span class="badge ${roleClass(u.role)}">${esc(u.role||'')}</span></td>
        <td><span class="badge ${statusClass(u.status)}">${esc(u.status||'')}</span></td>
        <td>${fmtDate(u.joined)}</td>
        <td class="actions">
          <button class="icon-link" aria-label="View user" data-view="${u.id}"><i class="fa-regular fa-eye"></i></button>
          <button class="icon-link" aria-label="Edit user" data-edit="${u.id}"><i class="fa-regular fa-pen-to-square"></i></button>
          <button class="icon-link" aria-label="Delete user" data-del="${u.id}"><i class="fa-regular fa-trash-can"></i></button>
        </td>
      </tr>
    `).join('');

        const total = meta.total, pages = meta.pages;
        $('#emptyState').style.display = total ? 'none' : 'block';
        $('#pagerInfo').textContent = total ? `Showing ${Math.min((state.page-1)*PAGE_SIZE+1,total)}–${Math.min(state.page*PAGE_SIZE,total)} of ${total} users` : 'No results';

        const pageNums = $('#pageNums'); pageNums.innerHTML='';
        for(let i=1;i<=pages;i++){
            const b=document.createElement('button');
            b.className='page-btn'+(i===state.page?' active':'');
            b.textContent=i; b.onclick=()=>{state.page=i; render();};
            pageNums.appendChild(b);
        }
        $('#prevPage').disabled = state.page<=1;
        $('#nextPage').disabled = state.page>=pages;

        $$('[data-view]').forEach(b=>b.onclick=()=>openDrawer(+b.dataset.view,false));
        $$('[data-edit]').forEach(b=>b.onclick=()=>openDrawer(+b.dataset.edit,true));
        $$('[data-del]').forEach(b=>b.onclick=()=>removeUser(+b.dataset.del));
    }

    function renderCards(){
        $('#cardsGrid').innerHTML = users.map(u=>`
      <div class="user-card">
        <div class="top">
          ${avatarHTML(u)}
          <div style="flex:1">
            <div style="display:flex;align-items:center;justify-content:space-between">
              <strong>${esc(u.name||'')}</strong>
              <span class="badge ${statusClass(u.status)}">${esc(u.status||'')}</span>
            </div>
            <div class="muted" style="font-size:.9rem">${esc(u.handle||'')} • ${fmtDate(u.joined)}</div>
          </div>
        </div>
        <div class="body">
          <div class="meta">
            <div><small class="muted">Email</small><div>${esc(u.email||'')}</div></div>
            <div><small class="muted">Role</small><div><span class="badge ${roleClass(u.role)}">${esc(u.role||'')}</span></div></div>
          </div>
        </div>
        <div class="foot">
          <button class="icon-link" aria-label="View user" data-view="${u.id}"><i class="fa-regular fa-eye"></i></button>
          <button class="icon-link" aria-label="Edit user" data-edit="${u.id}"><i class="fa-regular fa-pen-to-square"></i></button>
          <button class="icon-link" aria-label="Delete user" data-del="${u.id}"><i class="fa-regular fa-trash-can"></i></button>
        </div>
      </div>
    `).join('');

        const total = meta.total, pages = meta.pages;
        $('#pagerInfoC').textContent = total ? `Showing page ${state.page} of ${pages} • ${total} users` : 'No results';

        const pageNums = $('#pageNumsC'); pageNums.innerHTML='';
        for(let i=1;i<=pages;i++){
            const b=document.createElement('button');
            b.className='page-btn'+(i===state.page?' active':'');
            b.textContent=i; b.onclick=()=>{state.page=i; render();};
            pageNums.appendChild(b);
        }
        $('#prevPageC').disabled = state.page<=1;
        $('#nextPageC').disabled = state.page>=pages;

        $$('[data-view]').forEach(b=>b.onclick=()=>openDrawer(+b.dataset.view,false));
        $$('[data-edit]').forEach(b=>b.onclick=()=>openDrawer(+b.dataset.edit,true));
        $$('[data-del]').forEach(b=>b.onclick=()=>removeUser(+b.dataset.del));
    }

    async function render(){
        await apiList().catch(err=>{ console.error(err); users=[]; meta={total:0,pages:1}; });
        if(view==='table'){ $('#tableWrap').style.display='block'; $('#cardsWrap').style.display='none'; renderTable(); }
        else { $('#tableWrap').style.display='none'; $('#cardsWrap').style.display='block'; renderCards(); }
    }

    /* ========= Filters / paging / view ========= */
    $('#searchInput').oninput   = e=>{ state.q = e.target.value; state.page=1; render(); };
    $('#roleFilter').onchange   = e=>{ state.role = e.target.value; state.page=1; render(); };
    $('#statusFilter').onchange = e=>{ state.status = e.target.value; state.page=1; render(); };
    $('#clearFilters').onclick  = ()=>{ state={q:'',role:'',status:'',page:1};
        $('#searchInput').value=''; $('#roleFilter').value=''; $('#statusFilter').value=''; render(); };

    $('#prevPage').onclick = ()=>{ if(state.page>1){ state.page--; render(); } };
    $('#nextPage').onclick = ()=>{ state.page++; render(); };
    $('#prevPageC').onclick= ()=>{ if(state.page>1){ state.page--; render(); } };
    $('#nextPageC').onclick= ()=>{ state.page++; render(); };

    $('#btnTable').onclick=()=>{ view='table'; render(); };
    $('#btnCards').onclick=()=>{ view='cards'; render(); };

    /* ========= Drawer (view/add/edit) ========= */
    const drawer=$('#drawer'), backdrop=$('#drawerBackdrop');
    const els={
        name:$('#uName'), handle:$('#uHandle'), email:$('#uEmail'),
        phone:$('#uPhone'), role:$('#uRole'), status:$('#uStatus'),
        notes:$('#uNotes'), pass:$('#uPass'), pass2:$('#uPass2')
    };
    let currentId=null, editMode=false;

    function splitName(full=''){
        const t = (full||'').trim();
        if (!t) return {first:'', last:''};
        const parts = t.split(/\s+/);
        const first = parts.shift() || '';
        const last  = parts.join(' ');
        return {first,last};
    }
    function previewHandle(){
        if (currentId) return; // only for Add
        const {first,last} = splitName(els.name.value);
        const fn = first.replace(/[^a-z0-9]/gi,'').toLowerCase();
        const ln = (last||'').replace(/[^a-z0-9]/gi,'');
        els.handle.value = fn ? '@'+fn+(ln ? ln[0].toUpperCase()+ln.slice(1).toLowerCase() : '') : '';
    }
    els.name.addEventListener('input', previewHandle);

    function openDrawer(id, editable){
        const u=users.find(x=>x.id===id); if(!u) return;
        currentId=id; editMode=editable;
        $('#drawerTitle').textContent = editable ? 'Edit User' : 'User Details';

        els.name.value   = u.name || '';
        els.handle.value = u.handle || '';
        els.email.value  = u.email || '';
        els.phone.value  = u.phone || '';
        els.role.value   = u.role  || 'Customer';
        els.status.value = u.status|| 'Pending';
        els.notes.value  = u.notes || '';

        els.pass.value = ''; els.pass2.value = '';
        els.pass.required = false; els.pass2.required = false;

        [els.name,els.handle,els.email,els.phone,els.role,els.status,els.notes,els.pass,els.pass2]
            .forEach(el=> el.disabled = !editable);

        $('#saveUser').style.display = editable ? '' : 'none';
        drawer.classList.add('open'); backdrop.classList.add('show');
        setTimeout(()=> $('#uName').focus(), 0);
    }
    function openAddDrawer(){
        currentId=null; editMode=true;
        $('#drawerTitle').textContent = 'Add User';
        els.name.value=''; els.handle.value=''; els.email.value='';
        els.phone.value=''; els.role.value='Customer'; els.status.value='Pending'; els.notes.value='';
        els.pass.value=''; els.pass2.value='';
        els.pass.required = true; els.pass2.required = true;

        [els.name,els.handle,els.email,els.phone,els.role,els.status,els.notes,els.pass,els.pass2]
            .forEach(el=> el.disabled=false);

        $('#saveUser').style.display='';
        drawer.classList.add('open'); backdrop.classList.add('show');
        setTimeout(()=> $('#uName').focus(), 0);
        previewHandle();
    }
    function closeDrawer(){ drawer.classList.remove('open'); backdrop.classList.remove('show'); currentId=null; editMode=false; }
    backdrop.onclick=closeDrawer; $('#cancelDrawer').onclick=closeDrawer;
    $('#addUser').onclick=openAddDrawer; $('#emptyAddBtn').onclick=openAddDrawer;

    /* ========= Create / Update / Delete ========= */
    function setBtnLoading(btn, on, label='Saving...'){
        if(!btn) return;
        if(on){
            btn.dataset.prev = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin" style="margin-right:6px"></i>${label}`;
        }else{
            btn.disabled = false;
            btn.innerHTML = btn.dataset.prev || 'Save';
        }
    }

    $('#saveUser').onclick = async ()=>{
        const btn = $('#saveUser'); setBtnLoading(btn, true);

        const {first,last} = splitName(els.name.value);
        const payload = {
            first_name:first, last_name:last,
            email:(els.email.value||'').trim(),
            username:(els.handle.value||'').trim(),   // backend normalizes to a single leading @
            phone:(els.phone.value||'').trim(),
            role:els.role.value, status:els.status.value,
            notes:(els.notes.value||'').trim()
        };
        try{
            if(!currentId){
                // Require password on Add
                const pw  = (els.pass.value||'');
                const pw2 = (els.pass2.value||'');
                if (pw.length < 8) throw new Error('Password must be at least 8 characters.');
                if (pw !== pw2)    throw new Error('Passwords do not match.');
                payload.password = pw;

                await apiCreate(payload);
            }else{
                // Optional password on Edit – only send if both fields filled & match
                if ((els.pass.value||'') !== '' || (els.pass2.value||'') !== ''){
                    const pw  = (els.pass.value||'');
                    const pw2 = (els.pass2.value||'');
                    if (pw.length < 8) throw new Error('Password must be at least 8 characters.');
                    if (pw !== pw2)    throw new Error('Passwords do not match.');
                    payload.password = pw;
                }
                await apiUpdate({ id: currentId, ...payload });
            }
            closeDrawer();
            await render();
        }catch(err){
            alert(err.message || 'Failed to save user.');
        }finally{
            setBtnLoading(btn, false);
        }
    };

    async function removeUser(id){
        if(!confirm('Delete this user?')) return;
        try{
            await apiDelete(id);
            await render();
        }catch(err){
            alert(err.message || 'Delete failed.');
        }
    }

    /* ========= Misc ========= */
    $('#checkAll').onchange = e => $$('tbody input[type="checkbox"]').forEach(cb=>cb.checked=e.target.checked);

    /* ========= Init ========= */
    document.addEventListener('DOMContentLoaded', render);
</script>

<script src="../js/adminbar.js" defer></script>
<script src="../js/includeadminBar.js" defer></script>
</body>
