<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>User Settings • Matchy Matchy</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --baby: #F9F8F3;
            --teal: #008080;
            --pink: #FADADD;
            --jet: #383838;
            --white: #ffffff;
            --umber: #6B5B51;
        }

        body {
            background-color: var(--baby);
            font-family: 'Poppins', sans-serif;
        }

        .btn {
            background-color: var(--teal);
            color: white;
            padding: 10px 16px;
            font-weight: 600;
            border-radius: 10px;
            transition: opacity 0.2s;
            cursor: pointer;
            border: none;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .card {
            background-color: var(--white);
            border-radius: 18px;
            padding: 24px;
            box-shadow: 0 16px 40px rgba(0,0,0,.08);
        }

        .section-title {
            font-weight: 600;
            font-size: 1.25rem;
            margin-bottom: 1rem;
            color: var(--jet);
        }

        .order-details {
            transition: all 0.3s ease;
        }

        .toggle-icon {
            transition: transform 0.3s ease;
        }

        .toggle-icon.rotate {
            transform: rotate(180deg);
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--jet);
        }

        .input {
            border: 1px solid #d1d5db;
            border-radius: 0.375rem;
            padding: 0.5rem;
            width: 100%;
        }

        .input:focus {
            outline: none;
            ring: 2px solid var(--teal);
            border-color: var(--teal);
        }
    </style>
</head>
<body class="min-h-screen py-8">

<div class="max-w-4xl mx-auto px-4">
    <!-- Header -->
    <div class="flex justify-between items-center mb-6">
        <div style="font-family:'Pacifico',cursive; font-size:30px; color:var(--teal);">Matchy Matchy</div>
        <button onclick="logout()" class="btn bg-[var(--umber)]">Logout</button>
    </div>

    <!-- Avatar -->
    <div class="text-center mb-8">
        <div class="relative inline-block">
            <img id="avatar" src="" class="w-28 h-28 rounded-full object-cover border shadow" alt="Avatar">            <label for="avatar_file" class="absolute bottom-1 right-1 bg-white rounded-full p-1 cursor-pointer border border-gray-300">
                <i class="ri-camera-line text-lg text-gray-600"></i>
            </label>
            <input type="file" id="avatar_file" accept="image/*" class="hidden">
        </div>
        <p class="mt-2 text-sm text-gray-600">Change Image</p>
    </div>

    <!-- Settings Form -->
    <div class="card mb-8">
        <div class="section-title">Account Settings</div>
        <form id="settings-form" class="grid grid-cols-1 sm:grid-cols-2 gap-4" enctype="multipart/form-data">
            <input type="hidden" name="id" id="id" value="6" />

            <div>
                <label>First Name</label>
                <input class="input border p-2 w-full rounded-md" id="first_name" name="first_name" required>
            </div>
            <div>
                <label>Last Name</label>
                <input class="input border p-2 w-full rounded-md" id="last_name" name="last_name" required>
            </div>
            <div class="sm:col-span-2">
                <label>Email Address</label>
                <input id="email" name="email" class="border p-2 w-full rounded-md bg-gray-100" readonly>
            </div>
            <div class="sm:col-span-2">
                <label>Avatar URL</label>
                <input id="avatar_url" name="avatar" class="border p-2 w-full rounded-md">
            </div>
            <div class="sm:col-span-2">
                <label>New Password (Optional)</label>
                <input type="password" id="password" name="password" class="border p-2 w-full rounded-md">
            </div>
            <div class="sm:col-span-2 mt-2">
                <button type="submit" class="btn w-full">Save Changes</button>
                <p id="response" class="text-center text-sm mt-2"></p>
            </div>
        </form>
    </div>

    <!-- Orders Section -->
    <div class="card">
        <div class="section-title">Previous Orders</div>
        <div id="orders-list"></div>
    </div>
</div>

<script>
    const uid = document.getElementById('id').value;

    async function loadUserData() {
        try {
            const res = await fetch(`../backend/settings.php?user_id=${uid}`);
            if (!res.ok) throw new Error('Failed to fetch user data');

            const u = await res.json();

            if (u.error) {
                document.getElementById('response').textContent = u.error;
                return;
            }
            document.getElementById('avatar').src = u.avatar ? `../backend/${u.avatar}` : 'https://via.placeholder.com/150';
            document.getElementById('first_name').value = u.first_name || '';
            document.getElementById('last_name').value  = u.last_name  || '';
            document.getElementById('email').value      = u.email      || '';
            document.getElementById('avatar_url').value = u.avatar     || '';
        } catch (error) {
            console.error('Error loading user data:', error);
            document.getElementById('response').textContent = 'Error loading user data';
        }
    }

    loadUserData();

    document.getElementById('avatar_file').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            // تحقق من نوع الملف
            const allowedTypes = ['image/jpeg', 'image/png', 'image/webp'];
            if (!allowedTypes.includes(file.type)) {
                document.getElementById('response').textContent = 'Only JPG, PNG, and WebP images are allowed';
                e.target.value = '';
                return;
            }

            // تحقق من حجم الملف (2MB كحد أقصى)
            if (file.size > 2 * 1024 * 1024) {
                document.getElementById('response').textContent = 'Image must be less than 2MB';
                e.target.value = '';
                return;
            }

            const url = URL.createObjectURL(file);
            document.getElementById('avatar').src = url;
            document.getElementById('response').textContent = '';
        }
    });

    document.getElementById('settings-form').addEventListener('submit', async (e) => {
        e.preventDefault();

        const formData = new FormData(e.target);
        const avatarFile = document.getElementById('avatar_file').files[0];

        if (avatarFile) {
            formData.append('avatar_file', avatarFile);
        }

        try {
            const res = await fetch('../backend/settings.php', {
                method: 'POST',
                body: formData
            });

            const j = await res.json();
            document.getElementById('response').textContent = j.message || (j.error || 'Unknown error');

            if (j.avatar) {
                document.getElementById('avatar').src = j.avatar ? `../backend/${j.avatar}` : 'https://via.placeholder.com/150';
            }

        } catch (error) {
            console.error('Error saving settings:', error);
            document.getElementById('response').textContent = 'Error saving settings';
        }
    });

    function logout() {
        window.location.href = '../sign-in.php';
    }

    // Load Orders
    async function loadOrders() {
        try {
            const res = await fetch(`../backend/get_user_orders.php?user_id=${uid}`);
            const j = await res.json();
            const orders = j.orders || [];
            const list = document.getElementById('orders-list');

            if (orders.length === 0) {
                list.innerHTML = '<p class="text-gray-500 text-center py-4">No orders found</p>';
                return;
            }

            list.innerHTML = orders.map(order => `
                <div class="border rounded-lg p-4 mb-3 bg-gray-50">
                    <div class="flex justify-between items-center">
                        <div>
                            <div class="font-medium">Order #${order.order_number}</div>
                            <div class="text-sm text-gray-500">${order.date}</div>
                        </div>
                        <div class="text-right">
                            <div class="font-semibold">${order.total}$</div>
                            <button onclick="toggleDetails(this)" class="text-sm text-teal-700 mt-1 flex items-center gap-1">
                                Show Details <i class="ri-arrow-down-s-line toggle-icon"></i>
                            </button>
                        </div>
                    </div>
                    <div class="order-details hidden mt-3 pl-4 text-sm text-gray-700">
                        <ul>
                            ${order.items.map(i => `<li>• ${i.name} — ₪${i.price} × ${i.quantity}</li>`).join('')}
                        </ul>
                    </div>
                </div>
            `).join('');
        } catch (error) {
            console.error('Error loading orders:', error);
            document.getElementById('orders-list').innerHTML = '<p class="text-red-500 text-center py-4">Error loading orders</p>';
        }
    }

    function toggleDetails(btn) {
        const details = btn.closest('div').parentElement.querySelector('.order-details');
        const icon = btn.querySelector('.toggle-icon');
        details.classList.toggle('hidden');
        icon.classList.toggle('rotate');
    }

    loadOrders();
</script>
</body>
</html>
