<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>User Settings • Matchy Matchy</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --baby: #F9F8F3;
            --teal: #008080;
            --pink: #FADADD;
            --jet: #383838;
            --white: #ffffff;
            --umber: #6B5B51;
        }
        .btn { background-color: var(--teal); color:#fff; padding:10px 16px; font-weight:600; border-radius:10px; border:none; cursor:pointer; transition:opacity .2s; }
        .btn:hover{ opacity:.9; }
        .card { background-color: var(--white); border-radius:18px; padding:24px; box-shadow:0 16px 40px rgba(0,0,0,.08); }
        .section-title { font-weight:600; font-size:1.25rem; margin-bottom:1rem; color:var(--jet); }
        .order-details{ transition:all .3s ease; }
        .toggle-icon{ transition:transform .3s ease; }
        .toggle-icon.rotate{ transform:rotate(180deg); }
        label{ display:block; margin-bottom:.5rem; font-weight:500; color:var(--jet); }
        .input{ border:1px solid #d1d5db; border-radius:.375rem; padding:.5rem; width:100%; }
        .input:focus{ outline:none; border-color:var(--teal); box-shadow:0 0 0 2px rgba(0,128,128,.15); }

        body{ position:relative; min-height:100vh; font-family:'Poppins',sans-serif; z-index:0; overflow-x:hidden; }
        body::before{
            content:'';
            position:fixed; inset:0;
            background-image:url('../images/cover.jpg');
            background-size:cover; background-position:center;
            filter:blur(3px); opacity:.6; z-index:-1;
        }
        .card,.btn{ position:relative; z-index:1; }
    </style>
</head>
<body class="min-h-screen py-8">

<div class="max-w-4xl mx-auto px-4">
    <!-- Header -->
    <div class="flex justify-between items-center mb-6">
        <div style="font-family:'Pacifico',cursive; font-size:30px; color:var(--teal);">Matchy Matchy</div>
        <button onclick="logout()" class="btn bg-[var(--umber)]">Logout</button>
    </div>

    <!-- Avatar -->
    <div class="text-center mb-8">
        <div class="relative inline-block">
            <img id="avatar" src="" class="w-28 h-28 rounded-full object-cover border shadow" alt="Avatar">
            <label for="avatar_file" class="absolute bottom-1 right-1 bg-white rounded-full p-1 cursor-pointer border border-gray-300">
                <i class="ri-camera-line text-lg text-gray-600"></i>
            </label>
            <input type="file" id="avatar_file" accept="image/*" class="hidden">
        </div>
        <p class="mt-2 text-sm text-gray-600">Change Image</p>
    </div>

    <!-- Settings Form -->
    <div class="card mb-8">
        <div class="section-title">Account Settings</div>
        <form id="settings-form" class="grid grid-cols-1 sm:grid-cols-2 gap-4" enctype="multipart/form-data">
            <div>
                <label>First Name</label>
                <input class="input" id="first_name" name="first_name" required>
            </div>
            <div>
                <label>Last Name</label>
                <input class="input" id="last_name" name="last_name" required>
            </div>
            <div class="sm:col-span-2">
                <label>Email Address</label>
                <input id="email" name="email" class="input bg-gray-100" readonly>
            </div>
            <div class="sm:col-span-2">
                <label>Avatar URL</label>
                <input id="avatar_url" name="avatar" class="input">
            </div>
            <div class="sm:col-span-2">
                <label>New Password (Optional)</label>
                <input type="password" id="password" name="password" class="input">
            </div>
            <div class="sm:col-span-2 mt-2">
                <button type="submit" class="btn w-full">Save Changes</button>
                <p id="response" class="text-center text-sm mt-2"></p>
            </div>
        </form>
    </div>

    <!-- Orders Section -->
    <div class="card">
        <div class="section-title">Previous Orders</div>
        <div id="orders-list"></div>
    </div>
</div>

<script>
    // === Load user data (SESSION-based) ===
    async function loadUserData() {
        try {
            const res = await fetch('../backend/settings.php', { credentials: 'include' });
            if (!res.ok) throw new Error('Failed to fetch user data');
            const u = await res.json();

            if (u.error && !u.ok) {
                document.getElementById('response').textContent = u.error || 'Unauthorized';
                return;
            }

            document.getElementById('avatar').src = u.avatar ? `../backend/${u.avatar}` : 'https://via.placeholder.com/150';
            document.getElementById('first_name').value = u.first_name || '';
            document.getElementById('last_name').value  = u.last_name  || '';
            document.getElementById('email').value      = u.email      || '';
            document.getElementById('avatar_url').value = u.avatar     || '';
        } catch (error) {
            console.error('Error loading user data:', error);
            document.getElementById('response').textContent = 'Error loading user data';
        }
    }
    loadUserData();

    // Preview + validate avatar file
    document.getElementById('avatar_file').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const allowedTypes = ['image/jpeg', 'image/png', 'image/webp'];
        if (!allowedTypes.includes(file.type)) {
            document.getElementById('response').textContent = 'Only JPG, PNG, and WebP images are allowed';
            e.target.value = '';
            return;
        }
        if (file.size > 2 * 1024 * 1024) {
            document.getElementById('response').textContent = 'Image must be less than 2MB';
            e.target.value = '';
            return;
        }

        const url = URL.createObjectURL(file);
        document.getElementById('avatar').src = url;
        document.getElementById('response').textContent = '';
    });

    // Save settings (SESSION-based)
    document.getElementById('settings-form').addEventListener('submit', async (e) => {
        e.preventDefault();

        const formData = new FormData(e.target);
        const avatarFile = document.getElementById('avatar_file').files[0];
        if (avatarFile) formData.append('avatar_file', avatarFile);

        try {
            const res = await fetch('../backend/settings.php', {
                method: 'POST',
                body: formData,
                credentials: 'include'
            });
            const j = await res.json();
            document.getElementById('response').textContent = j.message || (j.error || 'Unknown error');
            if (j.avatar) {
                document.getElementById('avatar').src = `../backend/${j.avatar}`;
                document.getElementById('avatar_url').value = j.avatar;
            }
        } catch (error) {
            console.error('Error saving settings:', error);
            document.getElementById('response').textContent = 'Error saving settings';
        }
    });

    function logout() {
        // إن كان عندك endpoint لتسجيل الخروج، استدعيه ثم أعيدي التوجيه
        window.location.href = '../sign-in.php';
    }

    // === Orders (SESSION-based) ===
    async function loadOrders() {
        const list = document.getElementById('orders-list');
        try {
            const res = await fetch(`../backend/get_user_orders.php`, { credentials: 'include' });
            const j = await res.json();
            const orders = j.orders || [];

            if (!orders.length) {
                list.innerHTML = '<p class="text-gray-500 text-center py-4">No orders found</p>';
                return;
            }
            list.innerHTML = orders.map(renderOrderCard).join('');
        } catch (error) {
            console.error('Error loading orders:', error);
            list.innerHTML = '<p class="text-red-500 text-center py-4">Error loading orders</p>';
        }
    }

    function toggleDetails(btn) {
        const card = btn.closest('.border.rounded-lg');
        const details = card?.querySelector('.order-details');
        if (!details) return;
        details.classList.toggle('hidden');
        btn.querySelector('.toggle-icon')?.classList.toggle('rotate');
    }

    function renderOrderCard(order) {
        const cur = n => `₪${Number(n ?? 0).toFixed(2)}`;
        const fmtDate = d => {
            const t = d || order.order_date || order.created_at || order.createdAt || '';
            return t ? new Date(t.replace(' ', 'T')).toLocaleString() : '';
        };
        const val = (a, ...alts) => a ?? alts.find(v => v != null);

        const idText    = val(order.public_id, order.publicId, `ORD-${order.id ?? '—'}`);
        const dateText  = fmtDate(order.date);
        const payStat   = val(order.payment_status, order.paymentStatus, '—');
        const ordStat   = val(order.order_status, order.orderStatus, '—');

        const subtotal  = Number(val(order.subtotal, order.sub_total, order.items_subtotal, 0));
        const shipping  = Number(val(order.shipping, order.shipping_cost, 0));
        const tax       = Number(val(order.tax, order.vat, 0));
        const total     = Number(val(order.total, order.total_amount, order.order_total, subtotal + shipping + tax));

        const custName  = val(order.customer_name, order.customerName, '');
        const custEmail = val(order.customer_email, order.customerEmail, '');
        const custPhone = val(order.customer_phone, order.customerPhone, '');
        const custAddr  = val(order.customer_address, order.customerAddress, '');

        const items = order.items || order.order_items || [];
        const itemsHtml = items.map(it => {
            const name  = val(it.product_name, it.name, it.productName, 'Item');
            const price = Number(val(it.unit_price, it.price, 0));
            const qty   = Number(val(it.quantity, it.qty, 1));
            return `• ${name} — ${cur(price)} × ${qty}`;
        }).join('<br>');

        const badge = (text, tone) => `
            <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs border"
                  style="border-color:${tone}; color:${tone}">
              ${text}
            </span>`;

        return `
          <div class="border rounded-lg p-4 mb-3 bg-gray-50">
            <div class="flex flex-wrap items-start justify-between gap-3">
              <div>
                <div class="text-lg font-semibold">Order #${idText}</div>
                <div class="text-sm text-gray-500">${dateText}</div>
                ${custName || custEmail || custPhone ? `
                  <div class="text-xs text-gray-600 mt-1">
                    ${custName ? `<div>${custName}</div>` : ''}
                    ${custEmail ? `<div>${custEmail}</div>` : ''}
                    ${custPhone ? `<div>${custPhone}</div>` : ''}
                    ${custAddr ? `<div class="mt-1">${custAddr}</div>` : ''}
                  </div>` : ''}
              </div>

              <div class="text-right">
                <div class="flex items-center gap-2 justify-end mb-1">
                  ${badge(`Payment: ${payStat}`, '#008080')}
                  ${badge(`Status: ${ordStat}`, '#6B5B51')}
                </div>
                <div class="text-sm text-gray-600">Subtotal: ${cur(subtotal)}</div>
                <div class="text-sm text-gray-600">Shipping: ${cur(shipping)}</div>
                <div class="text-sm text-gray-600">Tax: ${cur(tax)}</div>
                <div class="font-semibold text-base mt-1">${cur(total)}</div>

                <button onclick="toggleDetails(this)"
                        class="text-sm text-teal-700 mt-2 inline-flex items-center gap-1 border px-2 py-1 rounded">
                  Show Details <i class="ri-arrow-down-s-line toggle-icon"></i>
                </button>
              </div>
            </div>

            <div class="order-details hidden mt-3 pl-1 text-sm text-gray-700">
              ${itemsHtml || '<span class="text-gray-400">No items</span>'}
            </div>
          </div>`;
    }

    loadOrders();
</script>
</body>
</html>
