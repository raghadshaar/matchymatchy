<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Baby Girl Pajamas - Baby Clothing Store</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <script>
        tailwind.config={theme:{extend:{colors:{primary:'#008080',secondary:'#FADADD'},borderRadius:{none:'0px',sm:'4px',DEFAULT:'8px',md:'12px',lg:'16px',xl:'20px','2xl':'24px','3xl':'32px',full:'9999px',button:'8px'}}}}
    </script>

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- Styles -->
    <link rel="stylesheet" href="../styles/productStyle.css"/>
    <link rel="stylesheet" href="../styles/style.css"/>

    <!-- سكربتاتك (مؤجلة لتفادي التعارض) -->
    <script src="../js/indexscript.js" defer></script>
    <script src="../js/cart.js" defer></script>

    <style>
        :where([class^="ri-"])::before{content:"\f3c2"}
        body{background-color:#FEFEFA}
        .product-card{transition:transform .2s,box-shadow .2s}
        .product-card:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(0,0,0,.1)}
        .add-btn,.filter-btn{transition:all .2s}
        .add-btn:hover{transform:scale(1.1)}
        .filter-btn:hover{background-color:rgba(0,128,128,.1)}
        .nav-link{transition:color .2s}
        .nav-link:hover{color:#008080}
        .similar-product-title{font-size:.9rem;margin-bottom:5px;color:var(--jet)}
        .similar-product-price{font-weight:bold;color:var(--teal);margin-bottom:8px}
        .header-shadow{box-shadow:0 2px 10px rgba(0,0,0,.05)}
        .custom-checkbox{appearance:none;width:18px;height:18px;border:2px solid #ccc;border-radius:4px;position:relative;cursor:pointer}
        .custom-checkbox:checked{background-color:#008080;border-color:#008080}
        .custom-checkbox:checked::after{content:"✓";position:absolute;top:-2px;left:2px;color:#fff;font-size:12px;font-weight:bold}

        /* مهم: تأكيد ظهور الهيدر حتى لو كان عندك CSS آخر يخفيه */
        .main-header{display:block!important;visibility:visible!important;opacity:1!important;height:auto!important}
    </style>
</head>

<body>

<!-- مكان الهيدر -->
<div id="header-slot"></div>

<!-- شريط علوي للصفحة -->
<div class="w-full px-6 py-6 bg-gray-50 border-b" style="background-color:#F9F8F3">
    <div class="mb-4">
        <nav class="text-sm text-gray-500 mb-2">
            <span>Home</span> / <span>Baby Girl</span> / <span class="text-gray-800">Pajamas</span>
        </nav>
        <h1 class="text-2xl font-bold text-gray-800">
            Baby Girl Pajamas <span class="text-lg font-normal text-gray-600">(149 items)</span>
        </h1>
    </div>
    <div class="flex flex-wrap items-center gap-4">
        <button class="filter-btn flex items-center gap-2 px-4 py-2 border border-gray-300 rounded-lg bg-white hover:bg-gray-50">
            <span>All Filters</span>
            <span class="bg-primary text-white text-xs px-2 py-1 rounded-full">5</span>
        </button>
        <div class="relative">
            <select class="filter-btn px-4 py-2 border border-gray-300 rounded-lg bg-white appearance-none pr-8 cursor-pointer">
                <option>Size</option><option>Newborn</option><option>0-3M</option><option>3-6M</option>
                <option>6-9M</option><option>9-12M</option><option>12-18M</option><option>18-24M</option>
            </select>
            <div class="absolute right-2 top-1/2 transform -translate-y-1/2 pointer-events-none">
                <i class="ri-arrow-down-s-line text-gray-500"></i>
            </div>
        </div>
        <div class="relative">
            <select class="filter-btn px-4 py-2 border border-gray-300 rounded-lg bg-white appearance-none pr-8 cursor-pointer">
                <option>Fabric</option><option>Cotton</option><option>Organic Cotton</option><option>Bamboo</option><option>Modal</option>
            </select>
            <div class="absolute right-2 top-1/2 transform -translate-y-1/2 pointer-events-none">
                <i class="ri-arrow-down-s-line text-gray-500"></i>
            </div>
        </div>
        <div class="relative">
            <select class="filter-btn px-4 py-2 border border-gray-300 rounded-lg bg-white appearance-none pr-8 cursor-pointer">
                <option>Style</option><option>Footie</option><option>Two-piece</option><option>Sleep Sack</option><option>Gown</option>
            </select>
            <div class="absolute right-2 top-1/2 transform -translate-y-1/2 pointer-events-none">
                <i class="ri-arrow-down-s-line text-gray-500"></i>
            </div>
        </div>
        <div class="flex items-center gap-2 ml-auto">
            <input type="checkbox" id="pickup" class="custom-checkbox">
            <label for="pickup" class="text-sm text-gray-700 cursor-pointer">Free 1-hour pickup</label>
        </div>
    </div>
</div>

<main class="w-full px-6 py-8">
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
        <!-- بطاقات المنتجات … (كما لديك) -->
        <div class="similar-product-card relative">
            <img src="../images/Modal Cloud Print Footie Pajamas.jpg" alt="Modal Cloud Print Footie Pajamas">
            <h3 class="similar-product-title" style="padding-top:20px;font-size:20px">Modal Cloud Print Footie Pajamas</h3>
            <div class="similar-product-price">₪59</div>
            <div class="flex justify-center items-center" style="font-size:30px;padding-right:20px;">
                <div class="star-rating flex" style="padding-right:20px;">
                    <button class="star text-gray-300 hover:text-yellow-400" data-rating="1">★</button>
                    <button class="star text-gray-300 hover:text-yellow-400" data-rating="2">★</button>
                    <button class="star text-gray-300 hover:text-yellow-400" data-rating="3">★</button>
                    <button class="star text-gray-300 hover:text-yellow-400" data-rating="4">★</button>
                    <button class="star text-gray-300 hover:text-yellow-400" data-rating="5">★</button>
                </div>
                <button class="like-btn flex items-center gap-1 text-gray-400 hover:text-red-400 transition-colors">
                    <i class="ri-heart-line"></i><span class="text-xs like-count">156</span>
                </button>
            </div>
            <button class="add-btn absolute bottom-4 right-4 z-10 w-12 h-12 bg-secondary rounded-full flex items-center justify-center text-white shadow-lg" style="background-color:#E4CFC3">
                <i class="ri-add-line text-sm" style="font-size:30px"></i>
            </button>
        </div>

        <!-- … كرري بقية البطاقات كما هي … -->
    </div>
</main>

<div id="foot"></div>

<!-- تفعيل أزرار الإضافة / لايك / تقييم -->
<script>
    document.addEventListener('DOMContentLoaded', function() {
        // لايك
        document.querySelectorAll('.like-btn').forEach(btn=>{
            let liked=false;
            btn.addEventListener('click',function(){
                const icon=this.querySelector('i'); const count=this.querySelector('.like-count');
                const cur=parseInt(count.textContent);
                if(!liked){ icon.classList.replace('ri-heart-line','ri-heart-fill'); this.classList.add('text-red-400'); count.textContent=cur+1; }
                else{ icon.classList.replace('ri-heart-fill','ri-heart-line'); this.classList.remove('text-red-400'); count.textContent=cur-1; }
                liked=!liked;
            });
        });
        // تقييم
        document.querySelectorAll('.star-rating').forEach(container=>{
            const stars=container.querySelectorAll('.star');
            stars.forEach(star=>{
                star.addEventListener('click',function(){
                    const r=+this.getAttribute('data-rating');
                    stars.forEach((s,i)=>{ s.classList.toggle('text-yellow-400',i<r); s.classList.toggle('text-gray-300',i>=r); });
                });
            });
        });
        // زر +
        document.querySelectorAll('.add-btn').forEach(btn=>{
            btn.addEventListener('click',e=>{
                e.preventDefault();
                const badge=document.getElementById('global-cart-count'); // من الهيدر بعد حقنه
                if(badge){ badge.textContent=String((+badge.textContent||0)+1); }
                btn.style.transform='scale(1.2)'; setTimeout(()=>btn.style.transform='scale(1)',200);
            });
        });
    });
</script>

<!-- Footer -->
<script>
    fetch('footer.html').then(r=>r.text()).then(html=>{ document.getElementById('foot').innerHTML=html; });
</script>

<!-- تحميل الهيدر (المسار الذي عمل معك في test2.html) -->
<script>
    (function loadHeader(){
        const mount=document.getElementById('header-slot');
        if(!mount){ console.error('Missing #header-slot'); return; }
        const ABS='/matchymatchy/HTML/header.html?v='+Date.now(); // نفس المسار المستخدم في test2.html
        fetch(ABS,{cache:'no-store'})
            .then(r=>{ console.log('Header status:',r.status,r.url); return r.ok?r.text():Promise.reject(r.status); })
            .then(html=>{ mount.innerHTML=html; console.log('HEADER INJECTED'); })
            .catch(err=>{ console.error('Failed to load header:',err); mount.innerHTML='<div style="color:#b00020">Failed to load header</div>'; });
    })();
</script>
</body>
</html>
